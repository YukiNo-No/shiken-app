<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f6b">
<meta name="description" content="体外循環技術認定士対策問題集(全19章390問)を分野別練習・模擬試験モードで学習できるアプリ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>体外循環技術認定士 対策問題集</title>
<style>
  :root{
    --bg:#F7F7F5;
    --surface:#FFFFFF;
    --surface-2:#F0F1EE;
    --ink:#1D1D1B;
    --muted:#6B6B66;
    --border:#E2E2DD;
    --accent:#1F6F6B;
    --accent-strong:#175450;
    --accent-ink:#FFFFFF;
    --accent-soft:#E6F1F0;
    --correct:#1D7A4C;
    --correct-soft:#E5F3EC;
    --danger:#B3261E;
    --danger-soft:#FBEAE9;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15170F1a;
      --bg:#14150F;
      --surface:#1C1E17;
      --surface-2:#242720;
      --ink:#EDECE6;
      --muted:#A3A69A;
      --border:#33362C;
      --accent:#4FBDAE;
      --accent-strong:#7FD2C6;
      --accent-ink:#062622;
      --accent-soft:#1B3733;
      --correct:#5FBE86;
      --correct-soft:#1A3324;
      --danger:#F0897C;
      --danger-soft:#3A211C;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14150F;
    --surface:#1C1E17;
    --surface-2:#242720;
    --ink:#EDECE6;
    --muted:#A3A69A;
    --border:#33362C;
    --accent:#4FBDAE;
    --accent-strong:#7FD2C6;
    --accent-ink:#062622;
    --accent-soft:#1B3733;
    --correct:#5FBE86;
    --correct-soft:#1A3324;
    --danger:#F0897C;
    --danger-soft:#3A211C;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
    font-size:15px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    padding-inline:16px;
    padding-block:20px 64px;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:600px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  h1,h2,h3{ line-height:1.35; text-wrap:balance; margin:0; }
  a{color:var(--accent);}
  button{font-family:inherit;}
  button:focus-visible, [tabindex]:focus-visible, input:focus-visible, select:focus-visible{
    outline:2.5px solid var(--accent);
    outline-offset:2px;
  }

  /* ---------- header ---------- */
  .topbar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .brand-name{
    font-size:19px;
    font-weight:700;
    letter-spacing:.01em;
  }
  .brand-sub{
    font-size:12px;
    color:var(--muted);
  }
  .icon-btn{
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink);
    border-radius:8px;
    padding:7px 12px;
    font-size:13px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .icon-btn:hover{background:var(--surface-2);}

  /* ---------- generic cards / sections ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px;
  }
  .section-title{
    font-size:15px;
    font-weight:700;
    color:var(--ink);
    margin-bottom:4px;
  }
  .section-note{
    font-size:12px;
    color:var(--muted);
    margin-bottom:12px;
  }

  /* ---------- practice: chapter accordion ---------- */
  .chapter-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .chapter-card{
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    background:var(--surface);
  }
  .chapter-head{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 12px;
    background:var(--surface);
    border:none;
    text-align:left;
    cursor:pointer;
    color:var(--ink);
    font-size:13.5px;
  }
  .chapter-head:hover{background:var(--surface-2);}
  .chapter-badge{
    flex:none;
    width:26px;
    height:26px;
    border-radius:7px;
    font-size:12px;
    font-weight:700;
    color:var(--accent-strong);
    background:var(--accent-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    font-variant-numeric:tabular-nums;
  }
  .chapter-info{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
  }
  .chapter-name{
    font-weight:600;
    overflow-wrap:break-word;
  }
  .chapter-count{
    font-size:11.5px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
    margin-top:2px;
  }
  .chapter-chevron{
    flex:none;
    color:var(--muted);
    font-size:11px;
    transition:transform .15s;
  }
  .chapter-card[data-open="true"] .chapter-chevron{ transform:rotate(180deg); }
  .chapter-body{
    padding:10px 12px 14px;
    border-top:1px solid var(--border);
    display:none;
  }
  .chapter-card[data-open="true"] .chapter-body{ display:block; }
  .qnum-all-btn{
    width:100%;
    border:1.5px solid var(--accent);
    background:var(--accent-soft);
    color:var(--accent-strong);
    font-weight:700;
    font-size:13.5px;
    border-radius:9px;
    padding:10px;
    cursor:pointer;
    margin-bottom:10px;
  }
  .qnum-all-btn:hover{ background:var(--accent); color:var(--accent-ink); }
  .qnum-label{
    font-size:11.5px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .qnum-grid{
    display:grid;
    grid-template-columns:repeat(10, 1fr);
    gap:5px;
  }
  @media (max-width:420px){
    .qnum-grid{ grid-template-columns:repeat(5, 1fr); }
  }
  .qnum-btn{
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--ink);
    border-radius:7px;
    padding:8px 0;
    font-size:12.5px;
    cursor:pointer;
    font-variant-numeric:tabular-nums;
  }
  .qnum-btn:hover{ border-color:var(--accent); color:var(--accent-strong); }

  /* ---------- exam: selects ---------- */
  .field-row{
    display:flex;
    flex-direction:column;
    gap:5px;
    margin-bottom:12px;
  }
  .field-row label{
    font-size:12.5px;
    color:var(--muted);
    font-weight:600;
  }
  select{
    width:100%;
    border:1.5px solid var(--border);
    background:var(--surface);
    color:var(--ink);
    border-radius:9px;
    padding:10px 12px;
    font-size:14px;
    font-family:inherit;
    cursor:pointer;
    appearance:none;
    -webkit-appearance:none;
    background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='none' stroke='%236B6B66' stroke-width='2'%3e%3cpath d='M5 8l5 5 5-5'/%3e%3c/svg%3e");
    background-repeat:no-repeat;
    background-position:right 12px center;
    padding-right:34px;
  }

  .pool-note{
    font-size:12px;
    color:var(--muted);
    margin-bottom:12px;
  }
  .pool-note strong{color:var(--ink); font-variant-numeric:tabular-nums;}

  .primary-btn{
    width:100%;
    border:none;
    background:var(--accent);
    color:var(--accent-ink);
    font-weight:700;
    font-size:15px;
    border-radius:10px;
    padding:13px;
    cursor:pointer;
  }
  .primary-btn:hover{ background:var(--accent-strong); }
  .primary-btn:disabled{
    background:var(--surface-2);
    color:var(--muted);
    cursor:not-allowed;
  }
  .ghost-btn{
    width:100%;
    border:1.5px solid var(--border);
    background:transparent;
    color:var(--ink);
    font-weight:700;
    font-size:14px;
    border-radius:10px;
    padding:11px;
    cursor:pointer;
  }
  .ghost-btn:hover{ background:var(--surface-2); }

  .footer-note{
    font-size:11.5px;
    color:var(--muted);
    line-height:1.6;
    text-align:center;
    padding:4px 8px;
  }

  /* ---------- quiz runner ---------- */
  .runner-top{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .progress-track{
    flex:1;
    height:7px;
    border-radius:999px;
    background:var(--surface-2);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    border-radius:999px;
    transition:width .25s ease;
  }
  .progress-label{
    font-size:12px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .tag-pill{
    display:inline-block;
    font-size:11px;
    color:var(--accent-strong);
    background:var(--accent-soft);
    border-radius:999px;
    padding:3px 10px;
    margin-bottom:10px;
    letter-spacing:.02em;
  }
  .stem{
    font-size:15.5px;
    line-height:1.75;
    white-space:pre-wrap;
    margin-bottom:16px;
  }
  .choice-list{
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .choice-btn{
    display:flex;
    align-items:flex-start;
    gap:10px;
    text-align:left;
    border:1.5px solid var(--border);
    background:var(--surface);
    color:var(--ink);
    border-radius:10px;
    padding:11px 13px;
    font-size:14px;
    line-height:1.55;
    cursor:pointer;
  }
  .choice-btn:hover:not(:disabled){background:var(--surface-2);}
  .choice-btn .cmark{
    flex:none;
    width:22px; height:22px;
    border-radius:50%;
    border:1.5px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-size:11.5px; font-weight:700;
    color:var(--muted);
    background:var(--surface);
  }
  .choice-btn.selected{border-color:var(--accent); background:var(--accent-soft);}
  .choice-btn.selected .cmark{border-color:var(--accent); color:var(--accent-strong);}
  .choice-btn:disabled{cursor:default;}

  .choice-btn.correct-answer{border-color:var(--correct); background:var(--correct-soft);}
  .choice-btn.correct-answer .cmark{background:var(--correct); border-color:var(--correct); color:#fff;}
  .choice-btn.wrong-answer{border-color:var(--danger); background:var(--danger-soft);}
  .choice-btn.wrong-answer .cmark{background:var(--danger); border-color:var(--danger); color:#fff;}

  .feedback-banner{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:700;
    font-size:14px;
    border-radius:9px;
    padding:10px 12px;
    margin-top:14px;
  }
  .feedback-banner.ok{background:var(--correct-soft); color:var(--correct);}
  .feedback-banner.ng{background:var(--danger-soft); color:var(--danger);}

  .expl-list{
    margin-top:12px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .expl-item{
    display:flex;
    gap:8px;
    font-size:12.5px;
    line-height:1.6;
    color:var(--muted);
    padding:9px 11px;
    border-radius:9px;
    background:var(--surface-2);
  }
  .expl-item .emark{flex:none; font-weight:700; color:var(--ink);}
  .expl-item.is-correct{background:var(--correct-soft); color:var(--ink);}
  .expl-item.is-correct .emark{color:var(--correct);}
  .expl-item.is-picked-wrong{background:var(--danger-soft); color:var(--ink);}
  .expl-item.is-picked-wrong .emark{color:var(--danger);}

  .nav-row{
    display:flex;
    gap:10px;
    margin-top:16px;
  }
  .nav-row .primary-btn, .nav-row .ghost-btn{margin:0;}

  /* ---------- results ---------- */
  .score-hero{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    padding:20px 16px 16px;
    text-align:center;
  }
  .score-ring{
    width:112px; height:112px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:conic-gradient(var(--accent) calc(var(--pct,0)*1%), var(--surface-2) 0);
    position:relative;
  }
  .score-ring::before{
    content:"";
    position:absolute;
    inset:8px;
    border-radius:50%;
    background:var(--surface);
  }
  .score-ring .score-num{
    position:relative;
    font-size:26px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
  }
  .score-caption{font-size:13px; color:var(--muted);}
  .score-caption strong{color:var(--ink); font-variant-numeric:tabular-nums;}

  .chapter-breakdown{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:4px;
  }
  .cb-row{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .cb-top{
    display:flex;
    justify-content:space-between;
    font-size:12.5px;
  }
  .cb-name{ color:var(--ink); }
  .cb-stat{ color:var(--muted); font-variant-numeric:tabular-nums; }
  .cb-track{
    height:6px;
    border-radius:999px;
    background:var(--surface-2);
    overflow:hidden;
  }
  .cb-fill{
    height:100%;
    background:var(--accent);
    border-radius:999px;
  }

  .review-toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
  }
  .review-toolbar .section-title{margin-bottom:0;}
  .chip-btn{
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--ink);
    border-radius:999px;
    padding:5px 12px;
    font-size:12px;
    cursor:pointer;
  }

  .review-item{
    border:1px solid var(--border);
    border-radius:10px;
    margin-bottom:10px;
    overflow:hidden;
    background:var(--surface);
  }
  .review-head{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 13px;
    cursor:pointer;
    background:var(--surface);
  }
  .review-badge{
    flex:none;
    width:22px;height:22px;
    border-radius:50%;
    font-size:12px;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .review-badge.ok{background:var(--correct-soft); color:var(--correct);}
  .review-badge.ng{background:var(--danger-soft); color:var(--danger);}
  .review-stem{
    flex:1;
    font-size:13.5px;
    line-height:1.5;
    white-space:pre-wrap;
  }
  .review-chev{
    flex:none;
    color:var(--muted);
    font-size:12px;
    transition:transform .15s;
  }
  .review-item[data-open="true"] .review-chev{transform:rotate(90deg);}
  .review-body{
    padding:0 13px 13px;
    display:none;
  }
  .review-item[data-open="true"] .review-body{display:block;}
  .review-body .choice-btn{cursor:default;}
  .review-body .choice-btn:hover{background:inherit;}

  .empty-note{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    padding:20px;
  }

  [hidden]{display:none !important;}
</style>

</head>
<body>
<div id="app">

  <!-- ============ HOME ============ -->
  <section id="view-home">
    <div class="topbar">
      <span class="brand-name">体外循環技術認定士 対策問題集</span>
      <span class="brand-sub" id="brand-sub">分野別練習・模擬試験</span>
    </div>

    <!-- 分野別練習 -->
    <div class="card">
      <div class="section-title">分野別練習</div>
      <div class="section-note">（章をタップすると問題番号を選べます。1問ごとに正誤と解説を表示します）</div>
      <div class="chapter-list" id="chapter-list"></div>
    </div>

    <!-- ランダム / 模擬試験 -->
    <div class="card">
      <div class="section-title">ランダム / 模擬試験</div>
      <div class="section-note">（出題順はランダム。最後にまとめて採点・解説）</div>

      <div class="field-row">
        <label for="exam-count">出題数</label>
        <select id="exam-count"></select>
      </div>
      <div class="field-row" style="margin-bottom:6px;">
        <label for="exam-scope">出題範囲</label>
        <select id="exam-scope"></select>
      </div>
      <div class="pool-note" id="pool-note"></div>
      <button type="button" class="primary-btn" id="btn-start-exam">開始</button>
    </div>

    <div class="footer-note">成績はこのセッション内でのみ集計され、保存されません。本アプリは非公式の自主学習教材です。</div>
  </section>

  <!-- ============ QUIZ RUNNER (practice + exam share this) ============ -->
  <section id="view-quiz" hidden>
    <div class="topbar">
      <button type="button" class="icon-btn" id="btn-quit">← 中断してホームへ</button>
      <span class="progress-label" id="progress-label">問 1 / 10</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>

    <div class="card">
      <span class="tag-pill" id="q-chapter-tag"></span>
      <div class="stem" id="q-stem"></div>
      <div class="choice-list" id="q-choices"></div>

      <div id="feedback-area"></div>

      <div class="nav-row">
        <button type="button" class="ghost-btn" id="btn-prev" hidden>前の問題</button>
        <button type="button" class="primary-btn" id="btn-next" disabled>次の問題</button>
      </div>
    </div>
  </section>

  <!-- ============ RESULTS ============ -->
  <section id="view-results" hidden>
    <div class="topbar">
      <span class="brand-name" style="font-size:17px;">結果</span>
      <button type="button" class="icon-btn" id="btn-home-from-results">ホームへ</button>
    </div>

    <div class="card score-hero">
      <div class="score-ring" id="score-ring" style="--pct:0;"><span class="score-num" id="score-num">0%</span></div>
      <div class="score-caption" id="score-caption">正解 <strong>0</strong> / <strong>0</strong> 問</div>
    </div>

    <div class="card" id="breakdown-card">
      <div class="section-title">分野別内訳</div>
      <div class="chapter-breakdown" id="chapter-breakdown"></div>
    </div>

    <div class="card">
      <div class="review-toolbar">
        <div class="section-title" style="margin-bottom:0;">解答と解説（全問）</div>
        <button type="button" class="chip-btn" id="btn-expand-all">すべて開く</button>
      </div>
      <div id="review-list"></div>
    </div>

    <button type="button" class="ghost-btn" id="btn-retry">同じ条件でもう一度</button>
  </section>

</div>

<script type="application/json" id="quiz-data">[{"title":"第1章：血液ポンプ","code":"bp","questions":[{"stem":"ローラーポンプのチューブの圧閉度（オクルージョン）が強すぎた場合、引き起こされる悪影響はどれか？","choices":["キャビテーション","溶血","逆流","空気塞栓","送血流量の増加"],"correct":1,"expl":["キャビテーションは圧閉が弱すぎる場合に、逆流に伴う流速増加と静圧低下によって生じる現象であり、圧閉過多とは逆の状態で起こる。","（正解）ローラーによりチューブが過度に圧迫されると、内部の血球成分が機械的に破壊され溶血が生じる。","逆流は圧閉が不十分（弱すぎる）場合に生じる現象であり、圧閉過多では起こりにくい。","空気塞栓は回路内への空気混入が原因であり、チューブの圧閉度そのものとは直接関係しない。","ローラーポンプの送血流量は回転数と1回転あたりの吐出量で規定されるため、圧閉度を強めても流量が増加するわけではない。"]},{"stem":"ローラーポンプにおいて、チューブの圧閉が不十分（弱すぎる）な場合、逆流によって起こる危険な発泡現象は何か？","choices":["キャビテーション","血漿漏出","凝血","溶血尿","エアロック（気閉）"],"correct":0,"expl":["（正解）圧閉不足による逆流で局所的に流速が増し静圧が低下すると、微小気泡が発生するキャビテーションが生じる。","血漿漏出は主に多孔質膜の人工肺で長時間使用時に生じる現象であり、ローラーポンプの圧閉不足とは無関係である。","凝血は抗凝固不足や血流停滞など別の要因で生じるものであり、圧閉不足による発泡現象ではない。","溶血尿は溶血の結果として生じる臨床所見であり、発泡現象そのものを指す語ではない。","エアロック（気閉）は貯血槽やポンプヘッド内に空気が捕捉されて送血できなくなる現象であり、圧閉不足による発泡とは異なる。"]},{"stem":"ローラーポンプは、回転数とチューブの内径（血液容量）が分かれば何を容易に計算・把握できるか？","choices":["血圧","血液粘度","血流量","ヘマトクリット値","灌流抵抗"],"correct":2,"expl":["血圧はポンプ下流の血管抵抗などに左右され、回転数とチューブ内径だけでは求められない。","血液粘度は血液の性状（ヘマトクリット値や温度など）によって決まるものであり、ポンプの回転数とは無関係である。","（正解）ローラーポンプは1回転あたりの吐出量（チューブ内径・長さで規定）が一定な定量ポンプであるため、回転数から血流量を容易に算出できる。","ヘマトクリット値は血液中の血球成分の割合であり、ポンプの運転条件からは求められない。","灌流抵抗は血管系の状態によって変化するものであり、ポンプの回転数・チューブ内径から直接計算できるものではない。"]},{"stem":"遠心ポンプを完全に停止した時や極端に低流量で運転した際、構造上生じやすい現象はどれか？","choices":["回路の破裂","キャビテーション","高度な溶血","逆流","送血側の陽圧上昇"],"correct":3,"expl":["回路の破裂は送血側の過度な閉塞などで生じるものであり、停止・低流量時に特有の現象ではない。","キャビテーションは主に脱血側の強い陰圧などで生じる発泡現象であり、遠心ポンプの停止・低流量時に特有の問題ではない。","高度な溶血は高回転での長時間運転や過度な陰圧などで生じやすく、停止時にはむしろ問題になりにくい。","（正解）遠心ポンプにはチューブ圧閉部や弁のような逆流防止構造がないため、停止時や極端な低流量時には送血側から脱血側へ血液が逆流する。","逆流が生じると送血側の圧はむしろ低下する方向に働くため、陽圧上昇が生じるわけではない。"]},{"stem":"遠心ポンプのモーターとポンプヘッドは、どのような仕組みで動力を伝達しているか？","choices":["ギア結合","磁気結合（マグネットカップリング）","空気圧駆動","水力駆動","ベルト駆動"],"correct":1,"expl":["ギア結合は歯車による機械的な直接連結であり、遠心ポンプのヘッド駆動方式ではない。","（正解）モーターの回転をマグネットの磁力でポンプヘッド内のインペラーへ非接触で伝達する磁気結合方式が用いられ、血液接触部と駆動部を分離できる。","空気圧駆動はIABPなど別の装置で用いられる動力源であり、遠心ポンプの一般的な駆動方式ではない。","水力駆動という方式は遠心ポンプには用いられていない。","ベルト駆動は機械的な接触伝達方式であり、滅菌性・気密性の観点から遠心ポンプには採用されていない。"]},{"stem":"遠心ポンプの血液を回転させる構造には、インペラー（羽根車）型と、もう一つ何型があるか？","choices":["スクリュー型","コーン型","ローラー型","遠心分離型","ダイアフラム型"],"correct":1,"expl":["スクリュー型は軸流ポンプに近い構造であり、遠心ポンプの分類には含まれない。","（正解）円錐状のコーンを回転させ、その表面摩擦と血液の粘性を利用して渦流を発生させるコーン型が、インペラー型と並ぶ遠心ポンプの構造である。","ローラー型は容積型（管圧迫型）ポンプの分類であり、遠心ポンプの構造分類ではない。","遠心分離型は血液成分分離装置などで用いられる語であり、遠心ポンプの駆動構造の名称ではない。","ダイアフラム型は拍動流を生成する容積型ポンプ（拍動型VADなど）に用いられる構造であり、遠心ポンプの分類ではない。"]},{"stem":"遠心ポンプを使用中、患者の血管抵抗（後負荷）が上昇した場合、送血流量はどう変化するか？","choices":["増加する","減少する","変化しない","拍動流になる","完全に停止する"],"correct":1,"expl":["遠心ポンプは後負荷依存性が強く、後負荷が上昇すると流量は増加ではなく減少する。","（正解）遠心ポンプは回転数が一定でも、発生する圧に対して後負荷（血管抵抗）が上昇すると流量が減少するという後負荷依存性を持つ。","ローラーポンプとは異なり遠心ポンプは後負荷の影響を強く受けるため、流量は変化する。","後負荷の変化によって拍動流が生じるわけではなく、無拍動流という性質自体は変わらない。","後負荷上昇により流量は減少するが、通常の範囲の後負荷上昇では完全停止には至らない。"]},{"stem":"遠心ポンプの利点として、送血回路が予期せず狭窄・閉塞してしまった場合に防げる事態はどれか？","choices":["キャビテーションの発生","血液の逆流","回路の破裂（破壊）","マイクロバブルの発生","溶血の完全な防止"],"correct":2,"expl":["キャビテーションは主に脱血側（陰圧側）で問題となる現象であり、送血側の狭窄・閉塞対策としての利点ではない。","血液の逆流はむしろ遠心ポンプの欠点（低流量・停止時に生じやすい現象）であり、閉塞時に防げる利点ではない。","（正解）後負荷依存性により閉塞時には流量が自動的に低下するため、ローラーポンプのように送血回路内圧が際限なく上昇して破裂する事態を防ぐことができる。","マイクロバブルの発生は主に脱血側の陰圧や乱流によるものであり、回路閉塞時の遠心ポンプの利点として説明される事象ではない。","遠心ポンプでも高回転・乱流条件下では溶血は生じ得るため、完全に防止できるわけではない。"]},{"stem":"ローラーポンプは血液ポンプの分類において何型に分類されるか？","choices":["遠心型","運動型","容積型（管圧迫型）","軸流型","拍動型"],"correct":2,"expl":["遠心型は遠心ポンプの分類であり、ローラーポンプは該当しない。","「運動型」という分類名は血液ポンプの一般的な分類として用いられていない。","（正解）ローラーポンプはチューブを直接機械的に圧迫して血液を拍出する構造であり、容積型（管圧迫型）ポンプに分類される。","軸流型は軸流ポンプ（体内植込型VADなど）の分類であり、ローラーポンプとは異なる。","「拍動型」はポンプの駆動様式（拍動流を生じるか否か）を表す語であり、ローラーポンプの構造分類そのものを表す語ではない。"]},{"stem":"遠心ポンプよりも直径を小さくでき、主に体内に植え込むタイプの補助人工心臓（VAD）として使用されるポンプはどれか？","choices":["ローラーポンプ","軸流ポンプ","斜流ポンプ","ダイアフラムポンプ","サック型ポンプ"],"correct":1,"expl":["ローラーポンプは体外循環用の据置型ポンプであり、体内植込型VADには使用されない。","（正解）軸流ポンプは入口と出口が一直線上にある構造のため小型化に優れ、体内植込型の補助人工心臓として広く使用されている。","斜流ポンプは遠心ポンプと軸流ポンプの中間的特性を持つが、小径化の点では軸流ポンプに及ばない。","ダイアフラムポンプは拍動流を生成する容積型ポンプであり、比較的サイズが大きく体内植込型としての小径化には不向きである。","サック型ポンプも拍動流を生成する体内植込型VADの一種だが、遠心ポンプより小径化できる代表例としては軸流ポンプが挙げられる。"]},{"stem":"遠心ポンプと軸流ポンプの特性を併せ持ち、駆動設定によって拍動流を作り出すことも可能なポンプはどれか？","choices":["斜流ポンプ","インペラー型遠心ポンプ","サック型ポンプ","フィンガーポンプ","コーン型遠心ポンプ"],"correct":0,"expl":["（正解）斜流ポンプは遠心ポンプと軸流ポンプの中間的な血流方向を持つ構造で、駆動設定によって拍動流を作り出すことも可能である。","インペラー型遠心ポンプは通常無拍動流を生じる構造であり、拍動流生成を特徴とするポンプではない。","サック型ポンプは容積型の拍動流ポンプだが、遠心・軸流両方の特性を併せ持つ構造ではない。","フィンガーポンプはチューブを指状のローラーで順次圧迫する容積型ポンプであり、遠心・軸流の特性とは異なる。","コーン型遠心ポンプは遠心ポンプの一構造であり、軸流ポンプの特性を併せ持つものではない。"]},{"stem":"人工心肺において「拍動流」を作り出すメリットはどれか？","choices":["流量計が不要になる","血液損傷を完全にゼロにできる","回路の破裂を防ぐ","微小循環を改善し、術後の臓器機能の回復を助ける","抗凝固薬の投与量を減らせる"],"correct":3,"expl":["拍動流であっても流量のモニタリングは必要であり、流量計が不要になるわけではない。","拍動流にも血液損傷（溶血）は生じ得るため、完全にゼロにできるわけではない。","回路破裂の防止はポンプの後負荷依存性など別の要因によるものであり、拍動流そのものの利点として説明されるものではない。","（正解）拍動流は毛細血管の虚脱や細胞浮腫を防ぎ微小循環を改善することで、術後の臓器機能回復を助けるとされている。","拍動流の使用と抗凝固薬投与量の間に確立された関連はなく、本問の意図するメリットではない。"]},{"stem":"1回転あたりの吐出量が35mLのローラーポンプを、毎分100回転で運転した場合の血流量はいくらか？","choices":["1.75L/分","2.80L/分","3.50L/分","4.20L/分","7.00L/分"],"correct":2,"expl":["回転数を誤って50回転/分として計算した場合などに生じ得る誤答である。","吐出量を28mLと誤認するなどの計算誤りで生じ得る誤答である。","（正解）流量＝1回転吐出量×回転数＝35mL×100回転/分＝3,500mL/分＝3.5L/分。ローラーポンプは1回転の吐出量が一定な定量ポンプであるため、回転数から流量を算出できる。","吐出量を42mLと誤認するなどの計算誤りで生じ得る誤答である。","回転数を誤って200回転/分として計算した場合などに生じ得る誤答である。"]},{"stem":"1回転あたりの吐出量が35mLのローラーポンプで、適正灌流量4.2L/分を得るために必要な回転数はいくらか？","choices":["毎分80回転","毎分100回転","毎分120回転","毎分147回転","毎分168回転"],"correct":2,"expl":["吐出量を52.5mLなど誤って設定した場合などに生じ得る誤答である。","灌流量を3.5L/分とした場合の回転数（前問の計算と混同した場合の誤答）である。","（正解）回転数＝必要流量÷1回転吐出量＝4,200mL/分÷35mL＝120回転/分。なお遠心ポンプは後負荷で流量が変わるため、回転数から流量を求めることはできない点に注意する。","吐出量を28.6mLなど誤認した場合に生じ得る誤答である。","吐出量を25mLなど誤認した場合に生じ得る誤答である。"]},{"stem":"遠心ポンプをメインポンプとして回路に組み込んだ場合、人工心肺離脱（終了）に際して特に注意すべき点はどれか？","choices":["遠心ポンプには逆流防止機構がないため、回転を下げる際に送血側から脱血側へ逆流が生じ得るので送血回路を確実に遮断（クランプ）する","ローラーポンプ同様、圧閉度を強めて逆流を防止する","遠心ポンプは自動的に逆流を防止するため特別な操作は不要である","回転数を上げたまま送血ラインを開放した状態で離脱する","遠心ポンプでは離脱時に限外濾過を必ず併用しなければならない"],"correct":0,"expl":["（正解）遠心ポンプには機械弁のような逆流防止機構がないため、離脱時に回転を落とすと患者血圧の方が高くなり送血側から脱血側へ逆流し得る。送血回路を確実にクランプすることが離脱時の重要な注意点である。","「圧閉度」という概念はローラーポンプに特有のものであり、弁や圧閉構造を持たない遠心ポンプには適用されない。","遠心ポンプに自動的な逆流防止機構は備わっていないため、クランプなど人為的な操作が必要である。","回転数を上げたまま送血ラインを開放すると患者への送血が継続してしまい、離脱の手順として不適切である。","限外濾過は血液濃縮などの目的で行うものであり、離脱時に必須の操作ではない。"]},{"stem":"ローラーポンプや遠心ポンプを用いた体外循環では本来無拍動流となるが、拍動流を得たい場合はどのようにすればよいか？","choices":["ポンプの回転数（駆動出力）を心周期などに合わせて周期的に変化させる","送血カニューレを2本使用する","動脈フィルターを回路から外す","灌流量を通常より大幅に増加させる","人工肺の膜面積を大きくする"],"correct":0,"expl":["（正解）ローラーポンプ・遠心ポンプはいずれも本来は定常流を生じる構造であるため、拍動流を得るには回転数（駆動出力）を心電図同期などにより周期的に変化させる制御を行う必要がある。","送血カニューレの本数は流量分配に関わる問題であり、拍動流の生成とは直接関係しない。","動脈フィルターの有無は気泡・微小栓子の除去に関わるものであり、拍動流の生成とは無関係である。","灌流量を増加させても波形が拍動性になるわけではなく、平均流量が増えるだけである。","人工肺の膜面積はガス交換能に関わる要素であり、拍動流の生成には関与しない。"]},{"stem":"ローラーポンプおよび遠心ポンプについて、正しい記述の組み合わせはどれか。\na　ローラーポンプは回転数から血流量を正確に計算できる（定量ポンプである）。\nb　遠心ポンプはチューブ圧閉部のような構造を持たないため、低流量・停止時に逆流が生じ得る。\nc　遠心ポンプは後負荷（血管抵抗）が変化しても血流量は一定に保たれる。\nd　遠心ポンプの動力伝達には主に歯車（ギア）結合が用いられる。\ne　ローラーポンプは血液ポンプの分類上、遠心型に分類される。","choices":["a, b","a, e","b, c","c, d","d, e"],"correct":0,"expl":["（正解）aは正しい（ローラーポンプは1回転あたりの吐出量が一定な定量ポンプ）。bも正しい（遠心ポンプには弁や圧閉部がなく、低流量・停止時に送血側から脱血側への逆流が生じ得る）。両者とも正しい記述であり、この組み合わせが正解となる。","a（正）とeの組み合わせ。eは誤り（ローラーポンプは容積型〈管圧迫型〉に分類され、遠心型ではない）であるため、この組み合わせは不適切。","b（正）とcの組み合わせ。cは誤り（遠心ポンプは後負荷依存性が強く、後負荷が上昇すると流量は減少する）であるため、この組み合わせは不適切。","cとdの組み合わせ。cは誤り（前述の通り後負荷で流量は変化する）、dも誤り（遠心ポンプの動力伝達は磁気結合〈マグネットカップリング〉が用いられ、ギア結合ではない）であるため、この組み合わせは不適切。","dとeの組み合わせ。いずれも誤り（動力伝達は磁気結合であり、ローラーポンプは容積型に分類される）であるため、この組み合わせは不適切。"]}]},{"title":"第2章：人工肺","code":"ox","questions":[{"stem":"初期に広く使われた「気泡型人工肺」は、主にどの過程において血球や凝固蛋白の破壊を生じやすいという欠点があったか？","choices":["ガス交換過程","除泡過程","加温過程","冷却過程","濾過過程"],"correct":1,"expl":["ガス交換過程（血液とガスが接触する過程）そのものよりも、その後の除泡過程での血液損傷がより大きな問題とされた。","（正解）気泡型人工肺は血液に直接酸素ガスの気泡を吹き込んでガス交換を行うため、その後に気泡を血液から取り除く「除泡過程」において血球や凝固蛋白の破壊（溶血・蛋白変性）を生じやすいという欠点があった。","加温過程は熱交換器で行われる操作であり、気泡型人工肺特有の血液損傷の主因として説明されるものではない。","冷却過程も熱交換器での操作であり、気泡型人工肺特有の血液損傷の主因として説明されるものではない。","濾過過程は動脈フィルターなどで行われる操作であり、気泡型人工肺特有の血液損傷の主因として説明されるものではない。"]},{"stem":"現在国内の臨床で使用されている人工肺は、すべて何型人工肺か？","choices":["気泡型人工肺","フィルム型人工肺","膜型人工肺","スクリーン型人工肺","積層型人工肺"],"correct":2,"expl":["気泡型人工肺は血液損傷が大きいため現在は使用されていない。","フィルム型人工肺（回転円板型など）も初期に使用された方式であり、現在の主流ではない。","（正解）現在の主流は膜型人工肺であり、国内で臨床使用されているものはすべてこのタイプである。","スクリーン型はフィルム型人工肺の一分類であり、現在の主流である膜型とは異なる。","積層型は膜の形態の一種を指す語であり、現在国内で市販される人工肺の総称ではない。"]},{"stem":"ガス交換膜の「均質膜（シリコーン膜）」は、酸素と比べてどのガスの透過性に優れているか？","choices":["窒素","一酸化炭素","二酸化炭素","ヘリウム","アルゴン"],"correct":2,"expl":["窒素は生体のガス交換において特に問題となるガスではなく、均質膜の特性として強調される対象ではない。","一酸化炭素は人工肺でのガス交換の対象ではなく、本問の趣旨とは異なる。","（正解）シリコーンなどの均質膜は、二酸化炭素の透過性が酸素の約5〜6倍と非常に高い特性を持つ。","ヘリウムは吸入麻酔や特殊な用途で扱われることがあるガスだが、均質膜の代表的な特性として問われるものではない。","アルゴンも人工肺のガス交換で扱う対象ではない。"]},{"stem":"均質膜（シリコーン膜）の膜厚はおよそどの程度か？","choices":["10μm程度","100μm程度","300μm程度","1mm（1,000μm）程度","3mm程度"],"correct":1,"expl":["10μm程度では薄すぎて実用に耐える強度が得られない。","（正解）シリコーン均質膜の膜厚はおよそ100μm程度であり、この厚さでも二酸化炭素の透過性は酸素の約5倍と高いが、これ以上薄くすると強度面で脆弱になる。","300μm程度は実際のシリコーン均質膜の厚さよりも厚い。","1mm（1,000μm）程度は人工肺の膜としては厚すぎ、ガス交換効率の面でも実用的ではない。","3mm程度はガス交換膜としては明らかに厚すぎる数値である。"]},{"stem":"人工肺のガス交換膜として用いられる「多孔質膜」の主な素材は何か？","choices":["ポリプロピレン","ポリメチルペンテン","セルロース","シリコーン","ポリウレタン"],"correct":0,"expl":["（正解）一般的な多孔質膜（中空糸）の素材には、加工性に優れたポリプロピレンが広く用いられている。","ポリメチルペンテンは非対称膜の素材として用いられるものであり、一般的な多孔質膜の代表素材ではない。","セルロースは古い透析膜などに用いられた素材であり、現在の人工肺の多孔質膜素材ではない。","シリコーンは均質膜の代表的な素材であり、多孔質膜の素材ではない。","ポリウレタンはIABPバルーンなど他の医療機器に用いられる素材であり、多孔質膜の代表素材ではない。"]},{"stem":"ポリプロピレン製多孔質膜について誤っているのはどれか？","choices":["細孔の直径はおよそ100〜150nmである","ガス透過性はシリコーン均質膜より高い","機械的強度はシリコーン均質膜より高い","ポリプロピレン自体の気体透過係数はシリコーンよりも高い","長時間使用すると血漿漏出を生じることがある"],"correct":3,"expl":["正しい記述である。ポリプロピレン多孔質膜の細孔の直径はおよそ100〜150nmとされる。","正しい記述である。多孔質膜は気体が細孔を直接通過するため、均質膜よりガス透過性に優れる。","正しい記述である。多孔質膜は均質膜よりも機械的強度に優れる。","（正解＝誤っている記述）ポリプロピレン自体（素材そのもの）の気体透過係数はシリコーンよりもむしろ小さい。多孔質膜の高いガス透過性は、素材自体の性質ではなく膜が多数の細孔を持つ構造によってもたらされる。","正しい記述である。多孔質膜は長時間使用すると血漿蛋白が膜に吸着して疎水性が失われ、血漿漏出（プラズマリーク）を生じることがある。"]},{"stem":"ポリプロピレン多孔質膜が高いガス透過性を示す理由として正しいのはどれか？","choices":["ポリプロピレンという素材自体の気体透過係数がシリコーンより高いため","膜が多数の細孔を持ち、気体分子が細孔を直接通過して拡散できるため","膜厚がシリコーン膜よりも薄く作られているため","膜表面が親水化処理されているため","血漿成分が膜面に付着し、ガス交換を促進するため"],"correct":1,"expl":["ポリプロピレン自体の気体透過係数はシリコーンよりも小さく、高いガス透過性の理由を素材そのものの性質に求めるのは誤りである。","（正解）多孔質膜は膜自体に多数の細孔（直径100〜150nm程度）を持ち、気体分子がその細孔を直接通過して拡散するため、均質膜よりも高いガス透過性を示す。","膜厚の違いが多孔質膜の高いガス透過性の主要因として説明されるものではない。","多孔質膜は疎水性であることを利用して血液（水分）を細孔から通過させない構造になっている。親水化されるとむしろ血漿漏出のリスクが高まる。","血漿成分の膜面への付着（蛋白吸着）は疎水性を失わせて血漿漏出を招く要因であり、ガス交換を促進するものではない。"]},{"stem":"均質膜（シリコーン膜）における気体分子の移動様式として正しいのはどれか？","choices":["気体分子が膜内に溶解し、拡散することで移動する","気体分子が膜の細孔を通過することで移動する","気体分子が膜面の陰圧により吸引されて移動する","気体分子が血液成分と結合して膜を通過する","気体分子は膜を透過せず、拡散のみで血液中に到達する"],"correct":0,"expl":["（正解）均質膜は緻密な膜構造であり、気体はいったん膜内に溶解し、濃度勾配に従って拡散したのち反対側（血液相）に放出される（溶解拡散機構）。","膜の細孔を気体分子が通過するのは多孔質膜の移動様式であり、均質膜には細孔が存在しないため該当しない。","陰圧による吸引という機構でガス交換が行われるわけではない。","気体分子が血液成分（ヘモグロビンなど）と結合するのは血液中に取り込まれた後の話であり、膜内の移動様式そのものではない。","気体は膜を透過して血液相に到達する必要があり、膜を透過しないという記述は誤りである。"]},{"stem":"多孔質膜が均質膜（シリコーン膜）と比較して優れている点はどれか？","choices":["ガス透過性および機械的強度","長時間使用時に血漿漏出を生じないこと","生体反応の少なさ","二酸化炭素と比べた酸素の透過性の高さ","薄膜化しても破損しにくい耐久性"],"correct":0,"expl":["（正解）多孔質膜は気体が細孔を直接通過するため均質膜よりガス透過性に優れ、機械的強度も高い。","血漿漏出（プラズマリーク）は多孔質膜の代表的な欠点であり、逆に均質膜ではほとんど生じない。記述が逆である。","生体反応の少なさは均質膜（シリコーン）の特長として知られており、多孔質膜が優れている点ではない。","二酸化炭素に対する酸素透過性の高さは示されておらず、むしろ均質膜は二酸化炭素の透過性が酸素より高いことで知られる。","均質膜（シリコーン）は薄膜化すると脆弱になりやすいという課題が知られているが、これは多孔質膜が優れている点として一般化される特性ではない。"]},{"stem":"膜型人工肺のガス交換膜について、正しい記述の組み合わせはどれか。\na　均質膜は気体分子が膜内に溶解して移動する。\nb　多孔質膜は長時間使用すると微細孔から血漿成分が漏出しやすい。\nc　均質膜は二酸化炭素より酸素の透過性が高い。\nd　多孔質膜の主な素材はシリコーンである。\ne　非対称膜はシリコーンを用いた膜である。","choices":["a, b","a, e","b, c","c, d","d, e"],"correct":0,"expl":["（正解）aは正しい（均質膜は溶解拡散機構で気体が移動する）。bも正しい（多孔質膜は長時間使用で血漿漏出を生じやすい）。両者とも正しい記述であり、この組み合わせが正解となる。","a（正）とeの組み合わせ。eは誤り（非対称膜はポリメチルペンテンを用いた膜であり、シリコーンではない）であるため、この組み合わせは不適切。","b（正）とcの組み合わせ。cは誤り（均質膜は酸素よりも二酸化炭素の透過性が高い）であるため、この組み合わせは不適切。","cとdの組み合わせ。いずれも誤り（cは前述の通り誤り、dも誤り〈多孔質膜の主な素材はポリプロピレンであり、シリコーンは均質膜の素材〉）であるため、この組み合わせは不適切。","dとeの組み合わせ。いずれも誤りであるため、この組み合わせは不適切。"]},{"stem":"多孔質膜を長時間使用すると、血漿中の蛋白が膜に吸着し、結果としてガス交換能を低下させる現象を引き起こす。これを何と呼ぶか？","choices":["キャビテーション","ウェットラング","血漿漏出（プラズマリーク）","溶血","石灰化"],"correct":2,"expl":["キャビテーションはポンプの圧閉不足などで生じる発泡現象であり、人工肺膜のトラブルではない。","ウェットラングは結露水が中空糸内に溜まりガス交換を阻害する現象であり、血漿成分の漏出とは異なる。","（正解）多孔質膜の微細な孔から血漿成分が漏れ出し、ガス交換を阻害する現象を血漿漏出（プラズマリーク）と呼ぶ。","溶血は血球の破壊であり、血漿成分が膜外に漏出する現象とは異なる。","石灰化は生体材料に石灰成分が沈着する現象であり、多孔質膜からの血漿漏出とは異なる。"]},{"stem":"人工肺のガス交換膜で生じる「ウェットラング」の発生機序として正しいのはどれか？","choices":["血液相からガス相へ移動した水蒸気が中空糸末端で結露し、吹送ガス流量が実質的に減少してガス交換効率が低下する","吹送ガスに含まれる水分が血液相に移動し、血液が希釈される","膜の細孔に血栓が形成され、ガス交換面積が減少する","冷温水槽の水が人工肺内に直接漏れ込み、血液と混合する","膜表面に石灰化が生じ、ガス透過性が低下する"],"correct":0,"expl":["（正解）どのガス交換膜でもガス交換と同時に血液相からガス相への水蒸気の移動（水蒸気損失）が生じる。この水蒸気が中空糸の末端で温度差により結露すると、中空糸内の吹送ガス流量が実質的に減少し、ガス交換効率が低下する。この状態をウェットラングと呼ぶ。","水分の移動方向が逆であり、実際は血液相からガス相へ水蒸気が失われる現象である。","血栓形成による膜面積減少は圧力損失の上昇として現れる別のトラブルであり、ウェットラングの機序ではない。","冷温水槽の水漏れは熱交換器の水漏れ（ウェットラングとは別のトラブル）であり、混同しないよう注意が必要である。","膜表面の石灰化は長期使用時に問題となり得るが、ウェットラングの機序として説明されるものではない。"]},{"stem":"ウェットラングによるガス交換能低下を一時的に解消するために行う対処法はどれか？","choices":["吹送ガス流量を一時的に増加させる（ガスフラッシュ）","送血流量を一時的に増加させる","冷温水槽の温度を上げる","ヘパリンを追加投与する","人工肺を反転させる"],"correct":0,"expl":["（正解）ウェットラングを解消するために、一時的に吹送ガス流量を増やす方法（ガスフラッシュ）が知られている。人工肺の製品ごとに許容される最大ガス流量やガス交換能改善に要するガス流量が異なる点に注意が必要である。","送血流量の増加はガス交換膜内の結露を解消する対処法として説明されるものではない。","冷温水槽の温度を上げることはウェットラングの対処法として説明されるものではなく、むしろ熱交換器周辺の結露に関与し得る。","ヘパリンの追加投与はウェットラング（結露によるガス交換効率低下）への対処法として説明されるものではない。","人工肺を反転させるという操作は一般的な対処法として説明されるものではない。"]},{"stem":"血漿漏出を防ぐため、補助循環（ECMO）用などに用いられる、ポリメチルペンテン素材の「緻密層」と「多孔質層」を併せ持つ膜を何と呼ぶか？","choices":["均質膜","複合膜","非対称膜","多孔質膜","積層膜"],"correct":2,"expl":["均質膜はシリコーンなど単一の緻密な膜構造であり、多孔質層を併せ持つ構造ではない。","複合膜はポリプロピレン多孔質膜にシリコーンなどをコーティングした構造を指し、ポリメチルペンテン単体の非対称構造とは区別される。","（正解）非対称膜は、ポリメチルペンテンを用いて緻密層（表面）と多孔質層（内部）を併せ持たせた構造で、ガス透過性を保ちつつ長期間の血漿漏出を防止できるため、ECMOなど長期の補助循環に適している。","多孔質膜は細孔を持つ単一構造であり、緻密層を併せ持つ構造ではない。","「積層膜」という分類名は本書で用いられるガス交換膜の分類ではない。"]},{"stem":"膜型人工肺の構造のうち、現在国内で市販されているすべてが採用している形式（単位体積あたりの膜面積が大きい形式）は何型か？","choices":["コイル型","積層型","プレート型","中空糸型","回転円板型"],"correct":3,"expl":["コイル型は初期のシリコーン膜型人工肺（Kolobow肺など）で採用された構造であり、現在の主流ではない。","積層型も初期の膜型人工肺（Lande-Edwards肺など）で採用された構造であり、現在の主流ではない。","プレート型という形式は本書で扱う人工肺の主要な分類ではない。","（正解）中空糸型は小型でありながら大きな膜面積を確保できるため、現在国内で市販されている人工肺はすべてこの構造を採用している。","回転円板型はフィルム型人工肺の一分類であり、膜型人工肺の構造分類ではない。"]},{"stem":"中空糸型人工肺のうち、中空糸の内部をガスが流れ、その外側を血液が流れる形式を何と呼ぶか？","choices":["内部灌流型","外部灌流型","混合灌流型","遠心灌流型","逆行灌流型"],"correct":1,"expl":["内部灌流型は中空糸の内部を「血液」が流れる方式であり、本問の説明（ガスが内部、血液が外部）とは逆である。","（正解）中空糸内部をガスが流れ、外側を血液が流れる方式を外部灌流型と呼ぶ。血液が乱流となりやすい一方、圧力損失は低く抑えられる。","「混合灌流型」という分類は中空糸型人工肺の一般的な分類として用いられていない。","「遠心灌流型」という語は血液ポンプではなく人工肺の灌流方式の分類としては用いられていない。","「逆行灌流型」という分類は中空糸型人工肺の灌流方式としては存在しない。"]},{"stem":"中空糸型膜型人工肺の内部灌流型・外部灌流型について正しいのはどれか？","choices":["内部灌流型は中空糸の外側を血液が流れる方式である","外部灌流型は中空糸の内側を血液が流れる方式である","内部灌流型は血液が層流となりやすく、灌流抵抗が大きくなりやすい","外部灌流型は内部灌流型より圧力損失が大きい","現在市販されている人工肺の大部分は内部灌流型である"],"correct":2,"expl":["内部灌流型は中空糸の「内側」を血液が流れる方式であり、記述が逆である。","外部灌流型は中空糸の「外側」を血液が流れる方式であり、記述が逆である。","（正解）内部灌流型では血液が中空糸内部という細い管腔を流れるため層流となりやすく、灌流抵抗（圧力損失）も大きくなりやすい。この欠点を解消する目的で外部灌流型が普及した。","外部灌流型は内部灌流型より血液が乱流となりやすい反面、圧力損失はむしろ内部灌流型より低く抑えられる。","現在市販されている人工肺の大部分は外部灌流型であり、内部灌流型ではない。"]},{"stem":"外部灌流型膜型人工肺について誤っているのはどれか？","choices":["中空糸の外側を血液が流れる","落差脱血に用いるのに適している","内部灌流型膜型肺より圧力損失が小さい","内部灌流型膜型肺より多く用いられている","血液の流れは層流になる"],"correct":4,"expl":["正しい記述である。外部灌流型は中空糸の外側を血液が流れる方式である。","正しい記述である。外部灌流型は血液側の流路断面積が広く抵抗が低いため、落差脱血にも適している。","正しい記述である。外部灌流型は内部灌流型より圧力損失（灌流抵抗）が小さい。","正しい記述である。現在市販されている人工肺の大部分は外部灌流型である。","（正解＝誤っている記述）外部灌流型では血液が中空糸の外側の広い空間を流れるため乱流になりやすく、層流にはなりにくい。層流になりやすいのはむしろ内部灌流型である。"]},{"stem":"人工肺において、血液中の「二酸化炭素の除去量」を増やすには、吹送ガスの何を増やす（調節する）必要があるか？","choices":["酸素濃度","ガス流量","ガス温度","窒素濃度","加湿度"],"correct":1,"expl":["酸素濃度（吹送ガス酸素濃度）は主に血中酸素分圧（PaO2）に影響するものであり、二酸化炭素除去量を主に規定する因子ではない。","（正解）二酸化炭素の除去能力は、主にスウィープガス（吹送ガス）の流量に依存して変化する。","ガス温度は結露（ウェットラング）などに関与するが、二酸化炭素除去量を主に規定する因子ではない。","窒素濃度を調整するという操作は一般的な人工肺の運用では行われない。","加湿度はガスの湿り気に関する要素であり、二酸化炭素除去量を主に規定する因子ではない。"]},{"stem":"人工肺の入口部と出口部の回路内圧の差（血流抵抗の指標）を何と呼ぶか？","choices":["灌流圧","圧力損失（プレッシャードロップ）","静水圧","浸透圧","膠質浸透圧"],"correct":1,"expl":["灌流圧は送血圧など灌流全体に関わる圧を指す語であり、人工肺前後の圧較差を指す語ではない。","（正解）人工肺内を通る際の血液の通りにくさを、入口部と出口部の圧の差として表したものを圧力損失（プレッシャードロップ）と呼ぶ。","静水圧は液体の重さによって生じる圧であり、人工肺前後の圧較差を表す語ではない。","浸透圧は溶質濃度差による水の移動に関わる圧であり、本問の趣旨とは異なる。","膠質浸透圧は血漿蛋白による浸透圧を指す語であり、人工肺前後の圧較差とは無関係である。"]},{"stem":"体外循環中に人工肺の圧力損失が異常に上昇（通常の2倍など）した場合、人工肺内で何が形成されていることが強く疑われるか？","choices":["脂肪滴","気泡","血栓","アテローム","石灰化物"],"correct":2,"expl":["脂肪滴は脂肪塞栓などで問題となることがあるが、圧力損失の急激な上昇の代表的な原因ではない。","気泡（エア）の混入は圧力損失を大きく上昇させる主因とはならず、むしろ流量低下や送血不良として現れやすい。","（正解）急激な圧力損失の上昇は、人工肺の内部で血液が固まる「血栓形成」の重要なサインである。","アテロームは動脈硬化病変であり、人工肺内部で新たに形成されるものではない。","石灰化物が急性に人工肺内で形成されることは通常なく、圧力損失急上昇の主因としては血栓が最も疑われる。"]}]},{"title":"第3章：回路と生体との接続","code":"cc","questions":[{"stem":"現在、人工心肺回路のチューブを軟らかくするための可塑剤として、従来のDEHPに代わって主に使用されるようになった物質はどれか？","choices":["PTFE","TOTM","PMEA","MPC","DEHP"],"correct":1,"expl":["PTFE（ポリテトラフルオロエチレン）は初期の多孔質膜の素材として用いられたものであり、チューブの可塑剤ではない。","（正解）生殖毒性などの懸念から、DEHPに代わりTOTM（トリメリット酸-2-トリスエチルヘキシル）を可塑剤に用いた製品が主流となっている。","PMEAはヘパリンコーティングなどに用いられる生体適合性コーティング素材であり、可塑剤ではない。","MPC（ホスホリルコリンポリマー）も血液適合性コーティングに用いられる素材であり、可塑剤ではない。","DEHPはまさに生殖毒性などが懸念され置き換えの対象となった従来の可塑剤であり、現在主流の物質ではない。"]},{"stem":"血液回路内の流れにおいて、層流と乱流を判別する「レイノルズ数」について、層流となるのはおよそいくつ以下か？","choices":["1000以下","2100以下","4000以下","5000以下","10000以下"],"correct":1,"expl":["1000以下は血液損傷を防ぐうえで理想とされる目安の値であり、層流・乱流の境界そのものを表す値ではない。","（正解）直管内の流動では、レイノルズ数が2100以下で層流、4000以上で乱流となる。","4000以上は乱流となる目安の値であり、層流の上限ではない。","5000は層流・乱流の判別に用いられる一般的な基準値ではない。","10000も層流・乱流の判別に用いられる一般的な基準値ではない。"]},{"stem":"心腔内血吸引貯血槽（カーディオトミーリザーバー）に備わっているフィルターのサイズは、一般的にどの程度か？","choices":["1〜5µm","20〜40µm","100〜150µm","200〜300µm","400〜500µm"],"correct":1,"expl":["1〜5µmは細菌など極めて微小な粒子のサイズであり、カーディオトミーリザーバーのフィルターとしては目が細かすぎる。","（正解）心腔内の血液に含まれる血栓、凝血塊、組織片などを除去するため、20〜40µmのフィルター機能が備わっている。","100〜150µmはこのフィルターの目安としては大きすぎる数値である。","200〜300µmも同様に大きすぎ、微小な凝血塊などを除去できない。","400〜500µmはフィルターとしての除去性能をほとんど持たない粗さである。"]},{"stem":"冷却時、血液温度が37℃から20℃に低下した場合、血液の粘度はおよそどの程度上昇するか？","choices":["10%","20%","50%","100%","150%"],"correct":2,"expl":["10%は実際の上昇幅よりも小さい。","20%も実際の上昇幅よりも小さい。","（正解）37℃から20℃へ冷却すると血液粘度は約50%上昇し、血液が流れる管の圧力損失も1.5倍になる。","100%は実際の上昇幅よりも大きい。","150%はさらに実際の上昇幅から乖離している。"]},{"stem":"復温時に熱交換器で血液を温める際、気泡の発生（気化）を防ぐために、流入血液温度と温水温度の差は何度以内にすることが望ましいか？","choices":["2℃以内","5℃以内","10℃以内","15℃以内","20℃以内"],"correct":2,"expl":["2℃以内は必要以上に厳しい制限であり、一般的に望ましいとされる基準ではない。","5℃以内も一般的に示される基準よりも厳しい値である。","（正解）血液に溶解した分子が気化して気泡となるのを防ぐため、流入血液温度と温水温度の差は10℃以内にする必要がある。","15℃以内は許容範囲としては大きすぎ、気泡発生のリスクが高まる。","20℃以内はさらに気泡発生のリスクが高く、望ましい基準とはいえない。"]},{"stem":"体外循環終了後、回路内の残留血液を患者の血液とともに限外濾過膜に引き込んで除水・濃縮しながら返血する方法の略称はどれか？","choices":["MUF","DUF","CUF","VAVD","ECUM"],"correct":0,"expl":["（正解）MUF（modified ultrafiltration）は、体外循環終了後に回路内残血と患者の血液を限外濾過膜に引き込んで水分を除去し、濃縮しながら返血する方法である。","DUF（dilutional ultrafiltration）は体外循環“中”に持続的に行う血液濾過法であり、終了後に行うMUFとは実施のタイミングが異なる。","CUFという略称は本書で扱う代表的な血液濃縮法の名称ではない。","VAVDは陰圧補助脱血の略称であり、血液濾過・濃縮法ではない。","ECUM（extracorporeal ultrafiltration method）はDUFとほぼ同義で体外循環中に行う限外濾過を指す語であり、終了後に行う方法の略称ではない。"]},{"stem":"体外循環“中”に持続的に血液濾過を行い、置換液を貯血槽に注入しながら同量の排液を行うことで、電解質補正や体液バランスの維持を図る方法の略称はどれか？","choices":["MUF","DUF","CUF","VAVD","ECMO"],"correct":1,"expl":["MUFは体外循環終了後（プロタミン投与前）に行う血液濃縮法であり、体外循環中に持続的に行うものではない。","（正解）DUF（dilutional ultrafiltration）は体外循環中に持続的に行う血液濾過法で、置換液を貯血槽に注入しながら同量の排液を行うことで電解質とpHの補正、体液バランスの維持を図る。","CUFという略称は本書で扱う代表的な血液濾過法の名称ではない。","VAVDは陰圧補助脱血の略称であり、血液濾過法ではない。","ECMOは体外式膜型人工肺による補助循環法であり、血液濾過法を指す語ではない。"]},{"stem":"DUF（dilutional ultrafiltration）とMUF（modified ultrafiltration）の違いについて正しいのはどれか？","choices":["DUFは体外循環中に行われ、MUFは体外循環終了後に行われる","DUFは体外循環終了後に行われ、MUFは体外循環中に行われる","両者とも体外循環中にのみ行われる","両者とも体外循環終了後にのみ行われる","DUFとMUFは同一の操作を指す異なる呼称である"],"correct":0,"expl":["（正解）DUFは体外循環中に置換液の注入と排液を並行して行う持続的な血液濾過であり、MUFは体外循環終了後（プロタミン投与前）に送血管から脱血して血液濃縮を行う方法である。","実際の時期関係が逆である。","MUFは体外循環終了後に行われるため誤りである。","DUFは体外循環中に行われるため誤りである。","DUFとMUFは目的・実施時期・回路構成の異なる別々の操作であり、同一の操作を指す呼称ではない。"]},{"stem":"人工心肺中の限外濾過による血液濃縮器（ヘモフィルター）について、正しい記述の組み合わせはどれか。\na　内部灌流型（血液が中空糸内部を流れる）の装置である。\nb　メインの送脱血回路に直列に組み込んで使用する。\nc　疎水性の多孔質中空糸膜を用いる。\nd　透析液を必要とする。\ne　排出される濾液のNa、K濃度は細胞外液型に近い。","choices":["a, b","a, e","b, c","c, d","d, e"],"correct":1,"expl":["aは正しいが、bは誤り（血液濃縮器はメイン回路から分岐した側路（バイパスライン）に組み込んで使用し、直列ではない）であるため、この組み合わせは不適切。","（正解）aは正しい（血液濃縮器は血液が中空糸内部を流れる内部灌流型の装置である）。eも正しい（濾過により生じる排出液は血漿水に近く、Na・K濃度は細胞外液型に近い）。両者とも正しい記述であり、この組み合わせが正解となる。","bは誤り、cも誤り（血液濃縮器の膜は水分を透過させる必要があるため親水性の膜が用いられ、疎水性ではない）であるため、この組み合わせは不適切。","cは誤り、dも誤り（限外濾過は透析液を用いず圧較差により水分を除去する操作であり、透析液を必要とするのは血液透析である）であるため、この組み合わせは不適切。","dは誤りであるため、この組み合わせは不適切。"]},{"stem":"人工心肺の貯血槽に取り付けられ、液面の低下を監視する「レベルセンサー」で最も多く使用されている方式はどれか？","choices":["光学式","静電容量式","超音波式","赤外線式","圧力式"],"correct":2,"expl":["光学式も用いられることがあるが、最も多く採用されている方式ではない。","静電容量式は液面センサーの一方式だが、本書で最も多いとされる方式ではない。","（正解）液体と空気中での音波の伝搬速度の違い（空気中では液体の約4.4倍速い）を利用した超音波式センサーが多く使用される。","赤外線式は一般的な貯血槽レベルセンサーとして広く使われている方式ではない。","圧力式も液面変化の検出原理として考えられるが、代表的な方式として挙げられるのは超音波式である。"]},{"stem":"人工心肺のチューブに直接取り付けて血流量を測定する「超音波流量計」で、現在多く採用されている測定方式はどれか？","choices":["ドップラー方式","電磁誘導方式","熱希釈方式","伝搬時間差方式","超音波減衰方式"],"correct":3,"expl":["ドップラー方式は血流計測に用いられる原理の一つだが、人工心肺のチューブ用超音波流量計で主流の方式ではない。","電磁誘導方式は電磁流量計の原理であり、超音波流量計の方式ではない。","熱希釈方式は心拍出量測定などに用いられる別の測定原理である。","（正解）血流の順方向と逆方向から超音波を発信し、その伝搬時間の差を利用して流速・流量を求める「伝搬時間差（トランジットタイム）方式」が多く採用されている。","「超音波減衰方式」という測定方式は一般的な人工心肺用流量計として用いられていない。"]},{"stem":"人工心肺を開始する際、ヘパリン投与後のACT（活性化凝固時間）は最低何秒以上に保つ必要があるか？","choices":["150秒","200秒","300秒","480秒","600秒"],"correct":3,"expl":["150秒は体外循環開始基準としては不十分に短い。","200秒も体外循環開始基準としては不十分に短い。","300秒も体外循環開始基準として一般に示される値より短い。","（正解）体外循環は、凝固を防ぐためにACT値が480秒以上であることを確認してから開始・維持される。","600秒は必要とされる基準よりも高い数値である。"]},{"stem":"ナファモスタット（プロテアーゼ阻害剤）を併用した場合、活性化物質に吸着されて抗凝固作用が反映されず、ACT値が短縮してしまう測定法はどれか？","choices":["セライトACT","カオリンACT","ガラスビーズACT","シリカACT","セルロースACT"],"correct":1,"expl":["セライトACTはナファモスタットの影響を受けにくく、この状況ではむしろ推奨される測定法である。","（正解）カオリンの陰性荷電に対して陽性電荷を帯びたナファモスタットが吸着されるため、抗凝固作用が反映されずカオリンACT値は短縮してしまう。そのためセライトACTでの測定が推奨される。","ガラスビーズACTは本書で扱うナファモスタット干渉の代表例として挙げられる測定法ではない。","シリカACTも同様に、本問で問われる代表的な干渉の対象ではない。","セルロースACTという測定法は一般的に用いられていない。"]},{"stem":"脱血カニューレの過大な陰圧により、先端に静脈壁などが断続的に吸着を繰り返す現象を何と呼ぶか？","choices":["キャビテーション","ウォーターハンマー","チャタリング（フラッタリング）","サイフォニング","エアロック"],"correct":2,"expl":["キャビテーションは送血側で流速増加・圧力低下により気泡が発生する現象であり、脱血カニューレ先端の吸着現象とは異なる。","ウォーターハンマーは配管内の急激な流れの変化で生じる圧力衝撃現象を指す語であり、本問の現象とは異なる。","（正解）バランスの悪い過大な陰圧がかかると、カニューレ先端に静脈壁や右房壁が断続的に吸着を繰り返すチャタリング（フラッタリング）現象が起こり、脱血不良の原因となる。","サイフォニングは落差を利用した排液・脱血の原理を指す語であり、断続的な吸着現象を指すものではない。","エアロックは回路内に空気が捕捉され送液・送血ができなくなる現象であり、本問の現象とは異なる。"]},{"stem":"VAVD（陰圧補助脱血）使用時、レギュレーターが作動していない状態で貯血槽内へ血液や空気の回収が行われると、貯血槽内が陽圧になることがある。この過大な陽圧を逃がすために貯血槽に取り付けておくべき安全装置はどれか？","choices":["動脈フィルター","陽圧防止弁","陰圧防止弁","白血球除去フィルター","気泡除去フィルター"],"correct":1,"expl":["動脈フィルターは送血ライン側で微小気泡・微小栓子を除去する装置であり、貯血槽内圧の異常上昇への対策ではない。","（正解）VAVD用レギュレーターが作動していない状態で貯血槽内への吸引・回収が行われると回収された血液や空気により貯血槽内が陽圧になる危険があるため、貯血槽には陽圧防止弁の装着が必須である。","「陰圧防止弁」は過大な陰圧を制限するための弁であり、陽圧化を逃がす目的の装置ではない。","白血球除去フィルターは輸血・回収血中の白血球を除去する目的の装置であり、圧力異常への対策ではない。","「気泡除去フィルター」という名称の安全装置は、貯血槽の陽圧防止対策として一般的に用いられるものではない。"]},{"stem":"細い送血カニューレから血液が噴出される際、流速の増加と急激な圧力低下によって気泡を生じる現象を何というか？","choices":["チャタリング","プラズマリーク","ウェットラング","キャビテーション","サイフォニング"],"correct":3,"expl":["チャタリングは脱血カニューレ先端が静脈壁などに断続的に吸着する現象であり、送血側の気泡発生現象ではない。","プラズマリークは多孔質膜からの血漿漏出であり、送血カニューレの気泡発生現象とは異なる。","ウェットラングは中空糸内の結露によるガス交換能低下であり、送血カニューレの現象ではない。","（正解）細いカニューレから血液が高速で噴出されると、周囲の血液との間に乱流が生じ、急激な圧力低下によって溶存気体が気泡化するキャビテーションが起こり、溶血の原因となる。","サイフォニングは落差を利用した排液の原理を指す語であり、気泡発生現象そのものを指す語ではない。"]},{"stem":"送血カニューレを選択する際、キャビテーションや血液損傷を防ぐために、カニューレの圧力損失は最大でも何mmHgを超えないようにすべきか？","choices":["50 mmHg","100 mmHg","200 mmHg","300 mmHg","400 mmHg"],"correct":1,"expl":["50mmHg程度が望ましいとされる目安の値であり、「超えてはならない上限」として示される値ではない。","（正解）送血カニューレの圧力損失は50mmHg程度が望ましいが、解剖学的理由で細いカニューレを選択せざるを得ない場合でも、100mmHgを超えないようにすべきとされている。","200mmHgは許容される上限としては大きすぎる数値である。","300mmHgはさらに許容範囲を超えた数値である。","400mmHgは明らかに危険域であり、上限の目安として示される数値ではない。"]},{"stem":"左心系ベントの挿入部位として、最も一般的に選択される経路はどれか？","choices":["右上肺静脈から僧帽弁を経由して左室へ","左室心尖部から直接左室へ","大動脈基部から左室へ","右心耳から心房中隔を経由して左室へ","下大静脈から右房を経由して左室へ"],"correct":0,"expl":["（正解）左房-左室ベントは、通常、右上肺静脈に巾着縫合をおいて僧帽弁を経由して左室内に挿入されるのが最も一般的である。","左室心尖部からの直接挿入は特殊な状況で用いられることがあるが、最も一般的に選択される経路ではない。","大動脈基部からのアプローチは心筋保護液の順行性注入などに用いられる経路であり、左心系ベントの一般的な挿入経路ではない。","右心耳から心房中隔を経由する経路は右心系へのアプローチであり、左心系ベントの一般的な経路ではない。","下大静脈から右房を経由する経路は静脈脱血の経路であり、左心系ベントの経路ではない。"]},{"stem":"左心系ベントの役割として正しいものはどれか？","choices":["右心系の空気抜き","大動脈遮断解除後の血圧上昇を積極的に促進すること","左室心筋の過伸展防止","冠動脈への灌流量を直接増加させること","心筋保護液の主たる投与経路として使用すること"],"correct":2,"expl":["右心系の空気抜きは左心系ベントの役割ではない。左心系ベントが対象とするのはあくまで左心系である。","血圧上昇を積極的に促進するという作用は左心系ベントの役割として説明されるものではない。","（正解）左心系ベントの主な役割は、左室心筋の過伸展防止、手術視野の確保、心筋温上昇防止、左心系の空気抜き、心機能回復までの仕事量軽減の5つであり、左室心筋の過伸展防止はその代表的な役割である。","冠動脈灌流量を直接増加させる作用は左心系ベントの役割として説明されるものではない。","心筋保護液の投与経路として主に用いられるのは順行性・逆行性の心筋保護回路であり、左心系ベントの役割ではない。"]},{"stem":"人工心肺中の高度な「溶血」の主な原因になりやすい操作はどれか？","choices":["血液濃縮器（ヘモフィルター）の使用","動脈フィルターの使用","空気を巻き込んだローラーポンプによる血液吸引","VAVD（陰圧補助脱血）の適正使用","遠心ポンプによる通常の送血"],"correct":2,"expl":["血液濃縮器（ヘモフィルター）の適正な使用は血液濃縮のための操作であり、高度な溶血の主原因とはされない。","動脈フィルターの使用は微小気泡・微小栓子の除去を目的とするものであり、高度な溶血の主原因とはされない。","（正解）人工心肺における溶血の主たる原因は、血液吸引の際にローラーポンプで空気を巻き込みながら血液を回収することであり、陰圧とずり応力が血液に大きなダメージを与える。","VAVD（陰圧補助脱血）は適正に使用すれば過大な陰圧を管理しながら脱血を補助する方法であり、それ自体が高度な溶血の主原因とはされない。","遠心ポンプによる通常の送血は、適正な条件下であれば高度な溶血の主原因とされる操作ではない。"]}]},{"title":"第4章：標準的開心術","code":"cs","questions":[{"stem":"送脱血カニューレを挿入する前にはヘパリンを投与するが、カニューレ挿入を開始する目安となるACT（活性化凝固時間）は何秒以上か？","choices":["100秒以上","200秒以上","300秒以上","480秒以上","600秒以上"],"correct":1,"expl":["100秒以上ではカニューレ挿入を開始する基準としては不十分に短い。","（正解）ヘパリン投与後、ACTが200秒を超えたことを確認してからカニュレーション（カニューレの挿入）を開始する。","300秒以上はカニュレーション開始の基準としては高すぎる（体外循環の開始・維持基準に近い値）。","480秒以上は体外循環の開始・維持に必要とされる基準であり、カニュレーション開始の基準ではない。","600秒以上はいずれの基準としても高すぎる。"]},{"stem":"上行大動脈の性状が悪く送血路に適さない場合や、急性大動脈解離の際に代替として選択される送血部位はどれか？","choices":["肺動脈 または 冠静脈洞","腕頭静脈 または 奇静脈","内胸動脈 または 橈骨動脈","大腿動脈 または 鎖骨下動脈（腋窩動脈）","頸動脈 または 椎骨動脈"],"correct":3,"expl":["肺動脈・冠静脈洞は静脈系・心筋保護関連の経路であり、動脈送血の代替部位ではない。","腕頭静脈・奇静脈は静脈系であり、送血（動脈系）の代替部位として用いられない。","内胸動脈・橈骨動脈は主に冠動脈バイパス術のグラフト（導管）として用いられる血管であり、送血路の代替として一般的に選択されるものではない。","（正解）上行大動脈が送血に適さない場合は、大腿動脈や鎖骨下動脈（腋窩動脈）などが送血路として選択される。","頸動脈・椎骨動脈は脳への血流を担う血管であり、送血カニューレ挿入部位として一般的に選択されるものではない。"]},{"stem":"冠動脈バイパス術や大動脈弁手術など「右房を切開しない手術」において、一般的に選択される脱血方法はどれか？","choices":["上大静脈・下大静脈の2本脱血","Two-stageカニューレを用いた右房1本脱血","肺動脈からの脱血","冠静脈洞からの脱血","大腿静脈からの逆行性脱血"],"correct":1,"expl":["上大静脈・下大静脈の2本脱血は右房を切開する手術（完全体外循環が必要な術式）で選択される方法である。","（正解）先端を下大静脈に、側孔を右房内に位置させるTwo-stageカニューレを用いて、1本で脱血を行う。","肺動脈からの脱血は一般的な静脈脱血の方法ではない。","冠静脈洞からの脱血は心筋保護液の逆行性注入や右心系ドレナージに関連する操作であり、一般的な脱血方法ではない。","大腿静脈からの逆行性脱血は特殊な状況（低侵襲手術など）で用いられることがあるが、右房非切開術式での一般的な選択ではない。"]},{"stem":"人工心肺による体外循環を開始・維持するためには、ACT（活性化凝固時間）は最低何秒以上に保つ必要があるか？","choices":["200秒以上","300秒以上","400秒以上","480秒以上","500秒以上"],"correct":3,"expl":["200秒以上はカニュレーション（カニューレ挿入）を開始する目安であり、体外循環の開始・維持基準ではない。","300秒以上も体外循環の開始・維持基準としては不十分である。","400秒以上も基準として示される値には届かない。","（正解）カニューレ挿入は200秒以上で可能だが、実際の体外循環の開始および維持はACTが480秒以上であることを確認して行う。","500秒以上は必要とされる基準よりも高い値である。"]},{"stem":"左心系ベンティングに用いられる経路として、一般的に挙げられる4つに含まれないものはどれか？","choices":["右上肺静脈から僧帽弁を経由する左房-左室ベント","左室心尖部からのベント","肺動脈ベント","大動脈基部ベント","冠静脈洞からのベント"],"correct":4,"expl":["正しい。左房-左室ベントは4つの経路の一つであり、右上肺静脈に巾着縫合をおいて僧帽弁を経由して左室に挿入されることが多い。","正しい。左室心尖部ベントも4つの経路の一つだが、心筋障害や出血、心室細動誘発のリスクからあまり選択されない。","正しい。肺動脈ベントも4つの経路の一つで、肺動脈圧の減圧により間接的に左心系を減圧する。","正しい。大動脈基部ベントも4つの経路の一つで、順行性心筋保護液注入用のカニューレを兼ねることが多い。","（正解）冠静脈洞からのカニューレ挿入は主に逆行性心筋保護液の注入経路として用いられるものであり、左心系ベンティングの代表的な4経路には含まれない。"]},{"stem":"左心系ベント（左房-左室ベント）を挿入する経路として、通常選択されるのはどこか？","choices":["右上肺静脈","左心耳","冠静脈洞","肺動脈","下大静脈"],"correct":0,"expl":["（正解）左房-左室ベントは、右上肺静脈に巾着縫合をおいて僧帽弁を経由し、左室内へ挿入するのが一般的である。","左心耳からのアプローチは左房-左室ベントの一般的な挿入経路ではない。","冠静脈洞は逆行性心筋保護液の注入経路であり、左心系ベントの挿入経路ではない。","肺動脈は肺動脈ベントの経路であり、左房-左室ベントの経路とは異なる。","下大静脈は静脈脱血の経路であり、左心系ベントの挿入経路ではない。"]},{"stem":"大動脈弁閉鎖不全症（AR）がある場合、大動脈基部からの順行性心筋保護液注入が不十分となる原因として正しいのはどれか？","choices":["大動脈弁の逆流により心筋保護液が左室内に漏れ、冠動脈への灌流量が減少するため","大動脈弁が高度に狭窄し、心筋保護液が大動脈基部に停滞するため","冠静脈洞が狭窄し、静脈還流が障害されるため","心筋保護液の温度が低すぎて冠動脈が攣縮するため","大動脈基部カニューレの内腔が拡張しすぎているため"],"correct":0,"expl":["（正解）大動脈弁に逆流があると、大動脈基部に注入した心筋保護液の一部が冠動脈へ十分に灌流せず左室内へ漏れてしまうため、有効な保護液量・冠灌流量が不足し心停止や心筋保護が不十分となる。","AR（閉鎖不全）は弁が閉じきらず逆流を生じる病態であり、狭窄により保護液が停滞するという記述はARの病態と矛盾する。","冠静脈洞の狭窄は逆行性心筋保護における問題として考えられ得るが、順行性注入が不十分となる直接の原因ではない。","保護液の温度低下による冠攣縮は、順行性注入不良の一般的な原因として説明されるものではない。","カニューレ内腔が拡張しすぎているという状態は一般的な原因として想定されておらず、むしろ内腔が狭い場合に注入圧の異常が問題となる。"]},{"stem":"大動脈遮断を解除する際、脳への空気塞栓（気泡の迷入）を防ぐために患者にとらせる体位はどれか？","choices":["ジャックナイフ体位（頭高位）","トレンデレンブルグ体位（頭低位）","側臥位","腹臥位","水平仰臥位"],"correct":1,"expl":["ジャックナイフ体位（頭高位）はむしろ頭部への気泡流入のリスクを高めるため、空気塞栓予防の体位としては不適切である。","（正解）気泡による脳塞栓や冠動脈塞栓を防ぐため、頭部を低くするトレンデレンブルグ体位をとり、空気を追い出しながら遮断解除を行う。","側臥位は空気塞栓予防を目的とした標準的な体位ではない。","腹臥位は心臓手術の体位として現実的でなく、空気塞栓予防の体位でもない。","水平仰臥位では頭高位ほどではないが、トレンデレンブルグ体位ほどの気泡排出効果は得られない。"]},{"stem":"心膜切開後、良好な術野を得るために心膜を皮下組織や開胸器に縫合固定（吊り上げ）する際、注意すべき血行動態の変化はどれか？","choices":["静脈還流が制限されて血圧が低下する","肺動脈圧が急激に上昇する","心拍数が異常に増加する","冠動脈が伸展されて心筋虚血に陥る","動脈血酸素飽和度が低下する"],"correct":0,"expl":["（正解）心膜を吊り上げることによって右心系が圧迫され、静脈還流が制限されて血圧が低下することがあるため、施設によっては吊り上げを行わないこともある。","肺動脈圧の急激な上昇は心膜吊り上げの代表的な合併症として説明されるものではない。","心拍数の異常増加は心膜吊り上げによる血行動態変化として一般的に説明されるものではない。","冠動脈が伸展されて心筋虚血に至るという機序は心膜吊り上げの説明として一般的ではない。","動脈血酸素飽和度の低下は心膜吊り上げそのものによる直接的な血行動態変化として説明されるものではない。"]},{"stem":"大腿動脈から送血カニューレを挿入する際、特に若年者の患者において注意すべき事象はどれか？","choices":["血管の石灰化によるカニューレ破損","血管の攣縮（スパスム）による末梢血流の阻害","大腿静脈への誤穿刺","過剰な送血による下肢の浮腫","カニューレ位置による大動脈解離のリスク上昇"],"correct":1,"expl":["血管の石灰化は高齢者・動脈硬化例で問題となりやすい事象であり、若年者で特に注意すべき事象ではない。","（正解）若年者の大腿動脈は攣縮（スパスム）を生じやすく、挿入部より末梢への血流が阻害されて下肢虚血を生じる危険があるため、末梢の血流を必ず確認する。","大腿静脈への誤穿刺は手技上の一般的な注意点だが、若年者に特有の事象として強調されるものではない。","過剰な送血による下肢浮腫は一般的に強調される合併症ではない。","大動脈解離のリスクは動脈硬化が進行した高齢者でより注意すべき事象であり、若年者で特に強調される事象ではない。"]},{"stem":"体外循環を開始し、徐々に流量を上げていく際、確認すべき重要な「6つのポイント」に含まれないものはどれか？","choices":["患者の血圧は至適か","送血圧は至適範囲内にあるか","尿量が1mL/hr/kg以上保たれているか","心臓は減圧されているか","CVP（中心静脈圧）は適正か"],"correct":2,"expl":["患者の血圧は開始時の6つの確認ポイントの一つである。","送血圧も開始時の6つの確認ポイントの一つである。","（正解）開始時の6つの確認ポイントは「送脱血バランス」「送血圧」「酸素化」「患者血圧」「CVP（中心静脈圧）」「心臓の減圧」である。尿量の確認は維持期の指標として重要だが、開始時の6つのポイントには含まれない。","心臓の減圧も開始時の6つの確認ポイントの一つである。","CVP（中心静脈圧）も開始時の6つの確認ポイントの一つである。"]},{"stem":"鎖骨下動脈（または腋窩動脈）を送血路とする場合、直接カニューレを挿入する方法の他に、どのような方法が用いられるか？","choices":["8〜10mmの人工血管を端側吻合して送血する","大静脈とシャントを作成して送血する","肺動脈を経由して送血する","心尖部から特殊なチューブを通して送血する","大腿動脈とバイパスシャントを作成して送血する"],"correct":0,"expl":["（正解）直接挿入による動脈損傷や血流制限を防ぐため、8〜10mmの人工血管を端側に吻合し、そこから送血を行う方法がよく選択される。","大静脈とのシャント作成という方法は鎖骨下動脈送血の代替法として用いられない。","肺動脈経由の送血という方法は動脈送血の代替法として一般的ではない。","心尖部からの特殊チューブという方法は鎖骨下動脈送血の代替法として説明されるものではない。","大腿動脈とのバイパスシャント作成は鎖骨下動脈送血の代替法として一般的に行われる方法ではない。"]},{"stem":"体外循環中における脳灌流障害を非観血的かつ連続的に早期発見するため、前額部にセンサーを貼ってモニタリングする数値はどれか？","choices":["混合静脈血酸素飽和度（SvO2）","脳内局所酸素飽和度（rSO2）","経皮的動脈血酸素飽和度（SpO2）","脳波（EEG）","経頭蓋ドップラー（TCD）"],"correct":1,"expl":["混合静脈血酸素飽和度（SvO2）は全身の酸素需給バランスの指標であり、前額部センサーで局所的な脳灌流を評価するものではない。","（正解）流量や血圧が正常でも脳灌流障害が起きている可能性を早期に捉えるため、INVOSやNIROといった機器を用いて前額部に貼ったセンサーから脳内局所酸素飽和度（rSO2）をモニタリングする。","経皮的動脈血酸素飽和度（SpO2）は全身の動脈血酸素化の指標であり、脳局所の灌流評価に特化したものではない。","脳波（EEG）は脳の電気的活動を評価するものであり、前額部センサーによる酸素飽和度モニタリングとは異なる。","経頭蓋ドップラー（TCD）は側頭骨の骨窓を利用した超音波による脳血流速度の測定法であり、前額部に貼るセンサーによる連続モニタリングとは方式が異なる。"]},{"stem":"大動脈遮断を行い、大動脈基部から順行性に心筋保護液の注入を開始したところ、注入圧が異常に高かった。考えられる原因として「誤っている」ものはどれか？","choices":["大動脈基部カニューレが大動脈内腔に入っていない","大動脈弁の高度な閉鎖不全（AR）が存在する","大動脈解離を生じている","カニューレが遮断鉗子で挟まれている","カニューレ先端が冠動脈口に迷入している"],"correct":1,"expl":["大動脈基部カニューレが大動脈内腔に正しく入っていない場合、注入圧の異常上昇の原因となり得る。","（正解＝誤っている）大動脈弁閉鎖不全（AR）がある場合は、保護液が左室内に漏れてしまうため注入圧はむしろ「低く」なる。注入圧の異常高値の原因としては誤りである。","大動脈解離を生じている場合、真腔以外に注入されることで注入圧の異常上昇が生じ得る。","カニューレが遮断鉗子で挟まれている場合、通路が塞がれ注入圧が異常に上昇し得る。","カニューレ先端が冠動脈口に迷入している場合も、狭い冠動脈へ直接高い圧がかかり注入圧の上昇が生じ得る。"]},{"stem":"冠静脈洞から「逆行性」に心筋保護液を注入している際、注入圧が異常に高い場合、どのような原因が考えられるか？","choices":["大動脈弁閉鎖不全を合併している","カニューレのバルーンが破裂している","先端が細い冠静脈の枝に迷入し、壁に当たっている","冠動脈に高度の狭窄がある","カニューレ先端位置が浅すぎる"],"correct":2,"expl":["大動脈弁閉鎖不全は順行性注入の効果に影響する病態であり、逆行性注入時の注入圧異常高値の直接原因として説明されるものではない。","カニューレのバルーンが破裂している場合は、むしろ密閉性が失われ注入圧は低下する方向に働く。","（正解）逆行性カニューレの先端が細い枝に深く入りすぎて静脈壁に当たっていると圧が異常上昇するため、カニューレの位置を少し浅く引き戻す必要がある。","冠動脈自体の狭窄は順行性注入時の心筋灌流に影響する要因であり、逆行性カニューレの注入圧異常高値の直接原因として一般的に説明されるものではない。","カニューレ先端位置が浅すぎる場合は、冠静脈洞内で保護液が逃げやすくなり、むしろ注入圧は低下する方向に働く。"]},{"stem":"右心系（右房など）を切開する手術において、静脈血が右房に流れ込まない「完全体外循環」へと移行するために行う操作はどれか？","choices":["肺動脈をクランプする","上・下大静脈に回したテープ（ターニケット）で脱血管を締め付ける","心筋保護液を大量に注入する","大動脈遮断鉗子をかける","脱血ラインをすべてクランプする"],"correct":1,"expl":["肺動脈のクランプは右心系からの拍出を止める操作であり、完全体外循環への移行操作そのものではない。","（正解）上大静脈と下大静脈に挿入した脱血管の周囲をテープで締め付ける（スネアする）ことで、右房への血流を完全に遮断し、すべての静脈血を人工心肺へ導く。","心筋保護液の大量注入は心停止を得るための操作であり、完全体外循環への移行操作ではない。","大動脈遮断鉗子は送血側（大動脈）を遮断する操作であり、静脈還流を制御する完全体外循環への移行操作ではない。","脱血ラインをすべてクランプしてしまうと脱血自体ができなくなり、完全体外循環への移行とは逆の結果になる。"]},{"stem":"大動脈遮断を解除する前、左心系に残った気泡を除去（空気抜き）する際の手技として「適切でない」ものはどれか？","choices":["麻酔科医に肺を加圧してもらい、左房内圧を陽圧にする","心臓を揺さぶったり、左室心尖部を持ち上げたりする","静脈脱血量を一時的に最大にして、右心系を完全に虚脱させる","経食道エコーで気泡遺残部位を特定する","大動脈基部の心筋保護液注入ラインから逆行性に排気する"],"correct":2,"expl":["麻酔科医による肺の加圧は肺静脈還流を介して左房内圧を陽圧にし、気泡を排出させるために有効な手技である。","心臓を揺さぶる、心尖部を持ち上げるといった操作は付着した気泡を遊離させるために行われる有効な手技である。","（正解＝適切でない）空気を外へ押し出すためには、静脈還流を保ち肺循環血流を確保して左心系に血液を満たし陽圧にする必要がある。静脈脱血量を最大にして右心系を虚脱させると左心系への血流が減少し、空気を効果的に追い出せない。","経食道エコーによる気泡遺残部位の特定は空気抜きの効果を確認するために有効な手技である。","大動脈基部の心筋保護液注入ラインを利用した排気も、左心系上部にたまった気泡を排出する目的で用いられる有効な手技である。"]},{"stem":"心内操作が終わり、人工心肺からの「離脱」を開始する直前、麻酔科医に依頼する重要な処置はどれか？","choices":["ヘパリンの追加投与","人工呼吸（換気）の再開","深部体温の20℃への冷却","大動脈の再遮断","筋弛緩薬の追加投与"],"correct":1,"expl":["ヘパリンの追加投与は抗凝固を強める操作であり、離脱直前に麻酔科医へ依頼する処置ではない（離脱後にプロタミンで拮抗する）。","（正解）体外循環の離脱を始める前には、休止していた患者の肺でのガス交換を再開させるため、麻酔科医が用手的に加圧換気を行い、人工呼吸を再開する。","深部体温を20℃まで冷却するのは超低体温循環停止法など特殊な場面での操作であり、通常の離脱直前に行う処置ではない。","大動脈の再遮断は離脱の準備とは逆の操作であり、通常この場面で行われるものではない。","筋弛緩薬の追加投与は離脱直前に特に強調される必須の処置ではない。"]},{"stem":"心筋保護液の注入圧・注入量に問題がないにもかかわらず心停止が得られない場合の原因について、正しい記述の組み合わせはどれか。\na　大動脈遮断が不十分で、動脈血が冠動脈に流れ込んでいる。\nb　心筋保護液のカリウム濃度に問題がある。\nc　順行性注入時、大動脈弁狭窄により冠動脈への灌流が促進されている。\nd　心筋保護液の投与時間が長すぎる。\ne　送血流量が不足している。","choices":["a, b","a, e","b, c","c, d","d, e"],"correct":0,"expl":["（正解）aは正しい（大動脈遮断が不十分だと動脈血が冠動脈へ流入し続け、心筋保護液の効果が得られにくい）。bも正しい（心筋保護液のカリウム濃度が適切でないと十分な心停止が得られない）。両者とも正しい記述であり、この組み合わせが正解となる。","a（正）とeの組み合わせ。eは誤り（送血流量の不足は心停止が得られないことの直接原因として一般的に説明されるものではない）であるため、この組み合わせは不適切。","b（正）とcの組み合わせ。cは誤り（大動脈弁の異常としてまず疑われるのは狭窄ではなく閉鎖不全〈逆流〉であり、また灌流が「促進」されるという記述も誤り）であるため、この組み合わせは不適切。","cとdの組み合わせ。いずれも誤り（cは前述の通り誤り、dも誤り〈投与時間の長さそのものは心停止が得られない原因として一般的に説明されるものではない〉）であるため、この組み合わせは不適切。","dとeの組み合わせ。いずれも誤りであるため、この組み合わせは不適切。"]},{"stem":"心筋保護液の投与方法として、代表的な2つの経路の組み合わせはどれか？","choices":["順行性（大動脈基部）・逆行性（冠静脈洞）","順行性（肺動脈）・逆行性（大動脈基部）","経静脈性・経皮的","選択的冠灌流・全身灌流","順行性（左室心尖部）・逆行性（右房）"],"correct":0,"expl":["（正解）心筋保護液の投与方法として代表的なのは、大動脈基部から冠動脈へ順行性に注入する方法と、冠静脈洞から逆行性に注入する方法の2つである。","肺動脈への順行性注入、大動脈基部からの逆行性注入という組み合わせは、実際の代表的な2経路とは異なる。","「経静脈性・経皮的」という分類は心筋保護液の投与経路の一般的な分類ではない。","選択的冠灌流は大動脈弁閉鎖不全時などに用いられる方法の一つであり、全身灌流は通常の体外循環そのものを指す語であって、心筋保護液投与の代表的な2経路の組み合わせではない。","左室心尖部からの順行性注入、右房への逆行性注入という組み合わせは、実際の代表的な2経路とは異なる。"]}]},{"title":"第5章：モニター","code":"mon","questions":[{"stem":"冷却時および復温時、組織の低温傷害や気泡発生を予防するため、送血温と鼻咽頭温の温度較差は何度以内にするよう推奨されているか？","choices":["2℃以内","5℃以内","10℃以内","15℃以内","20℃以内"],"correct":2,"expl":["2℃以内は厳しすぎる基準であり、通常の温度管理としては求められていない。","5℃以内も一般的な推奨基準よりは厳しい数値である。","（正解）送血温と鼻咽頭温の較差は10℃以内になるようにし、急激な温度変化による組織の低温傷害や気泡（マイクロバブル）の発生を予防する。","15℃以内では較差が大きすぎ、気泡発生や組織傷害のリスクが高まる。","20℃以内はさらに較差が大きく、安全な温度管理の基準を満たさない。"]},{"stem":"復温時、血液損傷やタンパク変性を防ぐため、人工心肺の送血温は最高で何度を超えないように設定すべきか？","choices":["35℃","37℃","39℃","42℃","45℃"],"correct":1,"expl":["35℃は上限としては低すぎ、復温が非効率になる。","（正解）血液損傷やタンパク変性を防止するため、熱交換器の温度に注意し、送血温が37℃を超えないようにする。","39℃はすでに血液成分への熱損傷やタンパク変性のリスクが生じる温度である。","42℃は明らかに高すぎ、溶血やタンパク変性を来す危険な温度である。","45℃はさらに危険であり、臨床的に許容される上限をはるかに超える。"]},{"stem":"人工心肺の送血圧が著しく上昇した場合、回路側の原因として考えられるものはどれか？","choices":["人工肺や動脈フィルターの目詰まり","静脈貯血槽の液面レベル低下","ヘパリンの過剰投与","患者の血圧低下","麻酔深度の低下"],"correct":0,"expl":["（正解）回路内圧が高くなる要因として、人工肺や動脈フィルターの目詰まり、送血回路の屈曲などの回路側の異常が挙げられる。","静脈貯血槽の液面レベル低下は脱血側のトラブルであり、送血圧上昇の直接的な回路側原因ではない。","ヘパリンの過剰投与は抗凝固に関する事項であり、送血圧の上昇とは直接関係しない。","患者の血圧低下は生体側の変化であり、回路側の原因には当たらない。","麻酔深度の低下も生体側（患者側）の要因であり、回路側の原因ではない。"]},{"stem":"静脈貯血槽の液面レベルが急激に低下する原因の多くを占めるのはどれか？","choices":["動脈フィルターの目詰まり","脱血管の屈曲やエアーブロック","尿量の急激な増加","熱交換器の温度上昇","送血カニューレの位置異常"],"correct":1,"expl":["動脈フィルターの目詰まりは送血側のトラブルであり、貯血槽レベル低下の主因ではない。","（正解）液面レベル低下の原因の多くは脱血管の屈曲やエアーブロックであり、これらを認めた場合は速やかに送血を止め、原因を除去する。","尿量の急激な増加は貯血槽レベルにわずかに影響し得るが、急激な低下の主たる原因ではない。","熱交換器の温度上昇は温度管理上の問題であり、貯血槽レベルの急激な低下とは直接関係しない。","送血カニューレの位置異常は送血側の問題であり、脱血由来の貯血槽レベル低下の主因ではない。"]},{"stem":"手術中の心電図モニターにおいて、心臓の収縮や虚血などを鋭敏に捉えるため、通常標準として用いられる誘導の組み合わせはどれか？","choices":["第I誘導とV1誘導","第II誘導とV5誘導","第III誘導とaVR誘導","aVL誘導とV6誘導","V1誘導とV6誘導"],"correct":1,"expl":["第I誘導とV1誘導の組み合わせは、心拍数や調律、虚血の把握を目的とした標準的なモニター誘導ではない。","（正解）心拍数、調律、刺激伝導の状態の把握や虚血の発見のため、通常は第II誘導とV5誘導を標準としてモニターに用いる。","第III誘導とaVR誘導の組み合わせは、標準的なモニター誘導として一般的ではない。","aVL誘導とV6誘導の組み合わせも、標準的に用いられる誘導の組み合わせではない。","V1誘導とV6誘導の組み合わせも、心臓手術における標準モニター誘導としては一般的でない。"]},{"stem":"人工心肺中、中心静脈圧（CVP）が異常に上昇（例えば20mmHg以上）した場合、合併する危険性が高まる重篤な状態はどれか？","choices":["脳浮腫","肺出血","肝不全","腸管虚血","気胸"],"correct":0,"expl":["（正解）CVPが20mmHg以上になると、静脈うっ滞に伴い脳浮腫を合併する危険性が高まるため、厳重に監視する必要がある。","肺出血はCVP上昇と直接結び付けて説明される代表的な合併症ではない。","肝不全はうっ血肝の原因にはなり得るが、CVP異常上昇時にまず注意すべき重篤な合併症として一般的に説明されるものではない。","腸管虚血は主に灌流量不足や血管攣縮などで生じるものであり、CVP上昇との直接的な関連で説明されるものではない。","気胸はCVP上昇の合併症ではなく、中心静脈カテーテル留置手技自体の合併症として知られるものである。"]},{"stem":"人工心肺中、脳温に最も近い指標としてモニタリングされる体温はどれか？","choices":["食道温","膀胱温","鼻咽頭温（または鼓膜温）","直腸温","末梢温（足底温）"],"correct":2,"expl":["食道温は中心温の指標として有用だが、脳温に最も近い指標として位置づけられるものではない。","膀胱温は深部体温の指標としてモニターされるが、脳温を直接反映するものではない。","（正解）鼻咽頭温、鼓膜温は脳に近い部位で測定されるため、脳温に近いという意味でモニターされる。ただし鼓膜温は鼓膜損傷の可能性があるため、一般に鼻咽頭温が多く用いられる。","直腸温も膀胱温と同様に深部体温の指標であり、脳温を直接反映するものではない。","末梢温（足底温）は末梢循環の指標であり、中枢温との較差を評価するために用いられるが、脳温の指標ではない。"]},{"stem":"人工心肺中、全身の臓器灌流が適切に維持されている間接的指標となる尿量は、最低でも何mL/時/kg以上を維持するべきか？","choices":["0.1 mL/時/kg","0.5 mL/時/kg","1.0 mL/時/kg","2.0 mL/時/kg","3.0 mL/時/kg"],"correct":2,"expl":["0.1 mL/時/kgは基準として低すぎ、臓器灌流の維持を示す指標にはならない。","0.5 mL/時/kgもまだ不十分な値であり、推奨される最低基準ではない。","（正解）尿量は腎血流量だけでなく全身の臓器灌流の間接的指標でもあり、人工心肺時には1mL/時/kg以上を維持するようにする。","2.0 mL/時/kgは十分に良好な尿量ではあるが、「最低限維持すべき」基準として設定されている値ではない。","3.0 mL/時/kgも基準値として設定されているものではない。"]},{"stem":"人工心肺中の血液ガスの目標値として、原則として動脈血炭酸ガス分圧（pCO2）はどの範囲に維持することが推奨されるか？","choices":["20〜25 mmHg","35〜40 mmHg","50〜60 mmHg","80〜100 mmHg","100〜120 mmHg"],"correct":1,"expl":["20〜25 mmHgは低すぎる値であり、過換気に相当する不適切な範囲である。","（正解）原則としてpO2 100〜400mmHg、pCO2 35〜40mmHg、base excess 0〜5に維持するように管理する。","50〜60 mmHgは高すぎる値であり、呼吸性アシドーシスに相当する範囲である。","80〜100 mmHgはさらに高度な高炭酸ガス血症に相当し、目標範囲として不適切である。","100〜120 mmHgは目標範囲から大きく外れており、著しい高炭酸ガス血症の状態である。"]},{"stem":"体外循環中、過度な血液希釈による組織への酸素運搬能低下を防ぐため、ヘマトクリット値（Ht）とヘモグロビン（Hb）濃度はそれぞれ最低でもどの値以上を維持するよう調節するか？","choices":["Ht 10%以上、Hb 5.0 g/dL以上","Ht 15%以上、Hb 6.0 g/dL以上","Ht 20%以上、Hb 7.0 g/dL以上","Ht 30%以上、Hb 10.0 g/dL以上","Ht 35%以上、Hb 12.0 g/dL以上"],"correct":2,"expl":["Ht 10%、Hb 5.0 g/dLはいずれも低すぎ、組織の酸素運搬能を維持できない危険な値である。","Ht 15%、Hb 6.0 g/dLもまだ不十分であり、推奨される最低基準を下回る。","（正解）体外循環中は過度の血液希釈による酸素運搬能低下を防ぐため、Ht値20%以上、Hb濃度7.0 g/dL以上を維持するように調節する。","Ht 30%、Hb 10.0 g/dLは良好な値ではあるが、体外循環中に「最低限維持すべき」基準としては高く設定しすぎている。","Ht 35%、Hb 12.0 g/dLは通常の血液希釈を伴う体外循環では現実的でなく、基準値として設定されていない。"]},{"stem":"手術室で使用できるPoint-of-care（POC）モニターのうち、全血を用いて凝固因子活性、血小板機能、線溶能などの血液粘弾性を包括的に評価する検査はどれか？","choices":["PT-INR","APTT","FDP","TEGまたはROTEM","フィブリノゲン単独測定"],"correct":3,"expl":["PT-INRは血漿を検体とする標準的な凝固テストの一つであり、血液粘弾性を包括的に評価するものではない。","APTTも血漿を用いた標準的な凝固テストであり、血小板機能や線溶能までは評価できない。","FDP（フィブリン分解産物）は線溶系の指標の一つに過ぎず、包括的な血液粘弾性検査ではない。","（正解）TEG（トロンボエラストグラフィー）やROTEM（回転式トロンボエラストメトリー）は全血を検体として凝固過程における血液粘弾性の変化を経時的に測定し、凝固因子活性、血小板機能、線溶能を包括的に評価できる。","フィブリノゲン単独測定はしばしば併せて計測されるが、血小板機能や線溶能までを含めた包括的な評価はできない。"]},{"stem":"上行大動脈へ送血カニューレを挿入する前、大動脈壁の性状（粥腫や石灰化など）を詳細に評価し、経食道心エコーの死角を補うために用いられるエコー検査はどれか？","choices":["epiaortic echo（直接大動脈エコー）","経胸壁心エコー（TTE）","血管内超音波（IVUS）","経頭蓋ドップラー（TCD）","経食道心エコー（TEE）"],"correct":0,"expl":["（正解）epiaortic echo（直接大動脈エコー）は、大動脈壁の詳細な情報が得られるとともに、経食道心エコーの死角（上行大動脈の末梢から弓部大動脈）を補うことができる。","経胸壁心エコー（TTE）は体表から行う心エコーであり、術中に大動脈壁の性状を詳細に評価する目的では用いられない。","血管内超音波（IVUS）はカテーテルを血管内に挿入して行う検査であり、上行大動脈の術前評価として一般的に用いられるものではない。","経頭蓋ドップラー（TCD）は脳血流や微小塞栓のモニターに用いられるものであり、大動脈壁の性状評価には用いられない。","経食道心エコー（TEE）はそれ自体が有用なモニターであるが、上行大動脈遠位部から弓部大動脈にかけては死角となるため、epiaortic echoで補う必要がある。"]},{"stem":"前額部から得た脳波を処理して数値化し、麻酔深度や鎮静の指標として用いられるモニターはどれか？","choices":["BIS（bispectral index）モニター","脳内局所酸素飽和度（rSO2）モニター","運動誘発電位（MEP）モニター","連続心拍出量（CCO）モニター","混合静脈血酸素飽和度（SvO2）モニター"],"correct":0,"expl":["（正解）センサーを前額部に装着して得た脳波を処理し、数値化したものがBIS（bispectral index）モニターであり、麻酔深度や鎮静の指標として用いられる。","脳内局所酸素飽和度（rSO2）モニターは近赤外線分光法により脳組織の酸素化を評価するものであり、脳波を処理して麻酔深度を示すものではない。","運動誘発電位（MEP）モニターは脊髄機能の評価に用いられるものであり、麻酔深度の指標ではない。","連続心拍出量（CCO）モニターは心機能・循環動態の指標であり、脳波とは無関係である。","混合静脈血酸素飽和度（SvO2）モニターは全身の酸素需給バランスの指標であり、麻酔深度を示すものではない。"]},{"stem":"左室機能が低下している症例に対し、心内操作終了時に経左房壁あるいは経肺静脈経路でカテーテルを左房に留置して左房圧（LAP）を測定する主な目的として正しいのはどれか？","choices":["左心系の前負荷（容量負荷）の状態を評価するため","肺うっ血の有無を直接目視で確認するため","右心機能を評価するため","末梢循環の状態を評価するため","脳灌流の状態を評価するため"],"correct":0,"expl":["（正解）左室機能が低下している症例では、心内操作終了時にLAPを測定することで、左心系の前負荷（容量負荷）の状態を把握し、輸液管理や強心薬の使用など人工心肺離脱時の循環管理に役立てる。","LAPの測定は圧の数値としての評価であり、肺うっ血の有無を「直接目視」で確認する手段ではない。","LAPは左房圧であり、右心機能の評価には中心静脈圧（CVP）などが用いられる。","末梢循環の状態は末梢温と中枢温の較差などで評価されるものであり、LAPで直接評価するものではない。","脳灌流の状態はrSO2や経頭蓋ドップラーなどで評価されるものであり、LAPとは直接関係しない。"]},{"stem":"動脈圧波形から心拍出量や一回拍出量変化（SVV）などのパラメーターを算出する、低侵襲血行動態モニタリングシステムはどれか？","choices":["動脈圧波形心拍出量モニタリングシステム（ビジレオ・フロートラックシステムなど）","Swan-Ganzカテーテル（肺動脈カテーテル）","TEGまたはROTEM","BISモニター","近赤外線分光法によるrSO2モニター"],"correct":0,"expl":["（正解）動脈圧波形により血行動態パラメーターを推算するモニタリングシステム（ビジレオ・フロートラックシステムなど）は、動脈圧波形のアルゴリズム解析から心拍出量や一回拍出量を算出でき、また呼吸性変動から一回拍出量変化（SVV）を算出して心臓前負荷の指標とすることができる。","Swan-Ganzカテーテルは肺動脈にカテーテルを留置する観血的なモニターであり、動脈圧波形からの低侵襲的な算出とは異なる方法である。","TEGまたはROTEMは血液粘弾性検査であり、血行動態パラメーターの算出とは無関係である。","BISモニターは脳波を利用した麻酔深度の指標であり、心拍出量やSVVの算出とは無関係である。","近赤外線分光法によるrSO2モニターは脳組織の酸素化を評価するものであり、動脈圧波形からの心拍出量算出とは異なる原理のモニターである。"]},{"stem":"体外循環中、末梢温（足底温など）と中枢温（鼻咽頭温）の較差が縮小している場合に示唆される状態として、最も適切なのはどれか？","choices":["末梢循環が良好に保たれている","重度の末梢血管攣縮が生じている","循環血液量が著しく減少している","低心拍出状態に陥っている","体温管理そのものが破綻している"],"correct":0,"expl":["（正解）体外循環による加温・冷却は先に中枢温が変化してから末梢に及ぶため、末梢循環が良好な場合には中枢温と末梢温の温度較差は小さくなる。","重度の末梢血管攣縮が生じている場合は末梢への熱の伝達が妨げられ、むしろ較差は拡大する方向に働く。","循環血液量が著しく減少している場合、末梢循環が保たれにくくなり、較差はむしろ拡大しやすい。","低心拍出状態では末梢循環が悪化しやすく、中枢温と末梢温の較差は拡大する傾向にある。","較差の縮小はむしろ良好な体温管理・循環管理の指標であり、管理の破綻を示すものではない。"]},{"stem":"混合静脈血酸素飽和度（SvO2）が低下している場合に考えられる病態として、最も適切なのはどれか？","choices":["心拍出量の低下や組織の酸素消費量増加により、末梢への酸素供給が需要に対して不足している","肺での酸素化が過剰に亢進している","全身の代謝が著しく低下している","体温低下により組織の酸素消費が著しく減少している","ヘモグロビン濃度が過剰に上昇している"],"correct":0,"expl":["（正解）SvO2は呼吸による酸素供給と心拍出量に従う酸素運搬、末梢循環での酸素消費の総合的結果を表す指標であり、心拍出量の低下や酸素消費量の増加によって末梢への酸素供給が需要に対して不足すると低下する。","肺での酸素化が過剰に亢進している状態は、通常SvO2の低下を来す病態としては説明されない。","全身の代謝が著しく低下している場合はむしろ酸素消費量が減少し、SvO2は上昇しやすい。","体温低下により酸素消費が減少する場合もSvO2はむしろ上昇する方向に働き、低下の説明にはならない。","ヘモグロビン濃度の上昇は酸素運搬能の増加につながり、通常SvO2の低下を来す直接的な原因とはならない。"]},{"stem":"体外循環における抗凝固・凝固能モニタリングについて、正しい記述の組み合わせはどれか。\na　ACTは低体温によって短縮する。\nb　ACTの測定値は、測定装置の測定原理や活性剤の違いによって変わり得る。\nc　抗リン脂質抗体症候群などでは、ACTがヘパリン効果を正確に反映しないことがある。\nd　TEGやROTEMは、血漿成分のみを検体として測定する検査である。\ne　ヘパリンは合成化学物質であり、その力価にロット差は生じない。","choices":["a, b","a, e","b, c","c, d","d, e"],"correct":2,"expl":["aとbの組み合わせ。aは誤り（ACTは低体温や血液希釈によりむしろ延長する）であるため、この組み合わせは不適切。","aとeの組み合わせ。いずれも誤り（aは前述の通り誤り、eも誤り〈ヘパリンは生物学的製剤であり、力価が必ずしも一定でない〉）であるため、この組み合わせは不適切。","（正解）bは正しい（ACT測定装置は測定原理や活性剤の違いにより測定値の標準値が変わり得る）。cも正しい（抗リン脂質抗体症候群などではACTがヘパリン効果を正確に反映しないことがあり、ヘパリン濃度を測定する装置が用いられる場合がある）。両者とも正しい記述であり、この組み合わせが正解となる。","cとdの組み合わせ。cは正しいが、dは誤り（TEGやROTEMは全血を検体として測定する検査であり、血漿成分のみを用いるものではない）であるため、この組み合わせは不適切。","dとeの組み合わせ。いずれも誤りであるため、この組み合わせは不適切。"]},{"stem":"次のうち、人工心肺（機械）側に必要なモニターとして挙げられないものはどれか？","choices":["送血圧モニター","静脈貯血槽の液面（レベル）モニター","VAVD使用時の陰圧モニター","回路組み込み型の血液ガスモニター","BIS（脳波）モニター"],"correct":4,"expl":["送血圧モニターは、回路の目詰まりや屈曲など機械側のトラブルを早期に発見するために必要な人工心肺側モニターである。","静脈貯血槽の液面（レベル）モニターは、脱血不良やエアーブロックなどを発見するために必要な人工心肺側モニターである。","VAVD使用時の陰圧モニターは、貯血槽内圧や脱血回路圧を把握するために必要な人工心肺側モニターである。","回路組み込み型の血液ガスモニターは、pH・PO2・PCO2を連続的に把握するための人工心肺側モニターである。","（正解）BIS（脳波）モニターは前額部のセンサーから得られる脳波をもとに麻酔深度を評価する生体側モニターであり、人工心肺（機械）側のモニターには分類されない。"]},{"stem":"次のうち、生体側モニターに分類されないものはどれか？","choices":["心電図","中心静脈圧（CVP）","貯血槽の陰圧モニター","混合静脈血酸素飽和度（SvO2）","活性化凝固時間（ACT）"],"correct":2,"expl":["心電図は、心臓の収縮・弛緩の状態を鋭敏に示す代表的な生体側モニターである。","中心静脈圧（CVP）は、脱血状況や循環血液量を反映する生体側モニターである。","（正解）貯血槽の陰圧モニターはVAVD使用時に貯血槽内圧を把握するためのモニターであり、人工心肺（機械）側のモニターに分類される。","混合静脈血酸素飽和度（SvO2）は、酸素供給と酸素消費の総合的結果を表す生体側モニターである。","活性化凝固時間（ACT）は、ヘパリンによる抗凝固効果をモニタリングするための生体側モニターである。"]}]},{"title":"第6章：適正灌流量・血液希釈","code":"perf","questions":[{"stem":"生体の体表面積あたりの酸素需要量が最高値を示すのはどの時期か？","choices":["新生児期","乳幼児期","学童期","成人期","老年期"],"correct":1,"expl":["新生児期も酸素需要は高いが、体表面積あたりの需要量が最高値を示すのは新生児期ではなく乳幼児期である。","（正解）生体の酸素需要量は一定ではなく、乳幼児期（生後9〜12カ月頃）が最高値（平均値180 mL/分/m²程度）を示し、その後成長とともに漸減する。","学童期はすでに乳幼児期より酸素需要量は低下している。","成人期は成長発育のための酸素消費がなくなるため、乳幼児期より明らかに低い（約140 mL/分/m²程度）。","老年期は成人期よりもさらに代謝が低下する傾向にあり、最高値を示す時期ではない。"]},{"stem":"組織における酸素摂取が成人と乳幼児で同じと仮定した場合、乳幼児の酸素需要を満たすために必要な灌流量は成人の約何倍になるか？","choices":["約0.8倍","約1.0倍","約1.3倍","約2.0倍","約2.5倍"],"correct":2,"expl":["約0.8倍では乳幼児の灌流量が成人より少ないことになり、実際とは逆である。","約1.0倍では乳幼児と成人の灌流量が同じということになり、乳幼児期の高い酸素需要が反映されない。","（正解）乳幼児は生命維持に加え成長発育のための酸素消費を必要とするため、酸素需要を満たすために必要な灌流量は成人の約1.3倍となる。","約2.0倍は乳幼児期の灌流量として過大な見積もりである。","約2.5倍はさらに過大な見積もりであり、実際の数値から大きく外れる。"]},{"stem":"常温・血液希釈がない条件において、成人の適正灌流指数（L/分/m²）の目安とされているのはどれか？","choices":["0.5〜1.0 L/分/m²","1.0〜1.5 L/分/m²","2.0〜2.5 L/分/m²","3.0〜3.5 L/分/m²","4.0〜4.5 L/分/m²"],"correct":2,"expl":["0.5〜1.0 L/分/m²は成人の適正灌流指数としては明らかに低すぎる値である。","1.0〜1.5 L/分/m²も一般的な目安より低い値である。","（正解）常温・血液希釈のない条件において、成人の適正灌流指数は諸家の報告でほぼ一致しており、2.0〜2.3 L/分/m²程度、すなわち2.0〜2.5 L/分/m²の範囲に収まるとされる。","3.0〜3.5 L/分/m²は目安として高すぎる値である。","4.0〜4.5 L/分/m²はさらに高く、通常の管理目標としては設定されない。"]},{"stem":"人工心肺の灌流量を低下させた場合、生体の自己調節（autoregulation）により血流量が比較的維持されやすい臓器の組み合わせはどれか？","choices":["腎臓・肝臓","脳・心臓","骨格筋・皮膚","腸管・膵臓","脾臓・膀胱"],"correct":1,"expl":["腎臓・肝臓は低灌流時に血流が優先的に維持される臓器ではなく、むしろ血流減少の影響を受けやすい。","（正解）生体は灌流量の低下に対して、生命維持に不可欠な脳と心臓の血流・酸素摂取を優先的に維持するように臓器循環を変動させる。","骨格筋・皮膚は低灌流時に血流が大きく減少しやすい臓器である。","腸管・膵臓も低灌流時に血流が大きく減少しやすい臓器（腹部内臓）に含まれる。","脾臓・膀胱についても、脳・心臓のように優先的に血流が維持される臓器としては一般的に説明されない。"]},{"stem":"人工心肺の低灌流状態において、交感神経などを介する神経性調節により血流が大きく減少する臓器はどれか？","choices":["脳","心臓","腎臓・腹部内臓","肺","冠動脈"],"correct":2,"expl":["脳は低灌流時にも自己調節により血流が維持されやすい臓器である。","心臓（冠動脈）も脳と同様に、低灌流時に血流が維持されやすい臓器である。","（正解）低灌流では脳や心臓の血流が維持される一方、腎臓や腹部内臓（腸管など）、筋肉への血流は交感神経などを介する神経性調節により大きく減少する。そのため腎機能障害合併例などでは高流量の維持が必要となる。","肺は体外循環中は肺循環を経由しないため、この文脈での血流減少の説明対象とはならない。","冠動脈は心臓に血液を供給する血管であり、脳・心臓と同様に血流が維持されやすい側に含まれる。"]},{"stem":"腎臓の血流量は、安静時において心拍出量のおよそどの程度を占めているか？","choices":["約5%","約10%","約25%（1/4）","約50%（1/2）","約75%（3/4）"],"correct":2,"expl":["約5%は腎血流量としては過小評価である（この値は心臓〈冠動脈〉への血流配分割合〈安静時の心拍出量の約5%〉に近い）。","約10%も腎血流量として過小評価である。","（正解）腎臓の重量は体重の約0.5%に過ぎないが、血流量は心拍出量の約1/4（25%）を占める。","約50%（1/2）は腎血流量として過大評価であり、実際の値の2倍にあたる。","約75%（3/4）はさらに大幅な過大評価である。"]},{"stem":"脳の重量は体重の約3%であるが、全身の酸素消費量に占める割合はおよそどの程度か？","choices":["約5%","約15%","約27%","約45%","約60%"],"correct":2,"expl":["約5%は脳の酸素消費割合として過小評価である（この値は心臓〈冠動脈〉への血流配分割合〈安静時の心拍出量の約5%〉に近い）。","約15%も過小評価であり、実際の値より低い（なお、約15%は脳の血流量が心拍出量に占める割合に近い値であり、脳の酸素消費量の割合〈27%〉と混同しないよう注意する）。","（正解）脳は重量こそ体重の約3%に過ぎないが、血流量は心拍出量の約16%、酸素消費量は全身の約27%、グルコース消費量は約25%を占める、代謝の非常に活発な臓器である。","約45%は過大評価であり、実際の値を大きく上回る。","約60%はさらに大幅な過大評価である。"]},{"stem":"脳の血管抵抗を変化させる因子として、体外循環中に適正に維持すべき動脈血の指標はどれか？","choices":["酸素分圧（PaO2）","二酸化炭素分圧（PaCO2）","ナトリウムイオン濃度","血糖値","カリウムイオン濃度"],"correct":1,"expl":["酸素分圧（PaO2）も脳循環に影響を与えるが、脳血管抵抗を鋭敏に変化させる代表的な因子としてはPaCO2がより重要である。","（正解）動脈血PaCO2の低下は脳血管を収縮させ、逆にPaCO2の増加は脳血管を弛緩させる。そのため体外循環中はPaCO2を適正な範囲に維持することが脳血流の管理上重要である。","ナトリウムイオン濃度は脳血管抵抗を直接変化させる因子として一般的に説明されるものではない。","血糖値も脳代謝には関与するが、脳血管抵抗を直接変化させる因子としては説明されない。","カリウムイオン濃度は主に心筋の電気的活動に関わる因子であり、脳血管抵抗を変化させる因子として一般的に説明されるものではない。"]},{"stem":"常温において、脳の血流量を血圧変動によらず一定に保つ「autoregulation（自動調節機構）」が働く平均血圧の範囲はどれか？","choices":["20〜50 mmHg","30〜80 mmHg","50〜150 mmHg","100〜200 mmHg","150〜250 mmHg"],"correct":2,"expl":["20〜50 mmHgはautoregulationが働く範囲としては低すぎる。","30〜80 mmHgも実際の範囲より低い方に偏っている。","（正解）常温において、脳は平均血圧が50〜150mmHgの間であれば血流と酸素供給を一定に保つautoregulationの機構を持つ。","100〜200 mmHgは範囲の上限側に偏りすぎており、下限が実際より高すぎる。","150〜250 mmHgはさらに実際の範囲から外れている。"]},{"stem":"低体温時において、脳のautoregulationが維持される下限の灌流圧はおよそ何mmHgか？","choices":["10〜15 mmHg","20〜30 mmHg","40〜50 mmHg","60〜70 mmHg","80〜90 mmHg"],"correct":1,"expl":["10〜15 mmHgは低すぎる値であり、実際の下限より低い。","（正解）低体温では脳のautoregulationは灌流圧20〜30mmHgまで維持されるとされ、低体温の脳保護作用と相まって灌流圧30mmHgが一応の安全下限値と考えられている。","40〜50 mmHgは常温時の安全下限値に近い値であり、低体温時の下限としては高すぎる。","60〜70 mmHgはさらに高く、低体温時の下限値としては不適切である。","80〜90 mmHgは常温時のautoregulation下限をも大きく上回っており、明らかに不適切である。"]},{"stem":"体温が10℃低下すると、生体の酸素消費量は一定の割合で低下する（Q10の法則）。10℃の低下でおよそ何％減少すると言われているか？","choices":["約20%","約30%","約50%","約70%","約80%"],"correct":2,"expl":["約20%では減少幅として過小評価である。","約30%も実際の値より小さい。","（正解）Q10の法則にあてはまり、体温が10℃低下するごとに代謝は低下し、10℃の低下で全身の酸素消費量は約50%減少するとされる。","約70%は減少幅として過大評価である。","約80%はさらに過大評価であり、実際の値から大きく外れる。"]},{"stem":"全身麻酔下の体温が37℃から20℃まで低下した場合、酸素消費量は37℃の時の約何％にまで低下するか？","choices":["約10%","約20%","約30%","約50%","約80%"],"correct":1,"expl":["約10%は低下幅として過大評価である。","（正解）1℃の低下により酸素消費量は約5%低下するため、37℃から20℃（17℃の低下）ではおよそ37℃時の約20%にまで低下する。","約30%は実際よりやや高めの値である。","約50%はQ10の法則における10℃低下時の値に近く、20℃までの低下量としては過大評価である。","約80%は低下幅として過小評価であり、実際の値より高すぎる。"]},{"stem":"低体温時に血液粘稠度（血液のドロドロ具合）が増加する主な原因となる血液成分はどれか？","choices":["血小板","白血球","血漿タンパク質","血球成分（赤血球）","フィブリノゲン"],"correct":3,"expl":["血小板は凝固機能に関わる成分であるが、低体温時の血液粘稠度増加の主因として説明されるものではない。","白血球も炎症反応などには関与するが、血液粘稠度増加の主因ではない。","血漿タンパク質も低温で粘稠度に影響し得るが、主因として説明されるのは血球成分である。","（正解）低体温時の血液粘稠度増加の主因は血球成分（赤血球）にあり、ヘマトクリット値が高いほどその上昇は著しくなる。","フィブリノゲンは凝固因子の一つであるが、低体温時の血液粘稠度増加の主因として説明される成分ではない。"]},{"stem":"体外循環中に低体温を併用する場合、血液粘稠度の増加を防ぐために必須となる処置はどれか？","choices":["ヘパリンの大量投与","血液希釈","カルシウムの投与","濃厚赤血球の輸血","アルブミン投与"],"correct":1,"expl":["ヘパリンの大量投与は抗凝固のための処置であり、血液粘稠度の増加防止を目的としたものではない。","（正解）低体温による血液粘稠度の増加と血液濃縮を防ぐため、人工心肺に低体温を併用する場合は血液を希釈することが必須となる。","カルシウムの投与は血液粘稠度の増加防止とは直接関係しない。","濃厚赤血球の輸血はむしろヘマトクリット値を上昇させ、血液粘稠度を増加させる方向に働く。","アルブミン投与は血漿膠質浸透圧の維持を目的として行われることはあるが、血液粘稠度増加防止のために必須とされる処置ではない。"]},{"stem":"血液希釈液として用いられる細胞外液組成の輸液に該当しないものはどれか？","choices":["重炭酸リンゲル液","酢酸リンゲル液","乳酸リンゲル液","5%ブドウ糖液","マレイン酸リンゲル液"],"correct":3,"expl":["重炭酸リンゲル液は細胞外液組成の輸液であり、血液希釈液として用いられる。","酢酸リンゲル液も細胞外液組成の輸液であり、血液希釈液として広く用いられる。","乳酸リンゲル液も同様に細胞外液組成の輸液である。","（正解）血液希釈液としては細胞外液組成である重炭酸リンゲル液、酢酸リンゲル液、乳酸リンゲル液などが用いられる。5%ブドウ糖液は電解質を含まない糖液であり、細胞外液組成の輸液には該当しない。","マレイン酸リンゲル液も細胞外液組成の輸液の一つであり、血液希釈液として使用され得る。"]},{"stem":"人工心肺の血液希釈液に「マンニトール」を加える主な目的はどれか？","choices":["血液のpHを中和するため","浸透圧利尿効果を得るため","血液の凝固を防ぐため","血小板の働きを活性化させるため","抗酸化作用を得るため"],"correct":1,"expl":["マンニトールは血液のpHを中和する目的で用いられるものではない。","（正解）マンニトールは浸透圧利尿剤であり、血液希釈液に加えることで尿量を確保し、浮腫を防ぐなどの目的で使用される。","マンニトールに血液凝固を防ぐ作用（抗凝固作用）はない。","マンニトールに血小板の働きを活性化させる作用はない。","マンニトールは浸透圧利尿薬であり、抗酸化作用を目的として血液希釈液に加えられるものではない。"]},{"stem":"低体温下での血液希釈について正しい記述はどれか？","choices":["酸素消費量が増加するため、酸素運搬能の低下が致命的となる。","血液粘稠度が低下するため、希釈は不要である。","血液希釈は血液粘稠度の増加を防ぐのに有利であり、酸素消費量の減少により酸素運搬能の低下は支障とならなくなる。","常温下よりも高いヘマトクリット値を維持する必要がある。","低体温では血液希釈を行うべきでない。"],"correct":2,"expl":["低体温では酸素消費量はむしろ減少するため、この記述は誤りである。","低体温では血液粘稠度はむしろ増加するため、希釈が不要という記述は誤りである。","（正解）低体温下では酸素消費量が減少するため、血液希釈による酸素運搬能の低下は大きな支障とならず、むしろ低体温による血液粘稠度の増加を防ぐために血液希釈が有利に働く。","低体温下ではむしろ血液希釈が有利であり、常温下より高いヘマトクリット値を維持する必要があるという記述は誤りである。","低体温では血液粘稠度の増加防止のために、むしろ血液希釈を行うべきである。"]},{"stem":"体重60kg（循環血液量は70mL/kgとする）の成人に、充填量1,800mLの人工心肺回路で体外循環を開始した。このときの血液希釈率はおよそいくらか？","choices":["20%","25%","30%","35%","43%"],"correct":2,"expl":["20%は希釈率としては小さく見積もりすぎである。","25%も実際の値よりやや小さい。","（正解）循環血液量＝60kg×70mL/kg＝4,200mL。希釈率＝充填量÷（循環血液量＋充填量）＝1,800÷（4,200＋1,800）＝1,800÷6,000＝0.30（30%）。分母を循環血液量だけにしない点に注意する。","35%は実際の値よりやや大きい。","43%は、充填量を循環血液量のみで除した場合（1,800÷4,200≒43%）に生じる誤答であり、分母に充填量を加えるのを忘れたことによる典型的な誤りである。"]},{"stem":"術前ヘマトクリット値40%、循環血液量4,200mLの患者に充填量1,800mLの回路で体外循環を開始した。体外循環開始直後の予想ヘマトクリット値はおよそいくらか？","choices":["22%","24%","26%","28%","32%"],"correct":3,"expl":["22%は予想Htとして低く見積もりすぎである。","24%も実際の値より低い。","26%も実際の値よりやや低い。","（正解）赤血球量は変化しないため、予想Ht＝術前Ht×循環血液量÷（循環血液量＋充填量）＝40×4,200÷6,000＝28%。予想Ht＝術前Ht×（1－希釈率）＝40×0.7＝28%と考えても同じである。","32%は充填量の半分程度のみが希釈に関与するものとして計算した場合など、希釈の影響を過小評価した場合に生じ得る誤答である。"]},{"stem":"体重80kg（循環血液量は70mL/kgとする）、術前ヘマトクリット値40%の患者に、充填量1,400mLの回路で体外循環を行う。予想ヘマトクリット値に最も近いものはどれか？","choices":["24%","28%","32%","36%","40%"],"correct":2,"expl":["24%は充填量を実際より多く見積もった場合などに生じ得る誤答である。","28%は希釈率の計算過程で近似を誤った場合に生じ得る誤答である。","（正解）循環血液量＝80kg×70mL/kg＝5,600mL。予想Ht＝40×5,600÷（5,600＋1,400）＝40×5,600÷7,000＝32%。","36%は希釈の影響を過小評価した場合に生じ得る誤答である。","40%は血液希釈による影響を全く考慮せず、術前のヘマトクリット値をそのまま用いた場合に生じ得る誤答である。"]},{"stem":"術前ヘマトクリット値40%、循環血液量4,200mLの患者で、体外循環開始後のヘマトクリット値を25%以上に保ちたい。許容される最大の回路充填量はおよそいくらか？","choices":["1,500mL","2,000mL","2,500mL","2,800mL","3,200mL"],"correct":2,"expl":["1,500mLでは許容される充填量を必要以上に小さく見積もっている。","2,000mLも実際に許容される上限よりやや小さい値である。","（正解）赤血球量が一定なので、術前Ht×循環血液量＝目標Ht×（循環血液量＋充填量）。40×4,200＝25×（4,200＋X）→ 4,200＋X＝6,720 → X＝2,520mL。したがって約2,500mLが上限となる。","2,800mLでは目標のヘマトクリット値25%を下回ってしまい、許容範囲を超える過大な見積もりである。","3,200mLはさらに過大な見積もりであり、目標ヘマトクリット値を大きく下回ってしまう。"]},{"stem":"体重50kg（循環血液量70mL/kg）、術前ヘマトクリット値36%の小柄な患者に、充填量1,500mLの回路を用いた。予想ヘマトクリット値に最も近いものはどれか？","choices":["21%","23%","25%","27%","30%"],"correct":2,"expl":["21%は予想Htとして低く見積もりすぎである。","23%も実際の値よりやや低い。","（正解）循環血液量＝50kg×70mL/kg＝3,500mL。予想Ht＝36×3,500÷（3,500＋1,500）＝36×3,500÷5,000＝25.2%。小柄な患者ほど同じ充填量でも希釈が強くなる点に注意する。","27%は実際の値よりやや高い。","30%は希釈の影響を過小評価した場合に生じ得る誤答である。"]},{"stem":"体表面積1.6m²の成人で、灌流指数（perfusion index）を2.4L/分/m²とした場合の適正灌流量はいくらか？","choices":["2.4L/分","3.0L/分","3.8L/分","4.4L/分","5.0L/分"],"correct":2,"expl":["2.4L/分は、灌流指数の値をそのまま適正灌流量として用いてしまった場合（体表面積を掛けるのを忘れた場合）に生じ得る典型的な誤答である。","3.0L/分は計算過程で近似を誤った場合に生じ得る誤答である。","（正解）適正灌流量＝灌流指数×体表面積＝2.4×1.6＝3.84 ≒ 3.8L/分。常温では2.0〜2.4L/分/m²程度が目安である。","4.4L/分は体表面積を実際より大きく見積もった場合に生じ得る誤答である。","5.0L/分はさらに体表面積を過大に見積もった場合に生じ得る誤答である。"]},{"stem":"灌流量4.0L/分、ヘモグロビン濃度8.0g/dL、動脈血酸素飽和度100%で体外循環中である。溶解酸素を無視した場合の酸素供給量（DO2）に最も近い値はどれか？（Hb 1gあたりの酸素結合量を1.34mLとする）","choices":["約110mL/分","約210mL/分","約320mL/分","約430mL/分","約540mL/分"],"correct":3,"expl":["約110mL/分は、灌流量の単位換算（L/分→dL/分）を誤って逆に扱った場合などに生じ得る誤答である。","約210mL/分は計算過程で位取りを誤った場合などに生じ得る誤答である。","約320mL/分は、ヘモグロビン1gあたりの酸素結合量（1.34mL）を用いずに計算した場合（8.0×40＝320）に生じ得る典型的な誤答である。","（正解）動脈血酸素含量CaO2＝1.34×8.0×1.0＝10.7mL/dL。DO2＝CaO2×灌流量＝10.7mL/dL×40dL/分 ≒ 429mL/分。L/分をdL/分（×10）に直すのがポイントである。","約540mL/分は、ヘモグロビン濃度を10.0g/dLと誤認した場合（10.0×1.34×40≒536）に生じ得る誤答である。"]},{"stem":"体表面積1.7m²の患者において、灌流量4.0L/分、ヘモグロビン濃度8.0g/dL、動脈血酸素飽和度100%で体外循環中である。溶解酸素を無視した場合の酸素供給量係数（DO2I）に最も近い値はどれか？（Hb 1gあたりの酸素結合量を1.34mLとする）","choices":["約150mL/分/m²","約200mL/分/m²","約250mL/分/m²","約300mL/分/m²","約360mL/分/m²"],"correct":2,"expl":["約150mL/分/m²は、体表面積を極端に大きく見積もった場合などに生じ得る誤答である。","約200mL/分/m²は計算過程で近似を誤った場合などに生じ得る誤答である。","（正解）まず酸素供給量DO2を求める。CaO2＝1.34×8.0×1.0＝10.7mL/dL、DO2＝10.7×40 ≒ 429mL/分。DO2I＝DO2÷体表面積＝429÷1.7 ≒ 253mL/分/m²。体外循環中は急性腎障害のリスクが高まる閾値として約270mL/分/m²が知られており、この症例はそれを下回っている。","約300mL/分/m²は、体表面積を1.4m²と誤認した場合（429÷1.4≒306）に生じ得る誤答である。","約360mL/分/m²は、体表面積を1.2m²と誤認した場合（429÷1.2≒357）に生じ得る誤答である。"]},{"stem":"灌流量3.5L/分で体外循環中、動脈血酸素含量と静脈血酸素含量の差（較差）が4.0mL/dLであった。このときの酸素消費量（VO2）はおよそいくらか？","choices":["70mL/分","105mL/分","140mL/分","175mL/分","210mL/分"],"correct":2,"expl":["70mL/分は、動静脈酸素含量較差を2.0mL/dLと誤認した場合（35×2＝70）に生じ得る誤答である。","105mL/分は、動静脈酸素含量較差を3.0mL/dLと誤認した場合（35×3＝105）に生じ得る誤答である。","（正解）Fickの式よりVO2＝灌流量×（CaO2－CvO2）＝35dL/分×4.0mL/dL＝140mL/分。成人の体外循環中の酸素消費量は常温で概ね100〜150mL/分程度である。","175mL/分は、動静脈酸素含量較差を5.0mL/dLと誤認した場合（35×5＝175）に生じ得る誤答である。","210mL/分は、動静脈酸素含量較差を6.0mL/dLと誤認した場合（35×6＝210）に生じ得る誤答である。"]},{"stem":"体外循環中、総循環血液量（患者＋回路）6,000mL、ヘマトクリット値22%であった。限外濾過（血液濃縮）でヘマトクリット値を28%まで上げたい。必要な除水量に最も近いものはどれか？","choices":["約600mL","約900mL","約1,300mL","約1,700mL","約2,100mL"],"correct":2,"expl":["約600mLは、Ht差の計算過程で基準とする値を誤った場合に生じ得る誤答である。","約900mLも、除水量の算出過程で分母の取り方を誤った場合に生じ得る誤答である。","（正解）赤血球量は濾過で失われないため、22×6,000＝28×X → X＝4,714mL。除水量＝6,000－4,714 ≒ 1,286mL（約1,300mL）。","約1,700mLは、目標Htをより高い値と誤認した場合などに生じ得る誤答である。","約2,100mLは、総循環血液量と目標Htの関係を誤って計算した場合に生じ得る誤答である。"]},{"stem":"静脈還流が突然途絶し、静脈貯血槽内に1,200mLの血液が残った状態になった。送血流量を2.4L/分に維持したまま送血ポンプの運転を続けた場合、貯血槽内の血液が空になるまでの時間はおよそ何秒か？","choices":["15秒","20秒","30秒","45秒","60秒"],"correct":2,"expl":["15秒は、送血流量を4.8L/分など実際の2倍として計算した場合（1,200÷4,800分×60＝15秒）に生じ得る誤答である。","20秒は、貯血槽内血液量を800mLなど少なく見積もった場合に生じ得る誤答である。","（正解）貯血槽内血液量1,200mLを送血流量2.4L/分（＝2,400mL/分）で除すと0.5分、すなわち30秒で空になる計算となる。この間に脱血が再開しなければ空気誤送血の危険が生じるため、直ちに送血流量を下げるか送血を停止する必要がある。","45秒は、貯血槽内血液量を1,800mLと多く見積もった場合に生じ得る誤答である。","60秒は、送血流量を1.2L/分と実際の半分として計算した場合（1,200÷1,200分×60＝60秒）に生じ得る誤答である。"]},{"stem":"適正灌流量および血液希釈について、正しい記述の組み合わせはどれか。\na　乳幼児期は体表面積あたりの酸素需要量が成人より高く、灌流量もそれに応じて多く必要とされる。\nb　低体温下では血液粘稠度が低下するため、血液希釈は不要である。\nc　腎臓や腹部内臓は、低灌流時にも自己調節により血流が比較的維持されやすい臓器である。\nd　腎血流量は、安静時の心拍出量の約半分（50%）を占める。\ne　体外循環中の血液希釈の安全限界は、一般にヘモグロビン濃度7g/dL、ヘマトクリット値20%程度とされる。","choices":["a, b","a, e","b, c","c, d","d, e"],"correct":1,"expl":["aとbの組み合わせ。bは誤り（低体温では血液粘稠度はむしろ増加するため、血液希釈が必須となる）であるため、この組み合わせは不適切。","（正解）aは正しい（乳幼児期は体表面積あたりの酸素需要量・灌流指数が成人より高い）。eも正しい（血液希釈の安全限界は一般にHb 7g/dL、Ht 20%程度とされる）。両者とも正しい記述であり、この組み合わせが正解となる。","bとcの組み合わせ。いずれも誤り（bは前述の通り誤り、cも誤り〈低灌流時に自己調節により血流が維持されやすいのは脳や心臓であり、腎臓や腹部内臓はむしろ交感神経を介する血管収縮により血流が減少しやすい臓器である〉）であるため、この組み合わせは不適切。","cとdの組み合わせ。いずれも誤り（cは前述の通り誤り、dも誤り〈腎血流量は心拍出量の約1/4〈25%〉であり、半分ではない〉）であるため、この組み合わせは不適切。","dとeの組み合わせ。dは誤り（前述の通り）であるため、この組み合わせは不適切。"]}]},{"title":"第7章：低体温法","code":"hypo","questions":[{"stem":"低体温法の分類において、「超低体温法（deep or profound hypothermia）」とされる中枢温の範囲はどれか？","choices":["常温（37℃前後）","35〜32℃","32〜28℃","28〜20℃","20℃以下"],"correct":4,"expl":["常温（37℃前後）は低体温法には該当しない。","35〜32℃は「軽度低体温」に分類される範囲である。","32〜28℃は「中等度低体温」に分類される範囲である。","28〜20℃は「高度低体温」に分類される範囲である。","（正解）低体温は目標とする中枢温により、軽度（35〜32℃）、中等度（32〜28℃）、高度（28〜20℃）、超低体温（20℃以下）に分類される。"]},{"stem":"冷却時および復温時において、組織の低温傷害（cold damage）や気泡の発生を防ぐため、送血温と鼻咽頭温の温度較差は何度以内に保つべきか？","choices":["2℃以内","5℃以内","10℃以内","15℃以内","20℃以内"],"correct":2,"expl":["2℃以内は厳しすぎる基準であり、通常の温度管理としては求められていない。","5℃以内は送脱血温較差の目安に近い値であり、送血温と鼻咽頭温の較差としてはやや厳しい。","（正解）急速な温度変化による合併症を防ぐため、送脱血温較差は5℃以内、送血温と鼻咽頭温の差は10℃以内に保つことが推奨されている。","15℃以内では較差が大きすぎ、気泡発生や組織傷害のリスクが高まる。","20℃以内はさらに較差が大きく、安全な温度管理の基準を満たさない。"]},{"stem":"低体温からの復温時、Cerebral hyperthermia（脳の高体温）を避けるために送血温の最高限界とされる温度は何度か？","choices":["35℃","37℃","39℃","42℃","45℃"],"correct":1,"expl":["35℃は上限としては低すぎ、復温が非効率になる。","（正解）復温は緩徐に行う必要があり、脳を保護する観点から送血温は37℃を超えないことが推奨されている。","39℃はすでに脳温上昇（Cerebral hyperthermia）のリスクが生じる温度である。","42℃は明らかに高すぎ、脳障害を来す危険な温度である。","45℃はさらに危険であり、臨床的に許容される上限をはるかに超える。"]},{"stem":"全身の酸素消費量は、体温が10℃低下するごとに一定の割合で減少する（Q10の法則）。10℃の低下でおよそ何％減少すると報告されているか？","choices":["約10%","約30%","約50%","約65%","約80%"],"correct":2,"expl":["約10%は減少幅として過小評価である。","約30%も実際の値より小さい。","（正解）Q10の法則があてはまり、体温が10℃低下するごとに代謝は低下し、10℃の低下で全身の酸素消費量は約50％減少すると報告されている。","約65%は過大評価である。","約80%はさらに過大評価であり、実際の値から大きく外れる。"]},{"stem":"全身麻酔下において、体温が37℃から20℃まで低下した場合、全身の酸素消費量は37℃の時の約何％まで低下するか？","choices":["約10%","約20%","約35%","約50%","約80%"],"correct":1,"expl":["約10%は低下幅として過大評価である。","（正解）1℃の低下により酸素消費量は約5％低下するため、20℃では37℃の約20％（20〜30 mL/分/m²）にまで低下する。","約35%は実際よりやや高めの値である。","約50%はQ10の法則における10℃低下時の値に近く、37℃から20℃までの低下量としては過大評価である。","約80%は低下幅として過小評価であり、実際の値より高すぎる。"]},{"stem":"全身麻酔下において、体温が37℃から25℃まで低下した場合、全身の酸素消費量は37℃の時の約何％まで低下すると考えられるか？","choices":["約10%","約20%","約40%","約60%","約80%"],"correct":2,"expl":["約10%は低下幅として過大評価である。","約20%は37℃から20℃まで低下した場合に近い値であり、25℃までの低下量としては過大評価である。","（正解）1℃の低下により酸素消費量は約5％低下するとされ、37℃から25℃（12℃の低下）では、37℃時の約40％程度にまで低下すると考えられる。","約60%は低下幅として過小評価である。","約80%はさらに低下幅として過小評価であり、実際の値より高すぎる。"]},{"stem":"低体温が血液の「酸素解離曲線」に及ぼす影響として正しいものはどれか？","choices":["右方移動し、組織に酸素を放出しやすくなる","左方移動し、組織に酸素を放出しにくくなる","変化しない","直線的なグラフに変化する","曲線の傾きが急峻になるだけで、左右には移動しない"],"correct":1,"expl":["低体温では酸素解離曲線は右方移動ではなく左方移動する。","（正解）低体温により酸素解離曲線は左方移動し、ヘモグロビンから酸素が放出されにくくなる。","低体温は酸素解離曲線に明確な影響を及ぼすため、「変化しない」という記述は誤りである。","酸素解離曲線はS字状の形を保ったままシフトするのであり、直線的なグラフに変化するわけではない。","低体温による変化は曲線の傾きのみでなく、左方への移動として生じる。"]},{"stem":"低体温による酸素運搬能の低下を補填するように働く、血液の物理的な変化はどれか？","choices":["血液粘度の低下","血中溶存酸素（物理的溶解度）の増加","赤血球の膨化","2,3-DPGの急増","ヘモグロビン濃度の上昇"],"correct":1,"expl":["低体温ではむしろ血液粘度は上昇するため、この記述は誤りである。","（正解）低温では血中の酸素溶解度が増加するため（38℃で0.3 vol%に対し20℃で2.0 vol%など）、これがヘモグロビンによる酸素運搬能の低下を補填する。","赤血球の膨化は低体温による酸素運搬能低下を補う変化として一般的に説明されるものではない。","2,3-DPGは低体温下ではむしろ減少する傾向があり、急増するわけではない。","ヘモグロビン濃度の上昇は血液希釈を行う体外循環中には通常起こらない変化であり、低体温そのものによる代償機序でもない。"]},{"stem":"温度変化と酸塩基平衡の関係について、一般に体温が1℃低下すると実際のpHはどのように変化するか？","choices":["約0.015低下する","約0.015上昇する","約0.1低下する","約0.1上昇する","変化しない"],"correct":1,"expl":["体温低下によりpHは低下するのではなく上昇する方向に変化する。","（正解）温度の低下に伴いPaCO2は低下し、pHは上昇（1℃低下につきpH約0.0147上昇）してアルカローシスを呈する。","0.1という変化幅は実際の変化量より大きすぎる。","pHは上昇するが、0.1という変化幅は実際より大きすぎる。","体温変化はpHに明確な影響を及ぼすため、「変化しない」という記述は誤りである。"]},{"stem":"低体温中の酸塩基平衡管理において、二酸化炭素を付加してその温度での実測pHを7.4に保つことで、脳血管を拡張させ脳血流を増加させる管理法はどれか？","choices":["アルファ・スタット法","pHスタット法","アシドーシス法","緩衝塩法","代謝性アルカローシス法"],"correct":1,"expl":["アルファ・スタット法は37℃換算値でpH7.4を維持する管理法であり、二酸化炭素を積極的に付加して脳血流を増加させる方法ではない。","（正解）pHスタット法はCO2付加により脳血流を増加させるため、効果的に脳冷却を行え、逆行性脳灌流においても血流を増加させる利点がある。","アシドーシス法という名称の標準的な酸塩基平衡管理法は存在しない。","緩衝塩法という名称の標準的な酸塩基平衡管理法は存在しない。","代謝性アルカローシス法という名称の標準的な酸塩基平衡管理法は存在しない。"]},{"stem":"脳血流の「autoregulation（自動調節能）」や細胞内酵素活性が良好に保たれる、現在の成人の人工心肺で一般的な酸塩基平衡管理法はどれか？","choices":["アルファ・スタット法","pHスタット法","恒温動物法","ベータ・スタット法","緩衝塩法"],"correct":0,"expl":["（正解）アルファ・スタット法は37℃換算値でpH7.4に維持する管理法で、脳血流と代謝のカップリングが良好に保たれ、autoregulationも維持されやすい。","pHスタット法はCO2を積極的に付加するため脳血流のautoregulationが障害されやすく、成人では一般的にアルファ・スタット法が用いられる。","恒温動物法という名称の標準的な酸塩基平衡管理法は存在しない。","ベータ・スタット法という名称の標準的な酸塩基平衡管理法は存在しない。","緩衝塩法という名称の標準的な酸塩基平衡管理法は存在しない。"]},{"stem":"非麻酔下において、生体が低体温に対して筋肉の震え（shivering）を起こし始めるのはおよそ何度か？","choices":["36℃","33℃","28℃","25℃","20℃"],"correct":1,"expl":["36℃ではまだシバリングは通常生じない。","（正解）非麻酔下では33℃に低下するとシバリングが発生するが、筋弛緩剤を用いた全身麻酔下では発生しない。","28℃はすでにシバリングが発生する温度域を下回っており、この温度になる前にシバリングが始まっている。","25℃も同様に、シバリング発生温度としては低すぎる。","20℃はさらに低く、シバリング発生の目安としては不適切である。"]},{"stem":"低体温の進行に伴う中枢神経系の変化として、脳波が平坦化（消失）を来すのはおよそ鼻咽頭温が何度前後の時か？","choices":["30℃","25℃","20℃","15℃","10℃"],"correct":2,"expl":["30℃ではまだ脳波の平坦化は通常認められない。","25℃でも脳波の平坦化を来す症例は多くない。","（正解）脳波の平坦化には個人差があるが、鼻咽頭温20℃前後で平坦化を来す症例が多いとされている。","15℃はすでに脳波が平坦化した後の温度域である。","10℃はさらに低く、脳波平坦化の目安としては低すぎる。"]},{"stem":"超低体温下での凝固・線溶系の変化として、正しい記述はどれか？","choices":["ACTは延長するが、ヘパリン量を正確に反映しなくなる","ACTは極端に短縮する","血小板の機能は常温時より亢進する","凝固因子の消費は完全にストップする","フィブリノゲン濃度が上昇する"],"correct":0,"expl":["（正解）超低体温ではACTの延長がヘパリン量を正確に反映しないことが知られており、適正量のヘパリン使用が術後の出血量を低下させると報告されている。","超低体温ではACTはむしろ延長する方向に変化し、極端に短縮することはない。","低体温下では血小板の機能はむしろ低下する傾向があり、常温時より亢進することはない。","凝固因子の消費が完全にストップするわけではなく、低体温下でも凝固系の反応は（緩徐にではあるが）進行し得る。","フィブリノゲン濃度が超低体温下で特異的に上昇するという記述は正しくない。"]},{"stem":"一般に、15〜18℃における超低体温循環停止法の安全限界時間（脳虚血許容時間）はどのくらいと報告されているか？","choices":["5分未満","10〜15分","30〜45分","60〜90分","120分以上"],"correct":2,"expl":["5分未満は安全限界時間として短すぎる見積もりである。","10〜15分も実際に報告されている安全限界時間より短い。","（正解）安全限界は30〜45分と報告されているが、QOLスコアの観点からは20分以上ですでに低下がみられるため、各種脳保護法の併用が重要である。","60〜90分は安全限界時間として長すぎる見積もりである。","120分以上はさらに大幅に長すぎる見積もりである。"]},{"stem":"逆行性脳灌流法（RCP）において、酸素化血を送血する経路はどれか？","choices":["下大静脈","上大静脈","肺動脈","冠静脈洞","大腿静脈"],"correct":1,"expl":["下大静脈はRCPにおける酸素化血の送血経路として用いられない。","（正解）RCPは、低体温循環停止下に酸素化血を静脈側（上大静脈）より逆行性に送血して脳灌流を行う方法である。","肺動脈はRCPの送血経路ではない。","冠静脈洞は心筋保護液の逆行性投与経路であり、RCPの送血経路ではない。","大腿静脈はRCPにおける酸素化血の直接的な送血経路として用いられない。"]},{"stem":"逆行性脳灌流法（RCP）を行う際、

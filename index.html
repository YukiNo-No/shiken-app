脳浮腫（過灌流）を防ぐために内頸静脈圧は最大でも何mmHg以下に保つよう推奨されているか？","choices":["10 mmHg以下","25 mmHg以下","50 mmHg以下","80 mmHg以下","100 mmHg以下"],"correct":1,"expl":["10 mmHg以下は基準としては厳しすぎる値である。","（正解）RCPの灌流量は個体差が大きい（200〜400mL/分）が、過灌流による脳浮腫を防ぐため内頸静脈圧を25mmHg以下に保つように管理する。","50 mmHg以下では脳浮腫予防の基準としては高すぎる。","80 mmHg以下はさらに高く、脳浮腫のリスクが高まる。","100 mmHg以下は明らかに高すぎる基準である。"]},{"stem":"選択的脳灌流法（SCP）において、至適とされる灌流圧（カニューレ先端圧）の目安はどれか？","choices":["10〜20 mmHg","30〜50 mmHg","60〜80 mmHg","100〜120 mmHg","150〜200 mmHg"],"correct":1,"expl":["10〜20 mmHgは灌流圧としては低すぎる値である。","（正解）25〜28℃の灌流温において、灌流圧（先端圧）は30〜50mmHgが一般的であり、高すぎる場合は血管拡張剤などで調節する。","60〜80 mmHgは目安として高すぎる値である。","100〜120 mmHgはさらに高く、脳過灌流のリスクが高まる。","150〜200 mmHgは明らかに高すぎる基準である。"]},{"stem":"選択的脳灌流法（SCP）において、至適とされる灌流量の目安はどれか？","choices":["1〜3 mL/分/kg","10〜15 mL/分/kg","30〜50 mL/分/kg","100 mL/分/kg以上","200 mL/分/kg以上"],"correct":1,"expl":["1〜3 mL/分/kgは灌流量としては少なすぎる値である。","（正解）SCP中の灌流量は10〜15 mL/分/kgとする施設が多く、メイン送血とは別個のポンプで調節する。","30〜50 mL/分/kgは目安として多すぎる値である。","100 mL/分/kg以上はさらに過大であり、脳過灌流のリスクが高い。","200 mL/分/kg以上は明らかに過大な値である。"]},{"stem":"選択的脳灌流法（SCP）で腕頭動脈へカニューレを挿入する際、深く挿入しすぎると適切に灌流されなくなる可能性がある分岐血管はどれか？","choices":["左総頸動脈","右鎖骨下動脈 および 右総頸動脈","左鎖骨下動脈","内胸動脈","椎骨動脈"],"correct":1,"expl":["左総頸動脈は腕頭動脈とは別に直接カニューレが挿入される血管であり、腕頭動脈への深すぎる挿入で問題となる分岐血管ではない。","（正解）腕頭動脈へのカニューレを深く挿入しすぎると、右鎖骨下動脈と右総頸動脈の分岐に先端が当たり、右脳への灌流が不適切になる恐れがある。","左鎖骨下動脈は腕頭動脈の分岐血管ではなく、この文脈での問題とは直接関係しない。","内胸動脈は腕頭動脈からの直接の主要分岐として問題となる血管ではない。","椎骨動脈も腕頭動脈カニューレの深すぎる挿入によって問題となる分岐血管として一般的に説明されるものではない。"]},{"stem":"脳分離体外循環中、非侵襲的に左右の脳組織の酸素化（脳内局所酸素飽和度）をモニタリングする機器において、治療介入の目安となる異常値はどれか？","choices":["80%以下、またはベースラインから5%の低下","60%以下、またはベースラインから10%の低下","40%以下、またはベースラインから20%の低下","20%以下、またはベースラインから50%の低下","10%以下、またはベースラインから70%の低下"],"correct":2,"expl":["80%以下、またはベースラインから5%の低下は基準として厳しすぎ、頻繁に介入を要することになってしまう。","60%以下、またはベースラインから10%の低下も基準として厳しすぎる。","（正解）rSO2のモニタリング（INVOSやNIROなど）において、40%以下となった時、またはベースラインから20%以上低下した時は灌流異常を疑い、何らかの治療介入を行う目安となる。","20%以下、またはベースラインから50%の低下は基準として緩すぎ、介入が遅れる危険がある。","10%以下、またはベースラインから70%の低下はさらに基準として緩すぎる。"]},{"stem":"低体温循環停止下で選択的脳灌流法（SCP）を灌流温25℃前後で行う場合、至適とされる灌流圧（カニューレ先端圧）と灌流量の組み合わせとして正しいのはどれか？","choices":["灌流圧10〜20 mmHg・灌流量1〜3 mL/分/kg","灌流圧30〜50 mmHg・灌流量10〜15 mL/分/kg","灌流圧60〜80 mmHg・灌流量30〜50 mL/分/kg","灌流圧100〜120 mmHg・灌流量100 mL/分/kg以上","灌流圧30〜50 mmHg・灌流量30〜50 mL/分/kg"],"correct":1,"expl":["灌流圧・灌流量とも、SCPの至適範囲としては低すぎる組み合わせである。","（正解）25〜28℃前後の灌流温でSCPを行う場合、灌流圧（先端圧）は30〜50 mmHg、灌流量は10〜15 mL/分/kgとする施設が多い。","灌流圧・灌流量とも、SCPの至適範囲としては高すぎる組み合わせである。","灌流圧・灌流量とも、SCPの至適範囲を大きく超える過大な組み合わせである。","灌流圧は至適範囲内だが、灌流量が30〜50 mL/分/kgでは過大であり、正しい組み合わせではない。"]},{"stem":"低体温体外循環における酸塩基平衡の管理法について、正しい記述の組み合わせはどれか。\na　pHスタット法は、その温度における実測pHを7.4に保つよう二酸化炭素を積極的に加える方法である。\nb　アルファ・スタット法は、37℃換算値でpH7.4を維持する管理法である。\nc　pHスタット法は、脳血流のautoregulationを良好に保つのに優れた方法である。\nd　アルファ・スタット法は、脳血流を増加させることで脳の急速な冷却に適した方法である。\ne　pHスタット法では、二酸化炭素の付加により脳血管が収縮し、脳血流が減少する。","choices":["a, b","a, e","b, c","c, d","d, e"],"correct":0,"expl":["（正解）aは正しい（pHスタット法はその温度における実測pHを7.4に保つよう積極的に二酸化炭素を加える方法である）。bも正しい（アルファ・スタット法は37℃換算値でpH7.4を維持する管理法である）。両者とも正しい記述であり、この組み合わせが正解となる。","aとeの組み合わせ。aは正しいが、eは誤り（pHスタット法での二酸化炭素付加はむしろ脳血管を拡張させ、脳血流を増加させる）であるため、この組み合わせは不適切。","bとcの組み合わせ。cは誤り（脳血流のautoregulationが良好に保たれるのはアルファ・スタット法であり、pHスタット法ではない）であるため、この組み合わせは不適切。","cとdの組み合わせ。いずれも誤り（cは前述の通り誤り、dも誤り〈脳血流を増加させ急速冷却に適するのはpHスタット法である〉）であるため、この組み合わせは不適切。","dとeの組み合わせ。いずれも誤りであるため、この組み合わせは不適切。"]}]},{"title":"第8章：病態生理","code":"path","questions":[{"stem":"低灌流状態において、腎臓や腹部内臓、骨格筋の血流量が大きく減少する主な機序はどれか？","choices":["臓器自体の自己調節能（autoregulation）","交感神経を介する神経性調節","血液粘度の急激な上昇","局所代謝産物の蓄積","ホルモン性調節（レニン-アンジオテンシン系のみ）"],"correct":1,"expl":["臓器自体の自己調節能（autoregulation）は、脳や心臓など主要臓器の血流が維持される機序であり、腎臓・腹部内臓・骨格筋の血流減少の主な機序ではない。","（正解）脳や心臓が自己調節を行うのに対し、腹部臓器や骨格筋は交感神経を介する神経性調節を受けて血管が収縮し、血流が減少する。","血液粘度の急激な上昇は、低灌流時の臓器血流減少の主たる機序として一般的に説明されるものではない。","局所代謝産物の蓄積も血流調節に関与し得るが、低灌流時の腹部臓器・骨格筋の血流減少の主たる機序としては神経性調節が中心である。","レニン-アンジオテンシン系は腎血流量の調節に関与するが、腹部内臓・骨格筋全般の血流減少の主たる機序として単独で説明されるものではない。"]},{"stem":"脳血流の血管抵抗を変化させる因子について、正しい記述はどれか？","choices":["動脈血PCO2の低下は脳血管を拡張させる","動脈血PCO2の低下は脳血管を収縮させる","動脈血PCO2の上昇は脳血管を収縮させる","動脈血PCO2は脳血管の抵抗に影響しない","PaO2の変動が脳血管抵抗を変化させる唯一の因子である"],"correct":1,"expl":["動脈血PCO2の低下は脳血管を拡張ではなく収縮させる。","（正解）動脈血PCO2の低下は脳血管を収縮させ、逆にPCO2の増加は脳血管を弛緩させる。","動脈血PCO2の上昇は脳血管を収縮ではなく弛緩（拡張）させる。","動脈血PCO2は脳血管の抵抗を変化させる代表的な因子であり、影響しないという記述は誤りである。","PaO2も脳循環に影響を与えるが、脳血管抵抗を変化させる「唯一の」因子ではなく、PaCO2の影響がより鋭敏かつ重要である。"]},{"stem":"人工心肺における腎血流への影響として、正しい記述はどれか？","choices":["低体温も血液希釈も腎血流を増加させる","低体温も血液希釈も腎血流を減少させる","低体温は血流を減少させるが、血液希釈は血流を増加させる（互いに相殺する）","人工心肺は腎血流に全く影響を与えない","血液希釈のみが腎血流に影響を与える"],"correct":2,"expl":["低体温は腎血流を増加させるのではなく減少させる方向に働く。","血液希釈は腎血流を減少させるのではなく増加させる方向に働くため、この記述は誤りである。","（正解）低体温は糸球体輸入脚の血管収縮を引き起こし血流を低下させるが、血液希釈は血液粘性を下げて尿量を増加させるため、両者が相殺し合って腎循環は比較的保たれる。","人工心肺中は低体温や血液希釈などにより腎血流は影響を受けるため、「全く影響を与えない」という記述は誤りである。","低体温も腎血流に影響を与えるため、「血液希釈のみ」という記述は誤りである。"]},{"stem":"人工心肺中の血液成分への機械的損傷（溶血）によって生じる変化はどれか？","choices":["ハプトグロビンの増加","ハプトグロビンの減少","フィブリノゲンの著明な増加","プラスミノーゲンの減少","ビリルビンの著明な低下"],"correct":1,"expl":["溶血によりハプトグロビンは増加ではなく減少する。","（正解）赤血球の溶血により生じた遊離ヘモグロビンを処理するため、血中ハプトグロビン値は時間経過とともに減少する。","フィブリノゲンが溶血に伴って著明に増加するという記述は正しくない。","プラスミノーゲンの減少は溶血の直接的な指標として一般的に説明されるものではない。","溶血が生じるとヘモグロビン代謝産物によりビリルビンはむしろ上昇し得るため、著明に低下するという記述は誤りである。"]},{"stem":"人工心肺中、血小板数はどの程度減少すると報告されているか？","choices":["変化しない","10〜20%減少する","30〜50%減少する","80〜90%減少する","ほぼ100%消失する"],"correct":2,"expl":["人工心肺中は血小板数が変化しないわけではなく、明らかな減少が認められる。","10〜20%減少では実際の減少幅より小さい。","（正解）人工心肺時、血小板は肝臓や脾臓への集積、異物面との接触などにより30〜50%減少する。","80〜90%減少は過大評価であり、実際の減少幅を大きく上回る。","ほぼ100%消失するというのは明らかな過大評価であり、実際にはそこまで消失しない。"]},{"stem":"人工心肺中、血小板の活性化に伴い血小板内部から放出され、ヘパリン使用下でも著明な上昇を示す血液マーカーはどれか？","choices":["アンチトロンビンIII","βトロンボグロブリンおよび血小板第4因子","フィブリノゲン","プラスミノーゲン","ハプトグロビン"],"correct":1,"expl":["アンチトロンビンIIIはヘパリンと結合して作用する抗凝固因子であり、血小板の脱顆粒によって放出されるマーカーではない。","（正解）血小板の活性化に伴いトロンボキサンA2の産生やセロトニン、ADP、血小板第4因子などの血小板内部物質の放出反応が起こる。血小板の脱顆粒現象の血液マーカーであるβトロンボグロブリン、血小板第4因子は、ヘパリン使用下にかかわらず人工心肺時に著明な上昇を示す（血小板膜傷害の指標であるGPIbフラグメント〈グリコカリシン〉も上昇する）。","フィブリノゲンは凝固カスケードの基質であり、血小板の脱顆粒マーカーとして用いられるものではない。","プラスミノーゲンは線溶系の因子であり、血小板活性化マーカーではない。","ハプトグロビンは溶血の指標であり、血小板活性化のマーカーではない。"]},{"stem":"人工心肺中の血小板数の変動と逆相関の関係を示すとされる、血小板産生を促進するホルモンはどれか？","choices":["エリスロポエチン","トロンボポエチン","G-CSF","アルドステロン","レニン"],"correct":1,"expl":["エリスロポエチンは赤血球産生を促進するホルモンであり、血小板産生には直接関与しない。","（正解）血小板産生因子であるトロンボポエチン濃度は、人工心肺中の血小板数と逆相関の変動を示す。","G-CSFは顆粒球（白血球）の産生・動員を促進するサイトカインであり、血小板産生を促進するホルモンではない。","アルドステロンは電解質・水分調節に関わるホルモンであり、血小板産生とは直接関係しない。","レニンは血圧調節に関わる酵素であり、血小板産生とは直接関係しない。"]},{"stem":"人工心肺における白血球数の変動として正しいものはどれか？","choices":["開始直後から一貫して減少し続ける","変化しない","リンパ球を主体として著明に増加する","開始直後に一過性に減少した後、好中球を主体として増加する","好酸球を主体として増加する"],"correct":3,"expl":["白血球数は開始直後から一貫して減少し続けるわけではなく、その後増加に転じる。","白血球数は人工心肺中に明らかな変動を示すため、「変化しない」という記述は誤りである。","増加するのはリンパ球ではなく好中球を主体とした増加である。","（正解）開始直後は異物面との接触で減少するが、その後は骨髄などからの動員により幼若な白血球（主に好中球）が増加する。","増加の主体は好酸球ではなく好中球である。"]},{"stem":"人工心肺中に著明な上昇を示し、末梢の白血球プールからの動員および骨髄における顆粒球産生の増加に関与するサイトカインはどれか？","choices":["IL-6","IL-10","G-CSF（顆粒球コロニー刺激因子）","TGF-β","エリスロポエチン"],"correct":2,"expl":["IL-6は急性炎症の指標となる代表的なサイトカインであるが、顆粒球コロニー刺激因子としての作用を持つものではない。","IL-10は抗炎症性サイトカインであり、顆粒球産生を促進する作用は持たない。","（正解）人工心肺時にはG-CSF（顆粒球コロニー刺激因子）が著明な上昇を示し、末梢の白血球プールからの動員および骨髄での骨髄球産生の増加に関与する。","TGF-βは免疫抑制的・線維化促進的に働くサイトカインであり、顆粒球産生を促進するものではない。","エリスロポエチンは赤血球産生を促進するホルモンであり、顆粒球産生とは直接関係しない。"]},{"stem":"血液が人工心肺回路の内面（非内皮組織）と接触することで直接活性化される凝固の経路はどれか？","choices":["第VII因子から始まる外因系","第XII因子から始まる内因系（接触相）","第II因子（トロンビン）の直接活性化","第I因子（フィブリノゲン）の直接活性化","プロテインCの活性化"],"correct":1,"expl":["第VII因子から始まる外因系は、主に組織因子の露出によって活性化される経路であり、回路内面との接触による直接活性化経路ではない。","（正解）血液異物面反応により、第XII因子から始まる血液凝固の接触相が活性化され、内因系凝固カスケードが亢進する。","第II因子（トロンビン）は凝固カスケードの下流で生成されるものであり、回路接触によって直接活性化される最初の因子ではない。","第I因子（フィブリノゲン）はトロンビンによってフィブリンへ変換される基質であり、回路接触によって直接活性化される因子ではない。","プロテインCは抗凝固系の因子であり、回路内面接触によって直接活性化される凝固経路とは異なる。"]},{"stem":"凝固接触相が活性化されることで産生され、強い血管拡張作用と血管透過性亢進作用（浮腫の原因）をもたらす物質はどれか？","choices":["エンドトキシン","ブラディキニン","セロトニン","トロンボキサンA2","ヒスタミン"],"correct":1,"expl":["エンドトキシンは細菌の細胞膜構成成分であり、主に腸管由来で炎症反応を引き起こすが、凝固接触相の活性化によって直接産生される物質ではない。","（正解）第XII因子などの活性化によりカリクレインが生成され、高分子キニノーゲンからブラディキニンが遊離して強い血管拡張作用・血管透過性亢進作用（浮腫）を引き起こす。","セロトニンは主に血小板から放出される物質であり、凝固接触相の活性化産物として説明されるものではない。","トロンボキサンA2は血小板から産生され血管収縮・凝集促進的に働く物質であり、血管拡張作用をもたらすものではない。","ヒスタミンは主に肥満細胞から放出される物質であり、凝固接触相の活性化による直接的な産生物として説明されるものではない。"]},{"stem":"人工心肺によって活性化される補体系のうち、アナフィラトキシンとして働き、好中球の活性化や血管透過性亢進に関与する成分はどれか？","choices":["C1q","C3a, C5a","C5b-9（MAC）","C4b","C2a"],"correct":1,"expl":["C1qは補体活性化の初期段階（古典経路）に関わる成分であり、アナフィラトキシンとして働くものではない。","（正解）C3aやC5aはアナフィラトキシンと呼ばれ、毛細血管透過性を上昇させ、好中球を活性化して炎症反応（SIRS）を助長する。","C5b-9（MAC：膜侵襲複合体）は細胞膜に孔を形成して細胞傷害をもたらす複合体であり、アナフィラトキシンではない。","C4bは補体活性化経路の中間産物であり、アナフィラトキシンとして働く成分ではない。","C2aは補体活性化経路の産物の一つであるが、C3aやC5aのような代表的なアナフィラトキシンとして扱われるものではない。"]},{"stem":"人工心肺中における血中カリウム値の変動とその主な原因として正しいものはどれか？","choices":["尿中排泄の停止による高カリウム血症","細胞外から細胞内への移動（シフト）による低カリウム血症","細胞内から細胞外への移動による高カリウム血症","赤血球内への取り込みによる低カリウム血症","アルドステロン分泌亢進による高カリウム血症"],"correct":1,"expl":["尿中排泄の停止による高カリウム血症という記述は、人工心肺中の一般的なカリウム変動の説明としては正しくない。","（正解）低体温、アルカローシス、インスリンの作用などにより、カリウムが細胞外から細胞内へ移動（細胞内シフト）するため、一般に低カリウム血症を呈する。","細胞内から細胞外への移動による高カリウム血症は、人工心肺中に一般的にみられる変動とは逆の記述である。","赤血球内への取り込みは血中カリウム変動の主たる機序として一般的に説明されるものではない。","アルドステロン分泌亢進は一般的にナトリウム再吸収・カリウム排泄を促進するものであり、人工心肺中の血中カリウム変動の主な原因として説明されるものではない。"]},{"stem":"人工心肺中の「水分バランス」について、一般的に起こりやすい状態はどれか？","choices":["血管内腔の水分量が著明に増加する","血管外腔への水分移動が起こり、水分貯留（組織浮腫）が発生する","細胞内液が極端に減少して脱水となる","変化しない","尿量の著明な増加により脱水になる"],"correct":1,"expl":["血管内腔の水分量が著明に増加するのではなく、血管外への水分移動が問題となる。","（正解）静脈圧の上昇、膠質浸透圧の低下、血管透過性の亢進により、血管外腔への水分移動（サードスペースへの移行）が起こり、著明な水分貯留状態となる。","細胞内液が極端に減少して脱水となるという記述は、人工心肺中に一般的にみられる水分バランスの変化とは異なる。","人工心肺中は水分バランスに明らかな変化が生じるため、「変化しない」という記述は誤りである。","尿量の著明な増加によって脱水になるという記述は、一般的に起こりやすい病態としては説明されない。"]},{"stem":"心房性ナトリウム利尿ペプチド（ANP）の人工心肺中の変動として正しいのはどれか？","choices":["人工心肺開始とともに直ちに低下し、終了時まで低値を保つ","人工心肺時に上昇し、終了時に最高値を示す","人工心肺の影響を受けず一定に保たれる","人工心肺終了後、直ちに術前値まで回復する","アルドステロン分泌を促進し、循環血液量を増加させる"],"correct":1,"expl":["ANPは低下し続けるのではなく、人工心肺時に上昇する。","（正解）ANPは心房圧の上昇に伴い分泌が促進されるホルモンであり、人工心肺時に上昇し、終了時に最高値を示してナトリウム利尿に関与する。","ANPは人工心肺の影響を明らかに受けて変動するため、「一定に保たれる」という記述は誤りである。","ANPは終了時に最高値を示した後、緩徐に低下していくものであり、直ちに術前値まで回復するわけではない。","ANPはナトリウム利尿によりむしろ循環血液量を減少させる方向に働き、アルドステロン分泌を促進する作用は持たない。"]},{"stem":"人工心肺中の糖代謝について正しい記述はどれか？","choices":["インスリン分泌が亢進し、低血糖になる","グルカゴン分泌が低下し、低血糖になる","インスリン分泌が低下（不十分）し、高血糖になる","糖代謝は正常に保たれる","インスリン抵抗性が低下し、低血糖になる"],"correct":2,"expl":["人工心肺中はインスリン分泌が亢進するのではなく低下するため、この記述は誤りである。","グルカゴン分泌の低下による低血糖という記述は、人工心肺中に一般的にみられる糖代謝の変化とは異なる。","（正解）低体温やアドレナリンの増加によりインスリン分泌が抑制されるため、血糖値は異常に上昇（高血糖）する。","人工心肺中は糖代謝に明らかな変化（高血糖傾向）が生じるため、「正常に保たれる」という記述は誤りである。","人工心肺中はインスリン抵抗性が上昇する方向に働くとされ、低下して低血糖になるという記述は誤りである。"]},{"stem":"人工心肺時に著明に上昇し、インスリン分泌を抑制するとともにグリコーゲン分解を促進して血糖値上昇を助長するホルモンはどれか？","choices":["インスリン","アドレナリン（エピネフリン）","アルドステロン","ANP（心房性ナトリウム利尿ペプチド）","TSH（甲状腺刺激ホルモン）"],"correct":1,"expl":["インスリンは人工心肺時にむしろ分泌が抑制されるホルモンであり、血糖上昇を助長する側の物質ではない。","（正解）人工心肺時に著明に上昇するアドレナリン（エピネフリン）はインスリン分泌を抑制するとともに、グリコーゲン分解を促進し、血糖値の上昇を助長する。","アルドステロンは電解質・水分調節に関わるホルモンであり、血糖値上昇を助長する主たる機序として説明されるものではない。","ANPはナトリウム利尿に関わるホルモンであり、血糖値の上昇を助長するものではない。","TSHは甲状腺ホルモン分泌を調節するホルモンであり、血糖値上昇を直接助長するものではない。"]},{"stem":"人工心肺中の副腎皮質ホルモンの変動について、正しい記述はどれか？","choices":["血中コルチゾール値は人工心肺開始時の血液希釈により一旦低下するが、その後人工心肺時に上昇を示す","血中ACTH値の上昇に伴いコルチゾール分泌が促進される","コルチゾールは人工心肺中を通じて低下し続ける","コルチゾールの変動は一般外科手術と比較して軽微である","アルドステロンは人工心肺時に著明に変動し、終了直後に最低値を示す"],"correct":0,"expl":["（正解）血中コルチゾール値は人工心肺開始時の血液希釈により一旦低下するが、その後人工心肺時に上昇を示し、離脱後にも上昇がみられる。","人工心肺ではピーク時の血中ACTH値はむしろ低く、ACTHによるコルチゾール分泌促進は認められない（ACTH非依存性の副腎皮質機能亢進）とされている。","コルチゾールは人工心肺開始時に一旦低下した後、上昇に転じるため、「低下し続ける」という記述は誤りである。","人工心肺ではコルチゾールの上昇は一般外科手術よりも著しいとされており、「軽微」という記述は誤りである。","血中アルドステロン値は人工心肺時の変動が少なく、術後に上昇するとされており、「著明に変動し終了直後に最低値」という記述は誤りである。"]},{"stem":"人工心肺後の高血圧の一因となるとされる、レニン-アンジオテンシン系の亢進によって増加する末梢血管収縮物質はどれか？","choices":["ANP（心房性ナトリウム利尿ペプチド）","アンジオテンシンII","アルドステロン","インスリン","ブラディキニン"],"correct":1,"expl":["ANPはむしろ血管拡張・ナトリウム利尿に働く物質であり、末梢血管を収縮させる物質ではない。","（正解）人工心肺時にはレニン-アンジオテンシン-アルドステロン系が賦活化され、アンジオテンシンIIの増加は末梢血管を収縮させ血管抵抗を上げるため、人工心肺後の高血圧の一因となる。","アルドステロンは電解質調節に関わるが、人工心肺時の変動は少なく、末梢血管収縮による昇圧因子としてはアンジオテンシンIIほど直接的ではない。","インスリンは糖代謝に関わるホルモンであり、末梢血管収縮に関与する物質ではない。","ブラディキニンはむしろ血管拡張作用を持つ物質であり、血管収縮物質ではない。"]},{"stem":"人工心肺中の甲状腺ホルモンの変動として正しいものはどれか？","choices":["T3、free T3ともに著明に減少する","T3が著明に増加する","T4が著明に減少する","TSHが著明に減少する","TSHが著明に増加する"],"correct":0,"expl":["（正解）人工心肺中はT3およびfree T3が著明に減少し、甲状腺機能低下の状態になる（free T4は増加することが多い）。","T3は増加ではなく著明に減少する。","T4（特にfree T4）はむしろ増加することが多く、著明に減少するという記述は正しくない。","TSHが著明に減少するという記述は、人工心肺中の甲状腺ホルモン変動として一般的に説明されるものではない。","TSHが著明に増加するという記述も、人工心肺中の甲状腺ホルモン変動として一般的に説明されるものではない。"]},{"stem":"人工心肺による免疫系の変動について、液性免疫（IgG, IgA, IgM, 補体C3, C4）はどう変化するか？","choices":["著明に増加する","人工心肺時に減少し、回復に約1週間かかる","人工心肺中は変化せず、術後に減少する","完全に消失し回復しない","術中のみ一過性に増加する"],"correct":1,"expl":["液性免疫は著明に増加するのではなく減少する方向に変動する。","（正解）血液の機械的障害やタンパク変性、自己免疫系の活性化による消費のため、免疫グロブリンや補体は減少し、回復には約1週間を要する。","人工心肺中から変化が生じるため、「人工心肺中は変化せず」という記述は正しくない。","液性免疫は約1週間で回復するとされ、「完全に消失し回復しない」という記述は誤りである。","術中に一過性に増加するという記述は、液性免疫の一般的な変動として説明されるものではない。"]},{"stem":"人工心肺時に急激な血中濃度の上昇を示し、急性炎症の指標となるサイトカインはどれか？","choices":["IL-10","IL-6","TGF-β","IL-4","IL-2"],"correct":1,"expl":["IL-10は抗炎症性サイトカインであり、急性炎症の指標として急激な上昇を示す代表的なサイトカインではない。","（正解）IL-6はBリンパ球やTリンパ球に作用して急性炎症をもたらすサイトカインで、人工心肺時に急激な上昇を示す。","TGF-βは主に免疫抑制的・線維化促進的に働くサイトカインであり、急性炎症の指標として説明されるものではない。","IL-4は主にTh2型免疫反応に関わるサイトカインであり、人工心肺時の急性炎症の代表的指標として説明されるものではない。","IL-2は主にT細胞増殖に関わるサイトカインであり、人工心肺時の急性炎症の代表的指標として説明されるものではない。"]},{"stem":"人工心肺中の抗凝固療法で使用される「ヘパリン」の主な作用機序はどれか？","choices":["カルシウムイオンのキレート（結合）","プラスミンの直接活性化","アンチトロンビンIIIの作用増強","第VII因子の直接阻害","血小板凝集を直接阻害する"],"correct":2,"expl":["カルシウムイオンのキレート（結合）はクエン酸などによる抗凝固作用の機序であり、ヘパリンの主な作用機序ではない。","プラスミンの直接活性化はヘパリンの主な作用機序ではなく、線溶系に関する別の機序である。","（正解）ヘパリンはアンチトロンビンIIIの作用を約1000倍に亢進させ、トロンビンや内因系凝固因子を強力に抑制する。","第VII因子の直接阻害は、ヘパリンの主な作用機序として一般的に説明されるものではない。","ヘパリンの主作用は凝固カスケードの阻害であり、血小板凝集を直接阻害する薬剤（抗血小板薬）とは作用機序が異なる。"]},{"stem":"ヘパリンの抗凝固作用はどのように発現するか。正しい記述はどれか。","choices":["ビタミンK依存性凝固因子の肝臓での産生を直接抑制する","アンチトロンビンIIIの作用を約1000倍に増強し、内因系凝固カスケードの第XII・XI・X・IX因子などを抑制する","血小板膜受容体に直接結合し、血小板凝集を阻害する","カルシウムイオンをキレートし、凝固反応の進行を防ぐ","プラスミノーゲンをプラスミンへ変換し、線溶を亢進させる"],"correct":1,"expl":["ビタミンK依存性凝固因子の産生抑制はワルファリンなどの経口抗凝固薬の機序であり、ヘパリンの作用機序ではない。","（正解）ヘパリンはアンチトロンビンIIIを介して作用する酸性ムコ多糖類であり、アンチトロンビンIIIの作用を約1000倍に亢進させ、serine protease inhibitorとして内因系凝固カスケードの第XII・XI・X・IX因子などを抑制する。","血小板膜受容体への直接結合による血小板凝集阻害は、ヘパリンの主たる作用機序として説明されるものではない。","カルシウムイオンのキレートはクエン酸などによる抗凝固作用の機序であり、ヘパリンの作用機序ではない。","プラスミノーゲンの活性化はヘパリンの作用機序ではなく、線溶系を促進する別の機序である。"]},{"stem":"ヘパリンの中和剤として投与されるプロタミンについて、正しい記述はどれか？","choices":["ヘパリンと2:1の比率で結合して中和する","ヘパリンと1:1の比率で結合し、抗凝固作用を中和する","アンチトロンビンIIIの産生を促進することでヘパリンを中和する","単独では抗凝固作用を全く持たない","ACTを測定せずに一律の投与量で問題ない"],"correct":1,"expl":["プロタミンとヘパリンの結合比率は2:1ではなく1:1である。","（正解）プロタミンはヘパリンと1:1で結合してヘパリンの抗凝固作用を中和するため、理論的にはヘパリンと等量のプロタミンを投与することになる。","プロタミンはアンチトロンビンIIIの産生を促進する薬剤ではなく、ヘパリンに直接結合して中和する。","過剰なプロタミン投与自体が弱い抗凝固作用を持つため、「単独では抗凝固作用を全く持たない」という記述は正しくない。","プロタミンは初回ヘパリン投与量と同量を目安としつつ、その後はACT値を参考に慎重に投与量を決定することが重要であり、ACTを測定せず一律投与でよいわけではない。"]},{"stem":"人工心肺中や術後に発生する一時的肺機能障害（postperfusion lung syndrome）の主たる原因はどれか？","choices":["肺血流の完全遮断による虚血性壊死","肺胞サーファクタントの過剰分泌","活性化された好中球や補体系による組織障害","左室の過伸展による物理的圧迫のみ","気管挿管チューブの位置異常"],"correct":2,"expl":["肺機能障害は虚血そのものよりも炎症反応が主体であり、「虚血性壊死」を主たる原因とする記述は正しくない。","肺胞サーファクタントの過剰分泌がpostperfusion lung syndromeの主たる原因として説明されるものではない。","（正解）肺機能障害は、虚血そのものよりも、人工心肺によって活性化された好中球や補体系が引き起こす炎症反応（SIRS）が主に引き起こす。","左室の過伸展による物理的圧迫のみが原因という記述は、postperfusion lung syndromeの主たる機序の説明としては不十分かつ不正確である。","気管挿管チューブの位置異常は換気に関わる別個の問題であり、postperfusion lung syndromeの主たる原因ではない。"]},{"stem":"人工心肺時に発生する「脳梗塞（脳合併症）」の主な原因として最も多いものはどれか？","choices":["灌流圧の低下（低血圧）","動脈硬化病変による塞栓症（粥腫の飛散など）","血液希釈による酸素運搬能低下","静脈圧の異常上昇","低体温による脳血管攣縮"],"correct":1,"expl":["灌流圧の低下（低灌流）による脳障害の発生頻度はわずかとされており、最も多い原因ではない。","（正解）脳梗塞の頻度は1〜5%とされるが、その多くは低灌流ではなく、大動脈の動脈硬化病変（プラーク）が送血によって飛散する塞栓症が原因である。","血液希釈による酸素運搬能低下は脳梗塞の主たる原因として一般的に説明されるものではない。","静脈圧の異常上昇は脳梗塞の主たる原因として一般的に説明されるものではない。","低体温による脳血管攣縮は脳梗塞の主たる原因として一般的に説明されるものではない。"]},{"stem":"腎循環のautoregulation（自己調節能）が保たれる下限値とされる灌流圧はどれか？","choices":["20〜30 mmHg","30〜40 mmHg","50〜60 mmHg","70〜80 mmHg","90〜100 mmHg"],"correct":2,"expl":["20〜30 mmHgは腎循環のautoregulation下限値としては低すぎる値である。","30〜40 mmHgも実際の下限値よりやや低い。","（正解）腎循環のautoregulationが保たれる下限値は灌流圧50〜60 mmHgとされており、適切な灌流圧が有効な腎血流量の維持に必要である。灌流圧の低下はレニン活性を高め、腎血流量を低下させるアンジオテンシンII値を上昇させるため、50 mmHg以下の低灌流圧にならないよう注意し、2.2L/分/m²以上の灌流指数を維持することが肝要である。","70〜80 mmHgは下限値としては高すぎる値である。","90〜100 mmHgはさらに高く、下限値の目安としては不適切である。"]},{"stem":"人工心肺中の内分泌・液性因子の変動について、正しい記述の組み合わせはどれか。\na　ANP（心房性ナトリウム利尿ペプチド）は、人工心肺の終了時に最高値を示す。\nb　アンジオテンシンIIの増加は末梢血管を収縮させ、人工心肺後の高血圧の一因となる。\nc　アルドステロンは人工心肺中に著明に変動し、終了直後に最低値を示す。\nd　コルチゾールはACTHの上昇に伴って分泌が促進される。\ne　アドレナリンの上昇はインスリン分泌を促進し、血糖値を低下させる。","choices":["a, b","a, e","b, c","c, d","d, e"],"correct":0,"expl":["（正解）aは正しい（ANPは人工心肺の終了時に最高値を示す）。bも正しい（アンジオテンシンIIの増加は末梢血管を収縮させ、人工心肺後の高血圧の一因となる）。両者とも正しい記述であり、この組み合わせが正解となる。","aとeの組み合わせ。aは正しいが、eは誤り（アドレナリンの上昇はインスリン分泌をむしろ抑制し、血糖値を上昇させる）であるため、この組み合わせは不適切。","bとcの組み合わせ。cは誤り（アルドステロンは人工心肺中の変動が少なく、術後に上昇する）であるため、この組み合わせは不適切。","cとdの組み合わせ。いずれも誤り（cは前述の通り誤り、dも誤り〈ピーク時のACTH値はむしろ低値であり、ACTH非依存性にコルチゾール分泌が亢進する〉）であるため、この組み合わせは不適切。","dとeの組み合わせ。いずれも誤りであるため、この組み合わせは不適切。"]}]},{"title":"第9章：心筋保護法","code":"cardio","questions":[{"stem":"心臓手術において、心筋保護法を用いない「単純常温阻血」の安全限界時間はおよそどれくらいとされているか？","choices":["10分未満","30分未満","60分未満","120分未満","180分未満"],"correct":1,"expl":["10分未満では安全限界時間として短すぎる見積もりである。","（正解）心臓は単位重量当たりの酸素消費が最も大きい臓器の一つであり、単純常温阻血の安全限界は30分未満とされている。","60分未満は安全限界時間として長すぎる見積もりである。","120分未満はさらに長すぎ、実際の安全限界を大幅に超える。","180分未満はさらに大幅に長すぎる見積もりである。"]},{"stem":"現在広く用いられている「低温化学的心筋保護法」の3原則の組み合わせとして正しいのはどれか？","choices":["化学的心停止・低温・付加的保護（特異な保護物質の添加）","化学的心停止・低温・高圧注入による冠動脈の拡張","化学的心停止・付加的保護・経静脈的投与","低温・付加的保護・高圧注入による冠動脈の拡張","化学的心停止・低温・経静脈的投与"],"correct":0,"expl":["（正解）低温化学的心筋保護法の3原則は、化学的心停止、低温、付加的保護（特異な保護物質の添加）である。","高圧注入による冠動脈の拡張は3原則に含まれない。高圧注入は心筋浮腫や血管損傷の原因となるため行わない。","経静脈的投与は心筋保護液の一般的な投与経路として用いられるものではなく、3原則にも含まれない。","高圧注入による冠動脈の拡張は3原則に含まれない。","経静脈的投与は3原則に含まれない。"]},{"stem":"高カリウム液などによる「化学的心停止」を得た場合、心筋の酸素消費量は拍動時の約何分の一まで減少するか？","choices":["約1/2","約1/5","約1/10","約1/50","約1/100"],"correct":2,"expl":["約1/2では減少幅として過小評価である。","約1/5も実際の減少幅より小さい。","（正解）化学的心停止により、心筋酸素消費量は正常拍動時の約1/10にまで著しく減少する。","約1/50は減少幅として過大評価である。","約1/100はさらに過大評価であり、実際の値から大きく外れる。"]},{"stem":"晶質液性心筋保護液のうち、細胞内液組成タイプの代表的な保護液はどれか？","choices":["St. Thomas 2号液","GIK液","Celsior液","乳酸リンゲル液","重炭酸リンゲル液"],"correct":1,"expl":["St. Thomas 2号液は細胞外液組成タイプの代表的な心筋保護液である。","（正解）細胞内液組成タイプの代表はGIK（Glucose-Insulin-Potassium）液である。","Celsior液は細胞外液組成タイプの心保存液（心臓移植用）として用いられる。","乳酸リンゲル液は細胞外液組成の輸液であり、心筋保護液の細胞内液組成タイプの代表例ではない。","重炭酸リンゲル液も細胞外液組成の輸液であり、細胞内液組成タイプの心筋保護液ではない。"]},{"stem":"現在、国内で唯一市販されている、細胞外液組成タイプの心筋保護液（St. Thomas 2号液）の商品名はどれか？","choices":["ミオテクター","ビスローク","アデール","ヘルベッサー","オノアクト"],"correct":0,"expl":["（正解）St. Thomas 2号液は「ミオテクター」として国内で唯一市販されている心筋保護液である。","ビスロークという商品名の心筋保護液は存在しない。","アデールという商品名の心筋保護液は存在しない。","ヘルベッサー（一般名：ジルチアゼム）はカルシウム拮抗薬であり、心筋保護液ではない。","オノアクト（一般名：ランジオロール）は短時間作用型β遮断薬であり、心筋保護液ではない。"]},{"stem":"GIK液とSt. Thomas 2号液（細胞外液組成）のカリウム（K+）濃度の組み合わせとして正しいのはどれか？","choices":["GIK液　約20 mEq/L　／　St. Thomas 2号液　約16 mEq/L","GIK液　約16 mEq/L　／　St. Thomas 2号液　約20 mEq/L","GIK液　約10 mEq/L　／　St. Thomas 2号液　約16 mEq/L","GIK液　約20 mEq/L　／　St. Thomas 2号液　約40 mEq/L","GIK液　約40 mEq/L　／　St. Thomas 2号液　約16 mEq/L"],"correct":0,"expl":["（正解）GIK液のK+濃度は約20 mEq/L、St. Thomas 2号液（ミオテクター）のK+濃度は約16 mEq/Lである。","GIK液とSt. Thomas 2号液のK+濃度の数値が入れ替わっており誤りである。","GIK液のK+濃度は約10 mEq/Lではなく約20 mEq/Lであり、値が低すぎる。","St. Thomas 2号液のK+濃度は約40 mEq/Lではなく約16 mEq/Lであり、値が高すぎる。","いずれの数値も実際の濃度より高すぎる。"]},{"stem":"心臓移植のドナー心保存などに用いられる細胞外液組成タイプの心保存液「Celsior液」のカリウム（K+）濃度に最も近いのはどれか？","choices":["約3 mM","約13 mM","約30 mM","約60 mM","約100 mM"],"correct":1,"expl":["約3 mMは実際の濃度より低すぎる。","（正解）Celsior液のK+濃度は約13 mMであり、細胞外液組成タイプに分類される。","約30 mMは実際の濃度より高すぎる。","約60 mMはCelsior液に含まれるマンニトール濃度に近い値であり、K+濃度としては高すぎる。","約100 mMはCelsior液に含まれるNaOH濃度に近い値であり、K+濃度としては高すぎる。"]},{"stem":"血液を混ぜて注入する「血液併用心筋保護法」の欠点（懸念点）として挙げられるものはどれか？","choices":["酸素運搬能の低下","膠質浸透圧の低下","緩衝能力の低下","低温下での赤血球のsludging（凝集・泥状化）","フィブリノゲンの著明な増加"],"correct":3,"expl":["血液併用心筋保護法はむしろ酸素運搬能に優れる点が利点であり、酸素運搬能の低下は欠点として説明されるものではない。","血液併用心筋保護法では血漿成分により膠質浸透圧が保たれやすく、これが利点の一つとされる。","血液併用心筋保護法は血液由来の緩衝能力が期待できる点も利点の一つであり、緩衝能力の低下は欠点として説明されるものではない。","（正解）血液併用心筋保護法は酸素供給や緩衝能などの利点が多い反面、低温下での赤血球のsludingや、白血球・血小板などによる不利益な要因が含まれることが短所である。","フィブリノゲンの著明な増加は血液併用心筋保護法の欠点として一般的に説明されるものではない。"]},{"stem":"冠動脈バイパス術などで用いられる、30℃前後の間欠的「微温血液心筋保護法」の名称はどれか？","choices":["Hot shot","Cold blood cardioplegia","Tepid blood cardioplegia","Microplegia","Initial warm blood induction"],"correct":2,"expl":["Hot shotは遮断解除直前に37℃の血液を注入する方法（terminal warm blood cardioplegia）の通称であり、30℃前後の間欠的方法ではない。","Cold blood cardioplegiaは冷温水槽を15℃程度に設定する冷たい血液心筋保護法であり、30℃前後の微温法ではない。","（正解）30℃前後の微温心筋保護法は「tepid blood cardioplegia」と呼ばれ、細胞のエネルギー産生が維持されるため心筋が柔らかくなり、吻合操作が容易になる利点がある。","Microplegiaは少量の心筋保護液を高濃度で持続注入する方式の名称であり、30℃前後の微温法を指す名称ではない。","Initial warm blood inductionは低温化学的心筋保護導入前に常温の血液で心停止を図る方法であり、30℃前後の間欠的方法とは異なる。"]},{"stem":"大動脈基部から心筋保護液を注入する「順行性心筋保護」が適さない病態はどれか？","choices":["大動脈弁狭窄症（AS）","大動脈弁閉鎖不全症（AR）","僧帽弁閉鎖不全症（MR）","心房中隔欠損症（ASD）","僧帽弁狭窄症（MS）"],"correct":1,"expl":["大動脈弁狭窄症（AS）は順行性心筋保護が適さない病態として一般的に説明されるものではない。","（正解）大動脈弁閉鎖不全（AR）がある場合、注入した保護液が左室内に漏れ落ちてしまい、冠動脈へ十分に灌流しないため順行性注入は不適当である。","僧帽弁閉鎖不全症（MR）は順行性心筋保護の適否に直接影響する病態として一般的に説明されるものではない。","心房中隔欠損症（ASD）も順行性心筋保護の適否に直接影響する病態として一般的に説明されるものではない。","僧帽弁狭窄症（MS）も順行性心筋保護の適否に直接影響する病態として一般的に説明されるものではない。"]},{"stem":"冠静脈洞から「逆行性心筋保護液」を注入する際、冠静脈の損傷を防ぐために注入圧（先端圧）は一般に何mmHg以下に保つべきか？","choices":["30 mmHg以下","50 mmHg以下","80 mmHg以下","120 mmHg以下","150 mmHg以下"],"correct":0,"expl":["（正解）注入圧が40mmHg以上になると冠静脈損傷や心筋出血・浮腫の危険があるため、逆行性注入では一般的には30mmHg以下に保つ。","50 mmHg以下では逆行性注入の基準としてはやや高すぎる。","80 mmHg以下は順行性注入時の目標圧に近い値であり、逆行性注入の基準としては高すぎる。","120 mmHg以下はさらに高く、冠静脈損傷のリスクが高まる。","150 mmHg以下は明らかに高すぎる基準である。"]},{"stem":"肥大のない成人の心臓において、心筋保護液の「初回注入量」の目安はどれか？","choices":["5 mL/kg","10 mL/kg","20 mL/kg","50 mL/kg","30 mL/kg"],"correct":2,"expl":["5 mL/kgは初回注入量としては少なすぎる。","10 mL/kgは2回目以降の追加注入量の目安に近く、初回注入量としては少ない。","（正解）成人の場合、初回は20mL/kg、2回目以降は10mL/kgを注入するのが一般的である。","50 mL/kgは初回注入量としては多すぎる。","30 mL/kgも初回注入量の目安としては多めであり、一般的な基準ではない。"]},{"stem":"心筋温を一定に保ち、代謝産物を洗い流すために推奨される心筋保護液の「追加注入間隔」はどれか？","choices":["5〜10分ごと","20〜30分ごと","45〜60分ごと","90分ごと","120分ごと"],"correct":1,"expl":["5〜10分ごとは追加注入の間隔としては頻回すぎる。","（正解）心筋保護液は20〜30分ごとに反復注入することが基本とされている。","45〜60分ごとでは間隔が空きすぎ、心筋保護効果が不十分になる恐れがある。","90分ごとはさらに間隔が長すぎる。","120分ごとも同様に間隔が長すぎ、心筋保護の観点から不適切である。"]},{"stem":"通常の冠動脈バイパス術や心筋肥大のない弁膜症手術における、順行性注入時の「大動脈基部圧」の目標値はどれか？","choices":["30〜50 mmHg","80〜100 mmHg","120〜150 mmHg","150〜200 mmHg","200〜250 mmHg"],"correct":1,"expl":["30〜50 mmHgは目標値としては低すぎ、心筋保護液が不均一に分布しやすくなる。","（正解）大動脈基部圧が80〜100mmHg程度であることが望ましく、低すぎると不均一な分布になり、150mmHg以上になると大動脈解離や心筋浮腫の危険が増す。","120〜150 mmHgは目標値としては高すぎる範囲である。","150〜200 mmHgはさらに高く、大動脈解離のリスクが高まる。","200〜250 mmHgは明らかに高すぎる基準である。"]},{"stem":"大動脈遮断解除の直前に、心機能の回復を促す目的で37℃に加温した血液心筋保護液を注入する方法を何と呼ぶか？","choices":["Tepid blood cardioplegia","Terminal warm blood cardioplegia (Hot shot)","Initial warm blood induction","Microplegia","Cold blood cardioplegia"],"correct":1,"expl":["Tepid blood cardioplegiaは30℃前後の間欠的微温心筋保護法であり、遮断解除直前の37℃加温注入とは異なる。","（正解）遮断解除直前に37℃に加温した血液を注入する方法をterminal warm blood cardioplegia（hot shot）と呼び、心機能の回復に有用である。","Initial warm blood inductionは低温化学的心筋保護導入前に常温の血液で心停止を図る方法であり、遮断解除直前の加温注入とは時期・目的が異なる。","Microplegiaは少量の心筋保護液を高濃度で持続注入する方式であり、遮断解除直前の37℃加温注入を指す名称ではない。","Cold blood cardioplegiaは冷温水槽を15℃程度に設定する冷たい血液心筋保護法であり、37℃の加温注入とは正反対の方法である。"]},{"stem":"大動脈遮断解除後、虚血再灌流傷害を避ける目的で、解除後15分間は投与を行わないよう推奨されている薬剤（電解質）はどれか？","choices":["カリウム製剤","マグネシウム製剤","カルシウム製剤","重炭酸ナトリウム","ブドウ糖液"],"correct":2,"expl":["カリウム製剤の投与を15分間避けるという推奨は、虚血再灌流傷害予防の文脈で一般的に説明されるものではない。","マグネシウム製剤についても同様に、解除後15分間投与を避けるべき薬剤として一般的に説明されるものではない。","（正解）高カルシウムによる再灌流傷害（カルシウム・パラドックス）を避けるため、遮断解除後15分間はカルシウム製剤の投与を行わない。","重炭酸ナトリウムの投与を15分間避けるという推奨は、この文脈で一般的に説明されるものではない。","ブドウ糖液の投与を15分間避けるという推奨も、この文脈で一般的に説明されるものではない。"]},{"stem":"未熟心筋（新生児の心筋）のエネルギー代謝において、成熟心筋よりも依存している割合が高いものはどれか？","choices":["脂肪酸の酸化","嫌気的糖代謝","ケトン体代謝","タンパク質分解","アミノ酸代謝"],"correct":1,"expl":["脂肪酸の酸化はむしろ成熟心筋が主に依存するエネルギー代謝経路である。","（正解）成熟心筋は脂肪酸の酸化に依存するが、未熟心筋は糖代謝により依存し、嫌気的糖代謝系酵素の活性が高いのが特徴である。","ケトン体代謝は未熟心筋が成熟心筋より依存する割合が高いエネルギー代謝として一般的に説明されるものではない。","タンパク質分解はエネルギー代謝の主要経路として未熟心筋で優位に用いられるものではない。","アミノ酸代謝も未熟心筋が成熟心筋より依存する割合が高いエネルギー代謝として一般的に説明されるものではない。"]},{"stem":"未熟心筋の特徴として正しい記述はどれか？","choices":["活性酸素消去系（SODなど）が発達している","筋小胞体が発達している","交感神経優位である","細胞が小さく紡錘状である","収縮蛋白の発現量が成人より多い"],"correct":3,"expl":["未熟心筋では活性酸素消去系（SODなど）はむしろ未発達である。","未熟心筋では筋小胞体もむしろ未発達である。","未熟心筋では交感神経系が未発達であり、副交感神経優位とされる。","（正解）未熟心筋は細胞が小さく紡錘状で、活性酸素消去系や筋小胞体、交感神経系が未発達であり、副交感神経優位という特徴がある。","未熟心筋は収縮に関わる蛋白の発現・成熟度がむしろ成人より低いとされ、「発現量が多い」という記述は正しくない。"]},{"stem":"新生児開心術において、心筋浮腫を防ぐために心筋保護液の注入圧（大動脈基部圧）は成人に比べて低く保つが、その目安はどれか？","choices":["10〜20 mmHg","30〜50 mmHg","60〜80 mmHg","80〜100 mmHg","100〜120 mmHg"],"correct":1,"expl":["10〜20 mmHgは注入圧としては低すぎ、十分な保護液の分布が得られない可能性がある。","（正解）新生児は高い注入圧により容易に心筋浮腫を来すため、成人（80〜100mmHg）より低い圧（30〜50 mmHg）で注入する。","60〜80 mmHgは新生児の目安としてはやや高い。","80〜100 mmHgは成人の目安であり、新生児の目安としては高すぎる。","100〜120 mmHgはさらに高く、新生児では心筋浮腫のリスクが著しく高まる。"]},{"stem":"心臓移植時のドナー心摘出に際して、現在広く用いられている細胞外液組成タイプの心保存液はどれか？","choices":["St. Thomas 2号液","Celsior液","GIK液","UW液","Custodiol HTK液"],"correct":1,"expl":["St. Thomas 2号液は心筋保護液（心停止液）として用いられるが、心臓移植のドナー心保存液として広く用いられているものは別にある。","（正解）心臓移植の心保存液としては、本邦ではCelsior（セルシオール）液が多く用いられている。","GIK液は細胞内液組成タイプの心筋保護液であり、心臓移植のドナー心保存液としては一般的でない。","UW液は主に肝臓・膵臓など腹部臓器の保存に用いられる液であり、心臓移植の保存液として広く用いられているものではない。","Custodiol HTK液は欧州などで用いられる細胞内液組成タイプの保護液であり、本邦での心臓移植保存液として広く用いられているものではない。"]},{"stem":"心臓移植において、ドナー心摘出からレシピエントへの移植完了までの「心虚血許容時間」は原則として何時間未満とされているか？","choices":["2時間未満","4時間未満","6時間未満","12時間未満","8時間未満"],"correct":1,"expl":["2時間未満は基準としては短すぎる見積もりである。","（正解）レシピエント選定基準では、移植完了までの心虚血許容時間は4時間未満とされている。","6時間未満は基準としては長すぎる見積もりである。","12時間未満はさらに長すぎ、実際の許容時間を大幅に超える。","8時間未満も基準としては長すぎる見積もりである。"]},{"stem":"晶質液性心筋保護液を循環式（recirculating type）回路で注入する最大のメリットはどれか？","choices":["充填量（プライミングボリューム）をゼロにできる","血液を混ぜるため酸素運搬能が高い","回路内に停滞した保護液が室温で温まるのを防ぎ、一定の低温を保てる","カニューレの圧損失をなくすことができる","薬剤の追加が不要になる"],"correct":2,"expl":["循環式回路であっても充填量を完全にゼロにできるわけではない。","晶質液性心筋保護液は血液を混ぜるものではなく、酸素運搬能の高さは循環式回路のメリットとして説明されるものではない。","（正解）循環式（recirculating type）にすることで、回路内の心筋保護液が常に冷却槽を循環し、手術室の室温で温まるのを防ぎ一定の低温で注入できる。","循環式回路であってもカニューレによる圧損失自体をなくすことはできない。","循環式回路にしても、必要に応じた薬剤（電解質など）の追加投与が不要になるわけではない。"]},{"stem":"Cold blood cardioplegia（冷血心筋保護法）における冷温水槽の設定温度はおよそ何度か？","choices":["4℃","15℃","20℃","30℃","34〜36℃"],"correct":1,"expl":["4℃はSt. Thomas 2号液（ミオテクター）注入時の冷温水槽設定温度である。","（正解）Cold blood cardioplegiaでは冷温水槽を15℃に設定する。","20℃はCold blood cardioplegiaの設定温度としては高い。","30℃はtepid blood cardioplegiaにおける冷温水槽の設定温度である。","34〜36℃はterminal warm blood cardioplegia（hot shot）における冷温水槽の設定温度である。"]},{"stem":"欧州などで用いられる細胞内液組成タイプの心筋保護液で、St. Thomas液より心拍動の自然再開が起こりにくく、60分を超える大動脈遮断でも追加投与を行わずに手術を行う施設もある溶液はどれか？","choices":["St. Thomas 2号液（ミオテクター）","GIK液","Celsior液","Custodiol HTK液","UW液"],"correct":3,"expl":["St. Thomas 2号液（ミオテクター）は細胞外液組成タイプであり、通常の注入間隔（20〜30分ごと）での反復投与が前提となる。","GIK液も細胞内液組成タイプの心筋保護液であるが、本文脈で説明されている60分以上の無投与を可能にする溶液として特に挙げられるのはCustodiol HTK液である。","Celsior液は心臓移植のドナー心保存に主に用いられる細胞外液組成タイプの溶液であり、心筋保護液としての反復注入を前提とした溶液とは性質が異なる。","（正解）Bretschneider-HHS（histidine-tryptophan-ketoglutarate）液（Custodiol HTK液、日本未発売）は細胞内液組成タイプの保護液で、St. Thomas液より心拍動が再開しにくく、60分を超える大動脈遮断でも心筋保護液を追加投与せず手術を行う施設もある。","UW液は主に肝臓・膵臓など腹部臓器の保存に用いられる溶液であり、この文脈で説明されている心筋保護液ではない。"]},{"stem":"心筋保護法について、正しい記述の組み合わせはどれか。\na　新生児では、心筋保護液の注入圧を成人より高く設定する。\nb　Cold blood cardioplegiaの冷温水槽設定温度は15℃程度である。\nc　大動脈基部圧が150mmHg以上になると、大動脈解離の危険が増し心筋浮腫を来しやすくなる。\nd　Custodiol HTK液は、細胞外液組成タイプの心筋保護液である。\ne　逆行性心筋保護における注入圧は、順行性注入時と同じ80〜100mmHgを目安とする。","choices":["a, b","a, e","b, c","c, d","d, e"],"correct":2,"expl":["aとbの組み合わせ。aは誤り（新生児では成人より低い注入圧〈30〜50mmHg〉で注入する）であるため、この組み合わせは不適切。","aとeの組み合わせ。いずれも誤り（aは前述の通り誤り、eも誤り〈逆行性注入の注入圧は30mmHg以下を目安とする〉）であるため、この組み合わせは不適切。","（正解）bは正しい（Cold blood cardioplegiaの冷温水槽設定温度は15℃程度である）。cも正しい（大動脈基部圧が150mmHg以上になると大動脈解離の危険が増し心筋浮腫を来しやすくなる）。両者とも正しい記述であり、この組み合わせが正解となる。","cとdの組み合わせ。dは誤り（Custodiol HTK液は細胞内液組成タイプの心筋保護液である）であるため、この組み合わせは不適切。","dとeの組み合わせ。いずれも誤りであるため、この組み合わせは不適切。"]}]},{"title":"第10章：操作の実際","code":"op","questions":[{"stem":"人工心肺回路を組み立てる際、ハードシェル静脈貯血槽と人工肺の位置関係で注意すべきことはどれか？","choices":["貯血槽より人工肺の位置が高いと、落差圧で人工肺から空気を引き込む恐れがある","貯血槽より人工肺の位置が低いと、人工肺が破裂する恐れがある","貯血槽と人工肺は必ず同じ高さにしなければならない","位置関係は特に気にする必要はない","人工肺は必ず貯血槽より低い位置に設置しなければならない"],"correct":0,"expl":["（正解）貯血槽より人工肺の位置が高いと、貯血槽液面との落差圧によって人工肺から空気を引き込んでしまうことがあるため注意が必要である。","人工肺が破裂する恐れがあるという説明は一般的ではない。","必ず同じ高さにしなければならないという規定ではない。","位置関係は空気引き込みの観点から重要であり、気にする必要がないというのは誤りである。","人工肺を必ず貯血槽より低い位置に設置しなければならないという規定はない。"]},{"stem":"ローラーポンプの適正圧閉度調節において、回路を遮断して一定の圧力（例：250mmHg）を加え、それが降下する速度（10秒あたり5mmHg程度）を見て調節する方法はどれか？","choices":["輸液セットの滴下による試験","回路液面降下による試験","圧力低下速度による試験","圧閉部の模様による試験","ローラー回転数による試験"],"correct":2,"expl":["輸液セットの滴下速度（滴下法）による圧閉度調節も実際に用いられる方法の一つだが、設問の「回路を遮断し一定圧を加えてその降下速度をみる」という手順とは異なる方法である。","回路液面の降下を利用する方法も圧閉度調節の一手法として紹介されることがあるが、設問で説明されている圧力降下による手順とは異なる。","（正解）回路に一定圧力（例：250mmHg）をかけ、その圧力の降下速度（例：10秒あたり5mmHg程度）を確認して調節する方法であり、圧力低下速度による試験（圧力降下法）と呼ばれる。","圧閉部の模様（外観）のみで調節する方法は、設問で説明されている圧力降下による手順とは異なる。","ローラー回転数を基準に圧閉度を調節する方法は、設問で説明されている圧力降下による手順とは異なる。"]},{"stem":"成人の標準的な開心術において、完全体外循環中の目標となる「至適灌流指数（L/分/m²）」はどれか？","choices":["1.0〜1.5 L/分/m²","1.5〜2.0 L/分/m²","2.2〜2.5 L/分/m²","2.8〜3.2 L/分/m²","3.5〜4.0 L/分/m²"],"correct":2,"expl":["1.0〜1.5 L/分/m²は成人の標準的至適灌流指数としては低すぎる。","1.5〜2.0 L/分/m²も成人の目標値としては低すぎる。","（正解）成人の標準的至適灌流指数は2.2〜2.5 L/分/m²であり、小児は2.5〜2.8、乳児は2.8〜3.2 L/分/m²とされる。","2.8〜3.2 L/分/m²は乳児の基準に近く、成人としては高すぎる。","3.5〜4.0 L/分/m²は明らかに高すぎる。"]},{"stem":"完全体外循環中における、成人の「平均大動脈圧」の一般的な目標値はどれか？","choices":["30〜50 mmHg","50〜80 mmHg","80〜100 mmHg","100〜120 mmHg","120〜150 mmHg"],"correct":1,"expl":["30〜50 mmHgは目標値としては低すぎる。","（正解）完全体外循環中の平均大動脈圧は50〜80mmHgに維持する。ただし頸動脈狭窄などの合併症がある場合は80mmHg以上に保つこともある。","80〜100 mmHgは通常の目標としてはやや高い。","100〜120 mmHgは明らかに高すぎる。","120〜150 mmHgはさらに高すぎる。"]},{"stem":"完全体外循環中、37℃換算（アルファ・スタット管理）における動脈血炭酸ガス分圧（pCO2）の目標値はどれか？","choices":["20〜30 mmHg","35〜45 mmHg","50〜60 mmHg","60〜70 mmHg","70〜80 mmHg"],"correct":1,"expl":["20〜30 mmHgは低すぎる目標値である。","（正解）動脈血ガスは37℃換算でpH 7.35〜7.45、pO2 150〜250mmHg、pCO2 35〜45mmHgに保つように管理する。","50〜60 mmHgは高すぎる。","60〜70 mmHgはさらに高すぎる。","70〜80 mmHgは明らかに高すぎる。"]},{"stem":"完全体外循環中、全身の臓器灌流が保たれている指標となる「尿量」は、最低でもどの程度を維持すべきか？","choices":["0.1 mL/時/kg","0.5 mL/時/kg","1.0 mL/時/kg","2.0 mL/時/kg","3.0 mL/時/kg"],"correct":2,"expl":["0.1 mL/時/kgでは目安として低すぎる。","0.5 mL/時/kgも臓器灌流の指標としては不十分である。","（正解）全身の臓器灌流の指標として、また腎不全を予防するためにも、尿量は1.0 mL/時/kg以上を保つようにする。","2.0 mL/時/kgは基準として厳しすぎる（過大な要求）。","3.0 mL/時/kgはさらに非現実的に高い基準である。"]},{"stem":"近年注目されている「目標指向型体外循環管理（GDP）」において、目標とする酸素運搬量係数（DO2i）の目安はどれか？","choices":["100 mL/分/m²以上","150 mL/分/m²以上","272 mL/分/m²以上","400 mL/分/m²以上","500 mL/分/m²以上"],"correct":2,"expl":["100 mL/分/m²以上では目安として低すぎる。","150 mL/分/m²以上も低すぎる。","（正解）患者の体格やヘモグロビン値、酸素飽和度などから算出される酸素運搬量係数（DO2i）を272 mL/分/m²以上に保つGDPが注目されている。","400 mL/分/m²以上は目安として高すぎる。","500 mL/分/m²以上はさらに高すぎる。"]},{"stem":"体外循環を開始する際、急な送脱血によって体内の循環血液が急激に希釈され、動脈圧が一過性に急激に低下する現象を何と呼ぶか？","choices":["ウォーターハンマー","キャビテーション","イニシャルドロップ（initial drop）","プラズマリーク","リバウンド現象"],"correct":2,"expl":["ウォーターハンマーは配管内の急激な圧力変化を指す用語であり、この現象を指す名称ではない。","キャビテーションは液体中に気泡が発生する物理現象であり、この現象の名称ではない。","（正解）充填液の急激な流入によりカテコールアミン濃度が低下し、末梢血管抵抗が下がることで一過性の低血圧（イニシャルドロップ）を生じる。","プラズマリークは人工肺の膜から血漿成分が漏出する現象であり、この血圧低下現象を指す名称ではない。","リバウンド現象はこの血圧低下を指す一般的な名称ではない。"]},{"stem":"右房を開胸する手術において、人工心肺が完全に体循環を代行する「完全体外循環」へと移行するために行う操作はどれか？","choices":["肺動脈をクランプする","上下大静脈にかけたテープ（ターニケット）で脱血管を絞める","大動脈遮断鉗子をかける","心筋保護液を注入する","送血ポンプを最大流量にする"],"correct":1,"expl":["肺動脈をクランプする操作は完全体外循環への移行操作ではない。","（正解）上下大静脈をターニケットで絞めることで、冠静脈洞からの還流血を除くすべての静脈血が脱血カニューレに導かれ、完全体外循環となる。","大動脈遮断鉗子をかける操作は心筋保護のための操作であり、完全体外循環への移行そのものを指す操作ではない。","心筋保護液の注入は完全体外循環への移行後に行われる操作である。","送血ポンプを最大流量にすることは完全体外循環への移行の定義的操作ではない。"]},{"stem":"大動脈遮断を行う際、大動脈壁の損傷予防や遮断時の心筋負荷を軽減するために行う人工心肺側の操作はどれか？","choices":["送血量を1 L/分以下にし、灌流圧を40 mmHg以下に下げる","送血量を最大にし、灌流圧を100 mmHg以上にする","一時的に脱血を完全に停止する","人工肺への酸素吹送を完全に停止する","心筋保護液の注入を中止する"],"correct":0,"expl":["（正解）大動脈遮断時は、送血量を1 L/分以下に下げ、灌流圧を40 mmHg以下にしてから遮断鉗子をかけ、その後に元の流量に戻す。","送血量を最大にし、灌流圧を100 mmHg以上にする操作は大動脈壁の損傷リスクを高めるため誤りである。","一時的に脱血を完全に停止する操作は遮断時の一般的な手順ではない。","酸素吹送を完全に停止する操作は遮断時の手技として一般的ではない。","心筋保護液の注入を中止する操作は遮断時の手技として説明されるものではない。"]},{"stem":"完全体外循環中、中心静脈圧（CVP）が何mmHg以上になると、脳浮腫を合併する危険性が高まるため注意が必要か？","choices":["5 mmHg","10 mmHg","15 mmHg","20 mmHg","25 mmHg"],"correct":3,"expl":["5 mmHgは基準値として低すぎる。","10 mmHgも基準値として低すぎる。","15 mmHgも基準値としてはまだ低い。","（正解）CVPが20 mmHg以上になると脳浮腫を合併する危険性があるため、高値を示す場合は術者に伝えて対処を求める。","25 mmHgは基準値としてはやや高すぎる。"]},{"stem":"体外循環中の冷却に伴う血液ガスの変化として正しいものはどれか？","choices":["PCO2は低下し、pHは上昇してアルカローシスを呈する","PCO2は低下し、pHも低下してアシドーシスを呈する","PCO2は上昇し、pHは低下してアシドーシスを呈する","PCO2は上昇し、pHも上昇してアルカローシスを呈する","PCO2・pHともに変化しない"],"correct":0,"expl":["（正解）体温が低下するにしたがって二酸化炭素の溶解度が上がるためPCO2は低下し、それに伴いpHは上昇（アルカローシス）する。","PCO2が低下する点は正しいが、pHも低下するという組み合わせは誤りである。","冷却によりPCO2は上昇ではなく低下するため誤りである。","冷却によりPCO2は上昇ではなく低下し、pHも低下ではなく上昇するため誤りである。","冷却により血液ガスは変化するため、変化しないという説明は誤りである。"]},{"stem":"復温を開始し熱交換器で血液を加温する際、細胞成分やタンパク質の変性を防ぐために、温水温度は最高で何度を超えないように設定するか？","choices":["35℃","37℃","39℃","42℃","45℃"],"correct":3,"expl":["35℃では復温の温水温度としては低すぎる制限である。","37℃も制限としては低すぎる。","39℃も実際の上限値としてはやや低い。","（正解）冷温水槽の温水温度は決して42℃以上にしてはならず、また復温時の送脱血温の温度較差は10℃（施設によっては5℃）以内とする。","45℃は上限として高すぎ、タンパク質変性のリスクが高まる。"]},{"stem":"復温中、大動脈遮断を解除して心拍が再開するまでの間、心筋温の上昇を抑えるために送血温は最高で何度を超えないように設定すべきか？","choices":["30℃","32℃","35℃","37℃","40℃"],"correct":2,"expl":["30℃では制限として低すぎる。","32℃も制限としては低い。","（正解）大動脈遮断を解除するまでは、送血温が35℃を超えないように復温し、心停止中の心筋温の上昇を抑える。","37℃は制限として高すぎ、心筋温の上昇を招く恐れがある。","40℃はさらに高すぎる。"]},{"stem":"体外循環から離脱を開始する際、まず最初に行う人工心肺側の操作はどれか？","choices":["送血ポンプを完全に停止する","大動脈基部ベントを最大流量で吸引する","脱血回路を狭窄させて貯血槽レベルを下げ、心臓に静脈還流血液を送り込む","人工肺へのガス吹送を停止する","心筋保護液を再注入する"],"correct":2,"expl":["送血ポンプを完全に停止する操作は離脱開始時に最初に行う操作ではない。","大動脈基部ベントを最大流量で吸引する操作は離脱開始時の最初の操作として一般的ではない。","（正解）離脱時は、まず脱血回路を狭窄（クランプやオクルーダーを使用）させて脱血量を減らし、心臓に血液を充満させて自己心拍出を促す。","人工肺へのガス吹送を停止する操作は離脱開始時の最初の操作ではない。","心筋保護液を再注入する操作は離脱時の手技として一般的ではない。"]},{"stem":"人工心肺からの離脱条件として、適切なヘモグロビン（Hb）値は最低何g/dL以上か？","choices":["5.0 g/dL以上","7.0 g/dL以上","10.0 g/dL以上","12.0 g/dL以上","14.0 g/dL以上"],"correct":1,"expl":["5.0 g/dL以上では離脱条件として低すぎる。","（正解）離脱条件として、血液ガスや電解質が正常であることに加え、Hb 7.0 g/dL以上、カリウム4.0〜6.0 mmol/L、カルシウム1.0 mmol/L以上であることが求められる。","10.0 g/dL以上は離脱条件の基準としては高すぎる。","12.0 g/dL以上はさらに高すぎる基準である。","14.0 g/dL以上は明らかに高すぎる基準である。"]},{"stem":"体外循環終了後にヘパリンを中和する「硫酸プロタミン」を投与する際、人工心肺装置からの術野吸引（サクション）を停止するタイミングはいつか？","choices":["プロタミン投与開始と同時","プロタミン予定量の1/3〜1/2が投与された時点","プロタミン投与が完全に終了した時点","ACTが150秒以下になった時点","ヘパリン中和を開始する前"],"correct":1,"expl":["プロタミン投与開始と同時に停止するのは早すぎる。","（正解）プロタミンの投与が予定量の1/3〜1/2に達した時点で人工心肺装置の吸引は中止し、自己血回収装置や壁吸引へ切り替える（回路内凝血を防ぐため）。","投与が完全に終了した時点まで待つのは遅すぎ、回路内凝血のリスクが高まる。","ACTが150秒以下になった時点という基準で判断するものではない。","ヘパリン中和を開始する前に停止するのは早すぎる。"]},{"stem":"ヘパリン18,000単位を投与した患者に対し、ヘパリン1mgをプロタミン1mgで中和する方針とした場合、必要なプロタミンの量はおよそいくらか？（ヘパリン1mg＝100単位とする）","choices":["60mg","90mg","120mg","180mg","360mg"],"correct":3,"expl":["60mgでは中和に必要な量として少なすぎる。","90mgも少なすぎる。","120mgもまだ不足する。","（正解）18,000単位÷100単位/mg＝180mgのヘパリンに相当するため、中和に必要なプロタミンも約180mgとなる。プロタミンの急速投与は血圧低下や肺高血圧を招くため緩徐に投与する。","360mgは必要量の2倍であり過剰投与となる。"]},{"stem":"血液心筋保護液を血液：晶質液＝4：1の割合で総流量200mL/分で注入する場合、晶質液（心筋保護原液）側のポンプ流量はいくらか？","choices":["20mL/分","40mL/分","50mL/分","80mL/分","100mL/分"],"correct":1,"expl":["20mL/分では計算値として少なすぎる。","（正解）4：1では全体を5等分し、晶質液は1/5にあたるため200×1/5＝40mL/分（血液側は160mL/分）。混合比の分母を（4＋1）とする点がポイントである。","50mL/分は計算値として誤りである。","80mL/分は血液側の流量の半分に相当し、晶質液側の値としては誤りである。","100mL/分は総流量の半分であり、4：1の比率から外れる。"]},{"stem":"完全（灌流）体外循環中の循環管理のために推奨される観察項目として、本文中に挙げられていないものはどれか？","choices":["平均動脈圧","電解質","ヘモグロビン（Hb）","心拍出量（サーモダイリューション法）","活性化凝固時間（ACT）"],"correct":3,"expl":["平均動脈圧は完全体外循環中の循環管理のために推奨される観察項目の一つである。","電解質も推奨される観察項目の一つである。","ヘモグロビン（Hb）も推奨される観察項目の一つである。","（正解）完全体外循環中の循環管理のために推奨される項目として挙げられているのは、平均動脈圧、中心静脈圧、血液ガス、電解質、ヘモグロビン（Hb）、活性化凝固時間（ACT）であり、心拍出量（サーモダイリューション法）は挙げられていない。","活性化凝固時間（ACT）も推奨される観察項目の一つである。"]},{"stem":"人工心肺による体外循環中の管理に関する次のa〜eの記述のうち、正しいものの組み合わせはどれか？\na　成人の標準的な至適灌流指数は2.2〜2.5 L/分/m²である。\nb　完全体外循環中の平均大動脈圧の目標は50〜80 mmHgである。\nc　尿量は最低0.5 mL/時/kgを維持すればよいとされる。\nd　目標指向型体外循環管理（GDP）におけるDO2iの目安は150 mL/分/m²以上である。\ne　中心静脈圧（CVP）が10 mmHg以上になると脳浮腫合併の危険性が高まる。","choices":["a, b","a, e","b, c","c, d","d, e"],"correct":0,"expl":["（正解）a・bはいずれも正しい。aの至適灌流指数2.2〜2.5 L/分/m²、bの平均大動脈圧50〜80 mmHgはいずれも成人の標準的な目標値である。","eは誤り。CVPが脳浮腫の危険性を高めるとされる基準は20 mmHg以上であり、10 mmHg以上ではない。","cは誤り。尿量は最低1.0 mL/時/kg以上を維持すべきとされ、0.5 mL/時/kgでは不十分である。","cが誤りであるため、この組み合わせは正しくない。dも誤り。目標指向型体外循環管理（GDP）におけるDO2iの目安は272 mL/分/m²以上とされ、150 mL/分/m²以上では不十分である。","eが誤りであるため、この組み合わせは正しくない。dも誤り。GDPにおけるDO2iの目安は272 mL/分/m²以上とされ、150 mL/分/m²以上では不十分である。"]}]},{"title":"第11章：安全管理とトラブルシューティング","code":"safe","questions":[{"stem":"人工心肺の準備において、チェックリストを用いた確認はどのように行うのが原則か？","choices":["最も経験のあるスタッフが1人で迅速に行う","実際に操作を行うスタッフと周辺業務を行うスタッフの2名でダブルチェックを行う","執刀医が1人で最終確認を行う","麻酔科医と看護師の2名で行う","チェックリストは口頭確認のみとし、記録は不要である"],"correct":1,"expl":["1人で迅速に行う方法は、思い込みによる見落としを防げないため原則ではない。","（正解）双方の思い込みによるミスを防止するため、チェックリストは実際に操作を行うスタッフと周辺業務を行うスタッフの2名でダブルチェックを行うことが原則である。","執刀医が1人で最終確認を行う方法は一般的な原則ではない。","麻酔科医と看護師の2名で行うという組み合わせは一般的な原則として説明されるものではない。","記録を残さない口頭確認のみでは、後日の検証や安全管理の観点から不十分である。"]},{"stem":"送血回路に設置する「気泡検出器（バブルセンサー）」について、安全装置設置基準で強く推奨されている機能はどれか？","choices":["人工肺へのガス吹送の自動停止","動脈フィルターのバイパス機能の自動作動","送血ポンプの自動停止（制御）機能","貯血槽への自動補液機能","アラーム音のみで自動停止機能は備えない"],"correct":2,"expl":["気泡検出時にガス吹送を自動停止する機能は、強く推奨されている機能として一般的に説明されるものではない。","動脈フィルターのバイパス機能を自動作動させることは推奨される対応ではなく、むしろ気泡の患者への送達を招く危険がある。","（正解）気泡検出による送血ポンプの制御（自動停止）は、日本体外循環技術医学会のガイドラインで強く推奨されている。","貯血槽への自動補液機能は気泡検出器の推奨機能として一般的に説明されるものではない。","アラーム音のみで自動停止機能を備えないことは、ガイドラインが強く推奨する内容とは逆である。"]},{"stem":"人工心肺開始直後、送血圧が異常に上昇し、患者の血圧変動や左右差が認められた。最も疑うべき重篤な病態はどれか？","choices":["大動脈解離","静脈貯血槽の液面レベル低下","肺動脈塞栓症","動脈管開存","人工肺のガス供給過多"],"correct":0,"expl":["（正解）送血圧の異常上昇に血圧の変動や左右差が伴う場合は、送血管の先端が大動脈壁に当たっているなどによる大動脈解離の可能性が高いため、直ちに送血を停止するか流量を下げて原因究明を行う。","静脈貯血槽の液面レベル低下は脱血不良に関連する事象であり、この症状の原因として最も疑うべきものではない。","肺動脈塞栓症はこの状況で最も疑うべき病態として一般的に説明されるものではない。","動脈管開存は先天性心疾患であり、この急性の症状の原因として最も疑うべきものではない。","人工肺のガス供給過多は送血圧の異常上昇や血圧左右差の原因として一般的に説明されるものではない。"]},{"stem":"送血圧が異常に高くなったが、すぐに体外循環を停止できない場合の初期対応として正しいのはどれか？","choices":["送血流量を最大にする","送血流量を下げ、低圧にして早急に原因究明を行う","脱血回路をクランプする","人工肺のガス流量をゼロにする","ヘパリンを追加投与する"],"correct":1,"expl":["送血流量を最大にする対応は、大動脈解離などの重篤な病態が背景にある場合に被害を拡大させる危険がある。","（正解）人工心肺を停止できない段階であれば、送血流量を下げて低圧で維持し、早急に原因究明を行う。","脱血回路をクランプする対応は循環そのものを破綻させる危険があり、初期対応として適切ではない。","人工肺のガス流量をゼロにする対応は送血圧の問題とは直接関係せず、初期対応として適切ではない。","ヘパリンを追加投与する対応は送血圧異常への直接的な対応ではない。"]},{"stem":"脱血不良が発生し、中心静脈圧（CVP）が陰圧を示している。最も考えられる原因はどれか？","choices":["脱血管の先端が肝静脈に迷入している","陰圧補助脱血（VAVD）の陰圧が強すぎる","循環血液量の不足（ボリューム不足）","送血カニューレの屈曲","プロタミンの過量投与"],"correct":2,"expl":["脱血管の先端が肝静脈に迷入している場合は脱血不良の原因となり得るが、CVP陰圧の最も一般的な原因として説明されるものではない。","VAVDの陰圧が強すぎることはCVP陰圧化に寄与し得るが、最も一般的な原因として説明されるのは循環血液量の不足である。","（正解）CVPが陰圧となる場合は循環血液量の不足が考えられるため、補液を行ってCVPを適切な値に維持する。","送血カニューレの屈曲は送血側のトラブルであり、CVP陰圧の直接的な原因ではない。","プロタミンの過量投与はCVP陰圧化の原因として一般的に説明されるものではない。"]},{"stem":"脱血回路にエアーブロックが生じた際、直後に引き起こされる危険性が高い事象はどれか？","choices":["人工肺の破裂","送血ポンプの逆回転","貯血槽液面レベルの急激な低下と、それに伴う気泡誤送","中心静脈圧（CVP）の異常低下","人工肺のガス交換能の急激な改善"],"correct":2,"expl":["人工肺の破裂はエアーブロック直後に生じる事象として一般的に説明されるものではない。","送血ポンプの逆回転はエアーブロックによって直接引き起こされる事象として一般的に説明されるものではない。","（正解）エアーブロックが生じると貯血槽の液面レベルが急激に低下し、送血回路へ空気を誤送してしまう危険性がある。","CVPの異常低下はエアーブロック直後に生じる事象として直接説明されるものではない。","ガス交換能が急激に改善するという説明は誤りであり、むしろ悪化のリスクが高まる。"]},{"stem":"人工肺の酸素供給装置が故障し、すぐに復旧できない場合の応急処置として「不適切」なものはどれか？","choices":["酸素ガスボンベを使用する","酸素チューブから息を吹き込む","酸素チューブをローラーポンプに装着して室内の空気を送る","吹送ガスラインを完全に遮断（クランプ）する","アンビューバッグを用いて酸素チューブに送気する"],"correct":3,"expl":["酸素ガスボンベを使用する対応は適切な応急処置の一つである。","酸素チューブから息を吹き込む対応は緊急時の応急処置として説明される内容である。","酸素チューブをローラーポンプに装着して室内の空気を送る対応も緊急時の応急処置として説明される内容である。","（正解）ガスラインを完全に遮断すると換気が全くできなくなり、極めて危険である。酸素ボンベがない場合は、息を吹き込んだり、ローラーポンプで空気を送るなどして換気を維持しつつ復旧を図るべきであり、遮断は不適切である。","アンビューバッグを用いて送気する対応も緊急時の応急処置として合理的な内容である。"]},{"stem":"送血回路から患者へ気泡を誤送してしまった場合、脳への空気塞栓を防ぐために直ちにとるべき体位はどれか？","choices":["ジャックナイフ体位","トレンデレンブルグ体位（頭低位）","ファウラー体位（半坐位）","腹臥位","仰臥位のまま体位変換しない"],"correct":1,"expl":["ジャックナイフ体位は空気塞栓予防の体位として一般的に説明されるものではない。","（正解）患者に気泡を誤送した場合は、直ちに頭部を低くするトレンデレンブルグ体位をとり、気泡が脳へ向かうのを防ぐ。","ファウラー体位（半坐位）は頭部を挙上する体位であり、脳への空気移動を助長するため誤りである。","腹臥位は空気塞栓予防の体位として一般的に説明されるものではない。","体位変換をしないことは、気泡が脳血管へ向かうリスクを放置することになり不適切である。"]},{"stem":"患者への気泡誤送時、脳血管に迷入した気泡を排除するために、脱血回路を利用して速やかに開始する処置はどれか？","choices":["限外濾過（MUF）","大動脈基部からの順行性心筋保護","逆行性脳灌流（RCP）","選択的脳灌流（SCP）","高流量送血への切り替えのみ"],"correct":2,"expl":["限外濾過（MUF）は血液濃縮のための処置であり、脳血管内の気泡排除を目的とした処置ではない。","大動脈基部からの順行性心筋保護は心筋保護のための処置であり、脳血管内の気泡排除を目的とした処置ではない。","（正解）回路内の気泡を除去し鉗子を噛み換えた後、執刀医の指示で脱血回路（上大静脈など）から逆行性脳灌流（RCP）を開始し、脳内の気泡を押し出す。","選択的脳灌流（SCP）は脳分離体外循環の技術であり、脱血回路を利用した気泡排除処置として説明されるものではない。","高流量送血への切り替えのみでは、既に脳血管内に迷入した気泡を排除する処置とはならない。"]},{"stem":"ベント回路から心腔内へ誤って気泡を送ってしまう原因として、最も典型的なヒューマンエラーはどれか？","choices":["ヘパリンの投与忘れ","送血ポンプの過回転","チューブのポンプヘッドへの掛け間違いや、ポンプの逆回転方向間違い","動脈フィルターのバイパスライン開放","心筋保護液の誤投与"],"correct":2,"expl":["ヘパリンの投与忘れはベントからの気泡誤送の原因として一般的に説明されるものではない。","送血ポンプの過回転はベントからの気泡誤送の典型的な原因として説明されるものではない。","（正解）ベント回路からの気泡誤送は、チューブの掛け間違いやポンプの逆回転によって本来吸引すべきところを送気してしまうことで発生する。","動脈フィルターのバイパスライン開放はベントからの気泡誤送とは直接関連しない。","心筋保護液の誤投与はベントからの気泡誤送の原因として一般的に説明されるものではない。"]},{"stem":"陰圧補助脱血（VAVD）中、貯血槽から脱血回路へ向かって気泡が逆送する原因となる状態はどれか？","choices":["貯血槽内が陰圧になりすぎたこと","貯血槽内が陽圧になること","人工肺のウェットラング","熱交換器の水漏れ","送血ポンプの回転数過多"],"correct":1,"expl":["貯血槽内が陰圧になりすぎることはVAVDの本来の駆動原理であり、これ自体が気泡逆送の直接原因として説明されるものではない。","（正解）VAVDシステムの故障等で貯血槽が閉鎖状態に陥り、吸引・ベントポンプで回収された空気によって貯血槽内が「陽圧」になると、脱血回路へ空気が逆送する。","人工肺のウェットラングは酸素化能低下の原因であり、貯血槽から脱血回路への気泡逆送の原因として説明されるものではない。","熱交換器の水漏れは血液への水分混入の原因であり、この気泡逆送の原因として説明されるものではない。","送血ポンプの回転数過多は送血側のトラブルであり、この現象の原因として説明されるものではない。"]},{"stem":"停電や故障によりメインの送血ポンプが停止してしまった場合、まず最初に行うべき対応はどれか？","choices":["すぐに人工心肺から離脱する","バッテリー駆動かハンドクランク（手動運転）を用いて循環を維持する","大動脈遮断鉗子をかける","全てのカニューレを抜去する","プロタミンを直ちに投与する"],"correct":1,"expl":["すぐに人工心肺から離脱する対応は、原因が解決していない段階では危険であり最初に行うべき対応ではない。","（正解）電力遮断や装置のトラブルで送血ポンプが停止した場合は、まずバッテリー駆動かハンドクランクによる手動運転で循環を維持し、その間に原因究明を行う。","大動脈遮断鉗子をかける対応は送血ポンプ停止への直接的な対応ではない。","全てのカニューレを抜去する対応は循環を完全に断つ危険な行為であり、最初に行うべき対応ではない。","プロタミンを直ちに投与する対応は送血ポンプ停止への直接的な対応ではない。"]},{"stem":"人工心肺中に広範囲な回路内血液凝固が発生した場合の対応として適切なのはどれか？","choices":["ヘパリンを大量投与し、そのままの回路で強引に回し続ける","プロタミンを投与して血栓を溶かす","別の人工心肺装置やPCPSを準備し、システムごと交換する","人工肺のみを交換して再開する","ウロキナーゼを回路内に投与して血栓溶解を図る"],"correct":2,"expl":["ヘパリンを追加投与してそのままの回路で回し続けることは、既に生じた血栓による塞栓リスクを放置することになり不適切である。","プロタミンはヘパリンを中和する薬剤であり、血栓を溶かす作用はなく、この対応は誤りである。","（正解）動脈フィルター以前の少量の凝固であれば続行可能な場合もあるが、広範囲に凝固した場合は数分間の循環停止では済まないため、別の人工心肺装置やPCPSを準備してシステムごと交換する。","人工肺のみを交換して再開する対応では、回路全体に及ぶ広範囲な凝固に対応できない。","ウロキナーゼによる血栓溶解は出血リスクを著しく高めるため、体外循環中の対応として適切ではない。"]},{"stem":"体外循環終了後、回路内の血液凝固を防ぐため、人工心肺装置からの術野吸引（サクション）を停止するタイミングはいつか？","choices":["プロタミンの投与開始と同時","プロタミン予定量の1/3〜1/2が投与された時点","プロタミンの投与が完全に終了した時点","抜管が完了した時点","手術終了（閉胸）が完了した時点"],"correct":1,"expl":["プロタミンの投与開始と同時に停止するのは早すぎ、まだプロタミンによる回路内凝固のリスクが低い段階である。","（正解）プロタミンが予定量の1/3〜1/2投与された時点で人工心肺の吸引は中止し、自己血回収装置や壁吸引へ切り替える。それ以降も吸引を続けると、プロタミンに曝露された血液により回路内が凝固する危険がある。","プロタミンの投与が完全に終了した時点まで待つと、その間に吸引した血液によって回路内血液凝固が生じる危険がある。","抜管が完了した時点は吸引停止のタイミングとして一般的に説明されるものではなく、遅すぎる。","手術終了（閉胸）が完了した時点は吸引停止のタイミングとして一般的に説明されるものではなく、遅すぎる。"]},{"stem":"熱交換器から人工肺内へ水漏れ（ウェットラング）が生じた場合の徴候として適切なものはどれか？","choices":["人工肺のガス出口から水滴が漏出する","送血圧が異常に低下する","中心静脈圧（CVP）が上昇する","体温が異常に上昇する","活性化凝固時間（ACT）が延長する"],"correct":0,"expl":["（正解）熱交換器からの水漏れが生じると、水分がガス交換膜側に混入し、人工肺のガス出口（排気口）から水滴や泡沫として漏出することが典型的な徴候となる。","送血圧の異常低下はウェットラングの直接的な徴候として一般的に説明されるものではない。","CVPの上昇はウェットラングの直接的な徴候として一般的に説明されるものではない。","体温の異常上昇はウェットラングの直接的な徴候として一般的に説明されるものではない。","ACTの延長はウェットラングとは無関係であり、この徴候として説明されるものではない。"]},{"stem":"人工肺手前圧の上昇を予防するための対策として適切なものはどれか？","choices":["活性化凝固時間（ACT）を至適範囲に保ち、回路内血栓形成を防ぐ","送血流量を可能な限り低く抑える","送血温をできるだけ高く保つ","ヘパリンの投与量を必要最小限に抑える","定期的な人工肺手前圧の測定を中止する"],"correct":0,"expl":["（正解）ACTを至適範囲に保つことで抗凝固が十分に維持され、回路内・人工肺内の血栓形成を防ぐことが人工肺手前圧上昇の予防につながる。","送血流量を低く抑えることは灌流不足を招く恐れがあり、人工肺手前圧上昇の予防策として一般的に説明されるものではない。","送血温をできるだけ高く保つことは人工肺手前圧上昇の予防策として一般的に説明されるものではない。","ヘパリン投与量を必要最小限に抑えることは抗凝固不足による血栓形成を助長する恐れがあり、予防策として不適切である。","定期的な測定を中止することは、圧上昇の早期発見を妨げるため予防策として不適切である。"]},{"stem":"遠心ポンプを使用している場合、体外循環終了後などに予期しない逆流（患者からの脱血）が起こる原因として考えられるのはどれか？","choices":["遠心ポンプの回転数不足","動脈フィルターの目詰まり","貯血槽の液面レベル低下","ヘパリンの過剰投与","送血カニューレの位置異常"],"correct":0,"expl":["（正解）遠心ポンプは完全閉鎖（オクルージョン）されないため、回転数を下げ過ぎると患者の血圧（ボリューム負荷など）に負けて血液が逆流してしまう。","動脈フィルターの目詰まりは送血抵抗を上昇させる要因であり、逆流の原因として説明されるものではない。","貯血槽の液面レベル低下は脱血側の問題であり、この逆流現象の直接原因として説明されるものではない。","ヘパリンの過剰投与は出血傾向の原因となるが、この逆流現象の直接原因として説明されるものではない。","送血カニューレの位置異常はこの逆流現象の典型的な原因として一般的に説明されるものではない。"]},{"stem":"順行性心筋保護液を注入しているが、注入圧が全く上昇しない。原因として疑われる病態はどれか？","choices":["大動脈解離","カニューレの閉塞","大動脈弁閉鎖不全（AR）","冠動脈の高度狭窄","心筋保護液の温度が低すぎること"],"correct":2,"expl":["大動脈解離は注入圧の異常な上昇や変動をきたし得る病態であり、圧が全く上昇しない原因としては説明されない。","カニューレの閉塞はむしろ注入圧の上昇をきたす原因であり、圧が上昇しない原因としては説明されない。","（正解）大動脈弁閉鎖不全（AR）がある場合、注入した保護液が左室内に漏れ落ちてしまうため注入圧が上昇しない。","冠動脈の高度狭窄はむしろ局所的な注入圧上昇や灌流不良の原因となり得るものであり、圧が全く上昇しない原因としては説明されない。","心筋保護液の温度が低すぎることは注入圧に直接影響する要因として一般的に説明されるものではない。"]},{"stem":"大動脈遮断鉗子をかけ、順行性心筋保護液の注入を開始したところ、注入圧が異常に高くなりすぎた。考えられる原因として「誤っている」ものはどれか？","choices":["回路の屈曲や閉塞","大動脈弁閉鎖不全（AR）が存在する","大動脈解離を生じている","カニューレが遮断鉗子で挟まれている","心筋保護液回路内のフィルターの目詰まり"],"correct":1,"expl":["回路の屈曲や閉塞は注入圧の異常高値をきたす原因として正しい。","（正解）注入圧が異常に高い場合は、回路・カニューレの閉塞や大動脈解離などを疑う。ARが存在する場合はむしろ保護液が左室内に漏れるため圧は「低く」なるので、原因として誤っている。","大動脈解離を生じている場合は注入圧の異常高値をきたす原因として正しい。","カニューレが遮断鉗子で挟まれている場合も注入圧の異常高値をきたす原因として正しい。","心筋保護液回路内のフィルターの目詰まりも注入圧の異常高値をきたす原因として正しい。"]},{"stem":"心筋保護液を適切な圧と量で注入しているにもかかわらず、心停止が得られない場合、保護液のどの成分の不足が考えられるか？","choices":["ナトリウム","カルシウム","マグネシウム","カリウム","重炭酸"],"correct":3,"expl":["ナトリウムの不足は心停止が得られない原因として一般的に説明されるものではない。","カルシウムの不足は心停止が得られない原因として一般的に説明されるものではない。","マグネシウムの不足は心停止が得られない原因として一般的に説明されるものではない。","（正解）心筋保護液の注入量や圧が十分なのに心停止が得られない原因の一つとして、保護液中のカリウム濃度が低い（不足している）ことが挙げられる。","重炭酸の不足は心停止が得られない原因として一般的に説明されるものではない。"]},{"stem":"大動脈遮断解除後、心室細動（VF）となり電気的除細動を行っても回復しない場合、投与が検討される抗不整脈薬はどれか？","choices":["アデノシン","アトロピン","キシロカイン（リドカイン）","ジゴキシン","ワルファリン"],"correct":2,"expl":["アデノシンは上室性頻拍の停止などに用いられる薬剤であり、この状況で検討される抗不整脈薬として一般的に説明されるものではない。","アトロピンは徐脈に対して用いられる薬剤であり、心室細動への対応として説明されるものではない。","（正解）遮断解除後に心室細動が持続する場合は、キシロカイン（1mg/kg）の投与やマグネシウム投与などを行う。","ジゴキシンは強心配糖体であり、心室細動への対応として説明される薬剤ではない。","ワルファリンは経口抗凝固薬であり、抗不整脈薬ではないため、この状況での投与は検討されない。"]},{"stem":"人工心肺の安全管理・トラブルシューティングに関する次のa〜eの記述のうち、正しいものの組み合わせはどれか？\na　送血圧が異常に上昇し血圧の左右差を伴う場合は、大動脈解離を疑う。\nb　患者へ気泡を誤送した場合は、直ちにトレンデレンブルグ体位（頭低位）をとる。\nc　陰圧補助脱血（VAVD）中に貯血槽内が陰圧になりすぎることが、脱血回路への気泡逆送の原因となる。\nd　ローラーポンプの回転数不足は、体外循環終了後などの予期しない逆流（脱血）の原因となる。\ne　人工肺手前圧単独で200 mmHg以上になれば、直ちに人工肺の交換を考慮すべきである。","choices":["a, b","a, e","b, c","c, d","d, e"],"correct":0,"expl":["（正解）a・bはいずれも正しい。aの大動脈解離の疑い、bのトレンデレンブルグ体位はいずれも標準的な対応として説明されている。","eは誤り。人工肺の交換を考慮する目安は、人工肺手前圧単独で400 mmHg以上、またはΔPが通常の2倍以上であり、200 mmHg以上ではない。","cは誤り。脱血回路への気泡逆送の原因は貯血槽内が「陽圧」になることであり、陰圧になりすぎることではない。","cが誤りであるため、この組み合わせは正しくない。dも誤り。回転数不足による予期しない逆流（脱血）は、後負荷（送血側圧力）に流量が依存する遠心ポンプ特有のリスクであり、閉塞回転による定量送血の仕組みを持つローラーポンプでは通常起こらない。","eが誤りであるため、この組み合わせは正しくない。dも誤り。回転数不足による予期しない逆流は遠心ポンプ特有のリスクであり、ローラーポンプでは通常起こらない。"]}]},{"title":"第12章：新生児・乳幼児","code":"ped","questions":[{"stem":"体重5kg以下の乳児の実際の循環血液量は、一般的に言われてきた80mL/kgに比べてどの程度と報告されているか？","choices":["40〜45 mL/kg","55〜60 mL/kg","90〜100 mL/kg","110〜120 mL/kg","130〜140 mL/kg"],"correct":1,"expl":["40〜45 mL/kgでは報告値より小さすぎる。","（正解）乳児では循環血液量は80mL/kgと言われてきたが、実際の測定では、体重5kg以下では55〜60mL/kgと、さらに小さいと報告されている。","90〜100 mL/kgは従来の80mL/kgよりも大きく、報告内容と逆方向の数値である。","110〜120 mL/kgはさらに過大である。","130〜140 mL/kgは明らかに過大である。"]},{"stem":"乳児期の体表面積あたりの人工心肺の至適灌流量の目安はどれか？","choices":["1.0〜1.5 L/分/m²","1.5〜2.0 L/分/m²","2.0〜2.5 L/分/m²","2.8〜3.2 L/分/m²","4.0〜4.5 L/分/m²"],"correct":3,"expl":["1.0〜1.5 L/分/m²は乳児の目安としては小さすぎ、むしろ低体温時（中枢温20℃前後）の灌流量に近い値である。","1.5〜2.0 L/分/m²も乳児の目安としては小さすぎる。","2.0〜2.5 L/分/m²は成人の標準的な至適灌流量の目安であり、乳児としては小さい。","（正解）乳児は基礎代謝量（体表面積あたりの酸素消費量）が大きいため、成人（2.0〜2.5 L/分/m²）に比べて多い2.8〜3.2 L/分/m²が用いられる。","4.0〜4.5 L/分/m²は明らかに大きすぎる。"]},{"stem":"チアノーゼ性心疾患（右左短絡）の体外循環において、灌流圧が低くなりやすい主な解剖学的要因はどれか？","choices":["大動脈弁が低形成であるため","体循環から肺循環への側副血行路が多いため","肺動脈が著しく細いため","左心室の容量が小さいため","冠動脈灌流量が過大であるため"],"correct":1,"expl":["大動脈弁の低形成は灌流圧低下の主な要因として一般的に説明されるものではない。","（正解）チアノーゼ性疾患は体循環から肺循環への側副血行路が多く、体血管床が豊富で灌流圧が低くなりやすいため、流量を多めに設定する必要がある。","肺動脈が著しく細いことは灌流圧低下の主な要因として一般的に説明されるものではない。","左心室の容量が小さいことは灌流圧低下の主な要因として一般的に説明されるものではない。","冠動脈灌流量が過大であることは灌流圧低下の要因として説明されるものではない。"]},{"stem":"動脈管開存（PDA）を合併している症例での人工心肺開始時の対応として正しいものはどれか？","choices":["大動脈遮断後に動脈管の結紮を行う","人工心肺開始直後に動脈管の結紮を行う","復温を開始してから動脈管の結紮を行う","人工心肺から離脱した後に動脈管の結紮を行う","心内修復が完全に終了してから結紮を行う"],"correct":1,"expl":["大動脈遮断後まで待つと、それまでの間送血が肺循環に逃げてしまい組織灌流不良を招く恐れがある。","（正解）動脈管が開存していると送血が肺循環に逃げてしまい、左室過伸展や組織灌流不良を起こすため、体外循環開始直後の自己心拍が認められる時に動脈管の結紮を行う。","復温を開始してからでは対応が遅く、その間の組織灌流不良や肺傷害のリスクが続くため不適切である。","人工心肺から離脱した後では、体外循環中の組織灌流不良を防げないため不適切である。","心内修復が完全に終了してからでは対応が遅すぎる。"]},{"stem":"新生児などの体外循環で用いられる「ポンプ脱血」の特徴として正しいものはどれか？","choices":["空気が混入すると直ちに脱血不良となる","落差脱血よりも手術台を高く上げる必要がある","落差をつけなくてもよく、空気が混入しても安定した脱血が得られる","脱血管が血管壁に当たっても溶血は起こらない","送血と脱血を1つのポンプのみで操作できる"],"correct":2,"expl":["空気が混入しても安定した脱血が得られる点がポンプ脱血の利点であり、直ちに脱血不良となるという説明は誤りである。","ポンプ脱血は落差をつけなくてもよいため、手術台を高く上げる必要はなく、この説明は誤りである。","（正解）ポンプ脱血は落差が不要で手術台を上げる必要がなく、多量の空気が混入しても安定した脱血が得られる。","脱血管が血管壁に当たると強陰圧がかかり溶血の原因になるため、この説明は誤りである。","送血と脱血の2つのポンプを操作しなければならないため熟練を要し、1つのポンプのみで操作できるという説明は誤りである。"]},{"stem":"乳幼児の無輸血体外循環中において、現在の精神運動発達調査の観点から安全とされるヘモグロビン（Hb）値の下限値（基準値）はどれか？","choices":["4 g/dL以上","5 g/dL以上","6 g/dL以上","10 g/dL以上","12 g/dL以上"],"correct":2,"expl":["4 g/dL以上は基準として低すぎる。","5 g/dL以上は過去に下限とされていた値だが、現在の基準としては低い。","（正解）過去には5g/dLが下限とされていたが、多施設研究で最低Hb値が6g/dL以下の群で発達指数が低い傾向にあったため、現在は最低Hb値を6g/dL以上に確保するようになっている。","10 g/dL以上は無輸血体外循環中の下限値としては高すぎる基準である。","12 g/dL以上はさらに高すぎる。"]},{"stem":"Fontan（フォンタン）手術後など、高心拍出状態があまり期待できない症例において、人工心肺離脱後（返血後）に目標とすべき安全下限Hb値の目安はどれか？","choices":["6 g/dL程度","7 g/dL程度","8〜9 g/dL程度","10 g/dL程度","12 g/dL程度"],"correct":3,"expl":["6 g/dL程度は目標値として低すぎる。","7 g/dL程度は高心拍出量が期待できる症例での目安であり、Fontan手術例の目標値としては低い。","8〜9 g/dL程度もFontan手術例の目標値としてはやや低い。","（正解）高心拍出量が期待できる症例は7g/dL程度でよいが、低心拍出状態が必至と考えられるFontan手術例などではHb値が10g/dL程度あったほうが良いとされる。","12 g/dL程度は目標値として高すぎる。"]},{"stem":"乳幼児の超低体温循環停止法において、目標とする鼻咽頭温および直腸（膀胱）温の目安は何度か？","choices":["25〜28℃","20〜25℃","15〜20℃","10〜15℃","5〜10℃"],"correct":2,"expl":["25〜28℃では超低体温循環停止法の目標温度としては高すぎる。","20〜25℃も目標温度としてはやや高い。","（正解）超低体温循環停止法では、送脱血の温度較差を5℃以内とし、鼻咽頭温および直腸（膀胱）温を15〜20℃まで低下させて循環を停止させる。","10〜15℃は目標温度としては低すぎる。","5〜10℃はさらに低すぎ、非現実的な設定である。"]},{"stem":"超低体温循環停止法の許容時間はおおむね何分までとされているか？","choices":["20分","40分","60分","90分","120分"],"correct":1,"expl":["20分では許容時間として短すぎる見積もりである。","（正解）頭部の氷による冷却も行うが、循環停止の許容時間はおおむね40分までとしている。","60分は許容時間として長すぎる見積もりである。","90分はさらに長すぎ、脳合併症などのリスクが著しく高まる。","120分は明らかに長すぎる見積もりである。"]},{"stem":"乳幼児の体外循環で血液充填（輸血充填）を行う際、体外循環開始直後の初期血圧低下（initial drop）を防ぐために行う処置はどれか？","choices":["血管拡張薬の事前投与","充填血液に対する血液濾過（HF）","急速な低体温の導入","カルシウムの大量投与","アルブミン製剤の完全除去"],"correct":1,"expl":["血管拡張薬の事前投与はinitial dropの予防処置として一般的に説明されるものではなく、むしろ血圧低下を助長する恐れがある。","（正解）保存血充填によるinitial dropや術後全身浮腫を防ぐため、体外循環前に充填血液に対して血液濾過（HF）を行い、電解質補正や有害物質の除去を行う。","急速な低体温の導入はinitial drop予防処置として一般的に説明されるものではない。","カルシウムの大量投与はinitial drop予防処置として一般的に説明されるものではない。","アルブミン製剤を完全に除去することはinitial drop予防処置として一般的に説明されるものではなく、膠質浸透圧の低下を招く恐れがある。"]},{"stem":"血液充填時のinitial drop（初期血圧低下）や術後浮腫の主な原因となる、強い血管拡張・透過性亢進作用を持つ物質はどれか？","choices":["エンドトキシン","ノルアドレナリン","ブラディキニン","トロンボキサンA2","アンジオテンシンII"],"correct":2,"expl":["エンドトキシンは敗血症性ショックなどに関与する物質であり、この文脈での主原因として説明されるものではない。","ノルアドレナリンは血管収縮作用を持つ物質であり、血管拡張・透過性亢進の原因物質としては誤りである。","（正解）血液が異物と接触してカリクレイン-キニン系が活性化されることで産生される「ブラディキニン」が、急激な血圧低下と血管透過性亢進の主原因と考えられている。","トロンボキサンA2は血小板凝集や血管収縮に関与する物質であり、この文脈での主原因として説明されるものではない。","アンジオテンシンIIは血管収縮作用を持つ物質であり、血管拡張・透過性亢進の原因物質としては誤りである。"]},{"stem":"体外循環終了直後に、送血管から脱血して血液濃縮器（HF膜）を通し、除水・濃縮しながら右房へ返血する方法の略称はどれか？","choices":["CUF","DUF","MUF","VAVD","SCUF"],"correct":2,"expl":["CUFという略称は一般的に用いられるものではない。","DUFという略称は一般的に用いられるものではない。","（正解）MUF（modified ultrafiltration）は、体外循環終了直後に送血管から脱血してHF膜を通し、除水・濃縮しながら静脈側（右房）に返血する方法で、血行動態や肺機能の改善に有効である。","VAVDは陰圧吸引補助脱血の略称であり、この血液濃縮法とは異なる。","SCUF（緩徐持続限外濾過）は主に体外循環中に持続的に行う限外濾過法を指し、この文脈で述べられている方法の略称ではない。"]},{"stem":"MUF（Modified Ultrafiltration）を施行する際、盗血現象による脳血流の減少や脳酸素飽和度の低下を防ぐために、流量は最大でもどれ以下にすべきとされているか？","choices":["10 mL/分/kg","20 mL/分/kg","40 mL/分/kg","60 mL/分/kg","80 mL/分/kg"],"correct":1,"expl":["10 mL/分/kgでは基準として厳しすぎる（低すぎる）。","（正解）MUF流量を20mL/分/kg以上にすると盗血現象により脳血流と脳混合静脈血酸素飽和度の減少をきたすため、それ以下の流量で行う必要がある。","40 mL/分/kgは基準として高すぎる。","60 mL/分/kgはさらに高すぎる。","80 mL/分/kgは明らかに高すぎる。"]},{"stem":"ローラーポンプを用いずに、壁吸引等を利用して貯血槽に一定の陰圧をかけ、その陰圧で術野吸引やベントを行う「低圧持続吸引方式」の最大の利点はどれか？","choices":["回路充填量がゼロになる","吸引による赤血球破壊（溶血）が少ない","血液が凝固しない","脱血カニューレが不要になる","ヘパリン投与が不要になる"],"correct":1,"expl":["回路充填量がゼロになるという効果は低圧持続吸引方式の利点として説明されるものではない。","（正解）低圧持続吸引方式は設定した陰圧以上の強陰圧がかからないため、ローラーポンプ吸引に比べて赤血球破壊による溶血が少ないのが最大の利点である。","血液が凝固しなくなるという効果は低圧持続吸引方式の利点として説明されるものではない。","脱血カニューレが不要になるという効果は低圧持続吸引方式の利点として説明されるものではない。","ヘパリン投与が不要になるという効果は低圧持続吸引方式の利点として説明されるものではない。"]},{"stem":"左室の小さい疾患（Fallot四徴症や総肺静脈還流異常症など）で、適正な心拍出量を得るために心拍数を上げる目的で用いられる手段はどれか？","choices":["イソプロテレノールの大量投与","大動脈バルーンパンピング（IABP）","一時的な心房ペーシング","アトロピンの持続静注","ジゴキシンの急速飽和投与"],"correct":2,"expl":["イソプロテレノールの大量投与よりも一時的な心房ペーシングを用いることが一般的とされる。","大動脈バルーンパンピング（IABP）は小児領域では一般的に用いられる手段ではなく、心拍数を上げる目的の手段としても説明されない。","（正解）左室の小さい疾患では心拍数を上げて心拍出量を確保する必要があるが、薬剤（イソプロテレノール）を使用するよりも一時的な心房ペーシングを使用することが一般的である。","アトロピンの持続静注はこの目的で用いられる一般的な手段として説明されるものではない。","ジゴキシンの急速飽和投与は強心配糖体の使用法であり、この目的で用いられる一般的な手段として説明されるものではない。"]},{"stem":"乳幼児の体外循環における中枢温と至適灌流量の組み合わせとして正しいのはどれか？","choices":["中枢温25℃：2.0〜2.5 L/分/m²、中枢温20℃：1.0〜1.5 L/分/m²","中枢温25℃：1.0〜1.5 L/分/m²、中枢温20℃：2.0〜2.5 L/分/m²","中枢温25℃：2.8〜3.2 L/分/m²、中枢温20℃：2.0〜2.5 L/分/m²","中枢温25℃：1.5〜2.0 L/分/m²、中枢温20℃：0.5〜1.0 L/分/m²","中枢温25℃：3.0〜3.5 L/分/m²、中枢温20℃：2.5〜3.0 L/分/m²"],"correct":0,"expl":["（正解）低体温では生体の酸素需要が減少するため灌流量を減らすことができ、灌流量は中枢温25℃で2.0〜2.5 L/分/m²、20℃で1.0〜1.5 L/分/m²とされている。","温度と流量の対応関係が逆になっており誤りである。低体温になるほど灌流量は少なくなる。","いずれの数値も実際の目安より過大である。","中枢温20℃での0.5〜1.0 L/分/m²は実際の目安より少なすぎる。","いずれの数値も実際の目安より過大である。"]},{"stem":"新生児・乳児の体液分布の特徴とそれに伴う留意点として正しいのはどれか？","choices":["細胞外液量の割合が成人より大きく、水分出納の不均衡により脱水や浮腫を来しやすい","細胞外液量の割合が成人より小さく、水分管理は成人ほど厳密でなくてよい","循環血液量の体重換算値は成人よりも大きく、輸血の必要性は低い","体表面積あたりの酸素消費量は成人より小さく、灌流量は少なめでよい","細胞内液量の割合が成人より大きいため、心筋保護液の組成を変更する必要がある"],"correct":0,"expl":["（正解）新生児・乳児の細胞外液量の割合は成人に比し大きいことが特徴であり、水分出納のバランスの不均衡が容易に脱水や浮腫を作りうる。","細胞外液量の割合は成人より小さいのではなく大きく、この記述は誤りである。","乳児の循環血液量は体重あたりでは成人と同程度〜やや多い程度とされ、輸血の必要性が低いという記述は誤りである（むしろ充填に対する割合が小さく血液充填が必要となりやすい）。","乳児は基礎代謝量（体表面積あたりの酸素消費量）が成人より大きく、灌流量は成人より多く設定する必要があるため、この記述は誤りである。","心筋保護液の組成変更が必要とする一般的な説明はなく、この記述は誤りである。"]},{"stem":"新生児・乳幼児の体外循環に関する次のa〜eの記述のうち、正しいものの組み合わせはどれか？\na　体重5kg以下の乳児の循環血液量は、従来言われてきた80mL/kgより小さい55〜60mL/kgと報告されている。\nb　チアノーゼ性心疾患では体循環から肺循環への側副血行路が多く、灌流圧が低くなりやすい。\nc　超低体温循環停止法の許容時間はおおむね90分までとされる。\nd　MUF施行時の流量は、盗血現象を防ぐため40mL/分/kg以下にすべきとされる。\ne　乳幼児の無輸血体外循環中に安全とされるHb値の下限は4 g/dL以上である。","choices":["a, b","a, e","b, c","c, d","d, e"],"correct":0,"expl":["（正解）a・bはいずれも正しい。aの循環血液量55〜60mL/kg、bの側副血行路による灌流圧低下はいずれも本文の記載と一致する。","eは誤り。無輸血体外循環中に安全とされるHb値の下限は6 g/dL以上であり、4 g/dL以上ではない。","cは誤り。超低体温循環停止法の許容時間はおおむね40分までとされ、90分ではない。","cが誤りであるため、この組み合わせは正しくない。dも誤り。MUF施行時に盗血現象を防ぐため流量を抑えるべき基準は20mL/分/kg以下であり、40mL/分/kg以下では不十分（甘すぎる基準）である。","eが誤りであるため、この組み合わせは正しくない。dも誤り。MUF流量の基準は20mL/分/kg以下であり、40mL/分/kg以下では不十分である。"]}]},{"title":"第13章：胸部大動脈手術","code":"aortic","questions":[{"stem":"弓部大動脈から分枝する3本の動脈の正しい順番（中枢側から末梢側へ）はどれか？","choices":["左総頸動脈 → 左鎖骨下動脈 → 腕頭動脈","腕頭動脈 → 左鎖骨下動脈 → 左総頸動脈","腕頭動脈 → 左総頸動脈 → 左鎖骨下動脈","左鎖骨下動脈 → 左総頸動脈 → 腕頭動脈","左総頸動脈 → 腕頭動脈 → 左鎖骨下動脈"],"correct":2,"expl":["分枝の順序が誤っている。","左鎖骨下動脈と左総頸動脈の順序が入れ替わっており誤りである。","（正解）弓部大動脈では中枢側から順に、腕頭動脈、左総頸動脈、左鎖骨下動脈が分枝する。","順序が全く逆になっており誤りである。","腕頭動脈と左総頸動脈の順序が入れ替わっており誤りである。"]},{"stem":"脊髄の血行に重要な役割を果たす、第8胸椎から第3腰椎にかけての肋間動脈または腰動脈から分枝する「大前根動脈」の名称はどれか？","choices":["Adamkiewicz動脈","脊髄前動脈","後脊髄動脈","椎骨動脈","肋間下動脈"],"correct":0,"expl":["（正解）第8胸椎から第3腰椎にかけての肋間動脈または腰動脈から分枝し、頭部からの前脊髄動脈と交通して脊髄の血行に重要な役割を果たす大前根動脈は、Adamkiewicz（アダムキュービッツ）動脈と呼ばれる。","脊髄前動脈はAdamkiewicz動脈と交通する脊髄表面を走行する動脈であり、この大前根動脈自体の名称ではない。","後脊髄動脈も脊髄表面を走行する動脈であり、この大前根動脈の名称ではない。","椎骨動脈は頸部で脳への血流を担う動脈であり、胸腰椎レベルの肋間動脈・腰動脈から分枝するこの大前根動脈の名称ではない。","肋間下動脈という名称は、この大前根動脈を指す一般的な呼称ではない。"]},{"stem":"急性大動脈解離において、大腿動脈を送血路に選択した場合に懸念される重大な合併症はどれか？","choices":["左室の過伸展","偽腔灌流や粥腫の飛散による臓器灌流障害","肺動脈の破裂","上大静脈症候群","末梢動脈の急性閉塞のみ"],"correct":1,"expl":["左室の過伸展は動脈管開存など先天性心疾患で問題となる病態であり、大腿動脈送血の合併症として一般的に説明されるものではない。","（正解）大腿動脈送血は逆行性送血となるため、急性解離では真腔を圧迫する偽腔灌流を引き起こしたり、壁在血栓の飛散による脳塞栓などを生じる懸念がある。","肺動脈の破裂は大腿動脈送血の合併症として一般的に説明されるものではない。","上大静脈症候群は静脈系の問題であり、動脈送血路の選択に伴う合併症として説明されるものではない。","末梢動脈の急性閉塞のみという説明は不十分であり、最も懸念される合併症は偽腔灌流や臓器灌流障害である。"]},{"stem":"大動脈解離の際、右鎖骨下動脈を送血路として使用する最大の利点はどれか？","choices":["順行性灌流が得られ、ほとんどの症例で真腔灌流が可能であること","カニューレの挿入が最も容易で短時間で行えること","どんなに高い送血圧をかけても血管が損傷しないこと","局所麻酔のみでカニュレーションが完了すること","脳分離体外循環が不要になること"],"correct":0,"expl":["（正解）右鎖骨下動脈送血は順行性灌流が得られる点や、解離症例においてほとんどの症例で真腔灌流が得られる点が大きな利点である。","カニューレの挿入が最も容易で短時間で行えるという点は、右鎖骨下動脈送血の最大の利点として説明されるものではない。","高い送血圧でも血管が損傷しないという説明は誤りであり、過大な送血圧は血管損傷のリスクとなる。","局所麻酔のみでカニュレーションが完了するという説明は一般的ではない。","脳分離体外循環が不要になるという説明は右鎖骨下動脈送血の利点として一般的に説明されるものではない。"]},{"stem":"広範囲弓部大動脈瘤の手術において用いられる「FET（frozen elephant trunk）法」の合併症として、比較的発症率が高いと問題視されているものはどれか？","choices":["肝不全","脊髄損傷（対麻痺）","腸管虚血","肺塞栓症","急性腎不全"],"correct":1,"expl":["肝不全はFET法の合併症として比較的発症率が高いと問題視されているものとして一般的に説明されるものではない。","（正解）FET法は末梢側のエントリー閉鎖や一期的な治療が可能である反面、脊髄損傷の合併率が比較的高いことが問題点とされている。","腸管虚血はFET法の合併症として比較的発症率が高いと問題視されているものとして一般的に説明されるものではない。","肺塞栓症はFET法の合併症として比較的発症率が高いと問題視されているものとして一般的に説明されるものではない。","急性腎不全はFET法の合併症として比較的発症率が高いと問題視されているものとして一般的に説明されるものではない。"]},{"stem":"選択的脳灌流法（SCP）において、一般的な至適灌流温（鼻咽頭温）の目安はどれか？","choices":["15〜18℃","20〜23℃","25〜28℃","32〜35℃","36〜37℃"],"correct":2,"expl":["15〜18℃はSCPの灌流温の目安としては低すぎる。","20〜23℃も目安としてはやや低い。","（正解）SCPの送血条件は、一般的に灌流温25〜28℃で行われる。","32〜35℃は目安としては高すぎる。","36〜37℃は常温に近く、SCPの目安としては明らかに高すぎる。"]},{"stem":"胸部大動脈手術における選択的脳灌流法（SCP）のうち、腕頭動脈（右鎖骨下動脈・右総頸動脈）のみから送血し、Willis動脈輪を介した側副血行により対側（左半球）への灌流を期待する方法を何と呼ぶか？","choices":["両側選択的脳灌流（bilateral SCP）","一側性選択的脳灌流（unilateral SCP）","逆行性脳灌流法（RCP）","順行性大動脈灌流法","超低体温循環停止法単独"],"correct":1,"expl":["誤り。両側選択的脳灌流（bilateral SCP）は腕頭動脈系と左総頸動脈系の双方に個別にカニューレを挿入して送血する方法であり、Willis動脈輪の側副血行に依存する方法ではない。","（正解）腕頭動脈のみから送血し、Willis動脈輪を介した側副血行により対側（左半球）への灌流を期待する方法を一側性選択的脳灌流（unilateral SCP）と呼ぶ。手技が単純である一方、Willis動脈輪の発達が不十分な症例では対側の脳虚血リスクがある。","誤り。逆行性脳灌流法（RCP）は上大静脈側から逆行性に灌流する方法であり、腕頭動脈からの順行性送血とは異なる。","誤り。順行性大動脈灌流法という用語はSCPの分類として一般的に用いられるものではない。","誤り。超低体温循環停止法単独は、SCPなどの脳灌流を行わずに低体温のみで脳保護を図る方法であり、腕頭動脈からの送血を伴う方法ではない。"]},{"stem":"弓部大動脈手術において、選択的脳灌流法（SCP）へ切り替える一般的なタイミングはどれか？","choices":["手術開始（皮膚切開）と同時に","人工心肺開始・全身冷却の完了前","全身冷却が完了し、大動脈を切離して頭部分枝に送血カニューレを挿入した時点","大動脈遮断解除後、復温が完了した時点","手術終了直前、閉胸操作の直前"],"correct":2,"expl":["誤り。手術開始と同時にSCPへ切り替えることはなく、まず人工心肺を確立し全身を冷却する。","誤り。全身冷却が完了する前にSCPへ切り替えると、目標体温に達しないまま循環停止に移行することになり不適切である。","（正解）全身の冷却が完了した後、上行大動脈・弓部を切離して頭部分枝（腕頭動脈など）に送血カニューレを挿入した時点でSCPへ切り替える。","誤り。大動脈遮断解除・復温はSCP終了後、吻合完了後に行う操作であり、SCP開始のタイミングではない。","誤り。手術終了直前はすでにSCP・循環停止を終えて全身灌流を再開している段階であり、SCP開始のタイミングではない。"]},{"stem":"選択的脳灌流法（SCP）の施行中、左右の脳灌流バランスに偏りがないかを確認するために有用なモニターはどれか？","choices":["NIRS（近赤外線分光法）","BISモニター","経胸壁心エコー（TTE）","肺動脈カテーテル","心拍出量モニター（サーモダイリューション法）"],"correct":0,"expl":["（正解）SCP施行中は左右の脳灌流に偏りが生じることがあるため、左右前頭部にプローブを装着したNIRSで局所脳酸素飽和度を左右比較しながらモニターし、灌流バランスの調整に役立てる。","BISモニターは麻酔深度（脳波）を評価するモニターであり、左右の脳灌流バランスの確認を目的としたものではない。","経胸壁心エコー（TTE）は心臓の評価に用いられ、脳灌流バランスの確認を目的としたモニターではない。","肺動脈カテーテルは肺動脈圧や心拍出量の評価に用いられ、脳灌流バランスの確認を目的としたものではない。","心拍出量モニター（サーモダイリューション法）は全身循環動態の評価に用いられ、左右脳灌流バランスの局所的な確認を目的としたものではない。"]},{"stem":"逆行性脳灌流法（RCP）における灌流量は静脈弁の存在などにより個体差が大きいとされるが、一般的な目安として最も近いものはどれか？","choices":["10〜30 mL/分","50〜100 mL/分","200〜400 mL/分","1000〜1500 mL/分","2000 mL/分以上"],"correct":2,"expl":["誤り。10〜30 mL/分では灌流量として少なすぎ、脳灌流としての効果が期待できない。","誤り。50〜100 mL/分もRCPの一般的な灌流量の目安としては少ない。","（正解）RCPでは上大静脈からの灌流量は静脈弁の存在などにより個体差が大きいが、一般的には200〜400 mL/分程度が目安とされる。","誤り。1000〜1500 mL/分はRCPの灌流量としては明らかに過大であり、内頸静脈圧の過上昇や脳浮腫を招く恐れがある。","誤り。2000 mL/分以上はさらに過大であり、RCPの一般的な灌流量の目安ではない。"]},{"stem":"左後側方開胸による弓部置換術において、下半身を灌流した冷たい静脈血を右房から逆行性に脳へ送ることで脳保護を行う手法（高本法）はどれか？","choices":["選択的脳灌流法（SCP）","逆行性脳灌流法（RCP）","超低体温循環停止法単独","順行性脳灌流法","選択的冠灌流法"],"correct":1,"expl":["選択的脳灌流法（SCP）は頭部分枝から個別に順行性に灌流する方法であり、高本法とは異なる。","（正解）高本法では、下半身を灌流して右房に還流した高酸素飽和度の冷たい静脈血を、中心静脈圧15mmHg程度に維持して逆行性脳灌流（RCP）として用いる。","超低体温循環停止法単独では脳への血流供給がなく、高本法とは異なる。","順行性脳灌流法は高本法とは逆方向の灌流であり、この手法を指すものではない。","選択的冠灌流法は心筋保護のための灌流法であり、脳保護を目的とした高本法とは異なる。"]},{"stem":"胸部下行大動脈置換術で用いられる「部分体外循環（大腿静脈-大腿動脈バイパス法）」において、脱血カニューレの先端はどこに留置することが基本か？","choices":["肝静脈","右心房","右心室","肺動脈","下大静脈入口部"],"correct":1,"expl":["肝静脈への留置は基本的な留置部位として説明されるものではない。","（正解）大腿静脈から挿入した脱血管の先端は、経食道エコーで確認しながら右心房に留置する。","右心室への留置は一般的な脱血管の留置部位として説明されるものではない。","肺動脈への留置は一般的な脱血管の留置部位として説明されるものではない。","下大静脈入口部への留置は基本的な留置部位として一般的に説明されるものではない。"]},{"stem":"胸部下行大動脈の部分体外循環中、大動脈遮断による心臓の「後負荷」の増大を防ぐため、遮断中枢側の収縮期圧の上昇はどれくらい以内に保つべきか？","choices":["20〜30 mmHg以内","50〜60 mmHg以内","80〜100 mmHg以内","変動させない（0 mmHg）","10〜15 mmHg以内"],"correct":0,"expl":["（正解）大動脈遮断後は心臓の後負荷増大を防ぐため、遮断中枢側の収縮期圧の上昇を20〜30 mmHg以内に保つように流量を調節する。","50〜60 mmHg以内は許容範囲として大きすぎる。","80〜100 mmHg以内はさらに大きすぎる。","圧上昇を全く許容しない（0 mmHg）という管理は現実的ではなく、一般的に説明される基準ではない。","10〜15 mmHg以内は基準として厳しすぎる。"]},{"stem":"胸部下行大動脈の部分体外循環中、腹部臓器や下肢への血流を維持するため、遮断末梢側の血圧は最低何mmHg以上に保つべきか？","choices":["20 mmHg以上","40 mmHg以上","60 mmHg以上","100 mmHg以上","80 mmHg以上"],"correct":2,"expl":["20 mmHg以上では基準として低すぎる。","40 mmHg以上も基準としては低い。","（正解）肝臓・腎臓・脊髄などの主要臓器の灌流障害を防止するため、遮断末梢側の血圧は60 mmHg以上に保つようにする。","100 mmHg以上は基準として高すぎる。","80 mmHg以上も基準としてはやや高い。"]},{"stem":"胸腹部大動脈手術における「脊髄虚血（対麻痺）」の予防対策として「含まれない」ものはどれか？","choices":["脳脊髄液ドレナージ","Adamkiewicz動脈の同定と肋間動脈再建","術中MEP・SEPのモニター","全身の高度高体温化","軽度〜中等度低体温の併用"],"correct":3,"expl":["脳脊髄液ドレナージは脊髄虚血の予防対策の一つとして含まれる。","Adamkiewicz動脈の同定と肋間動脈再建も脊髄虚血の予防対策の一つとして含まれる。","術中MEP・SEPのモニターも脊髄虚血の予防対策の一つとして含まれる。","（正解）脊髄虚血の対策には、Adamkiewicz動脈の同定、脳脊髄液ドレナージ、低体温、肋間動脈再建、MEP/SEPモニターなどが含まれる。高体温は虚血を助長するため、予防対策には含まれない。","軽度〜中等度低体温の併用も脊髄虚血の予防対策の一つとして含まれる。"]},{"stem":"胸腹部大動脈の置換中に腹部主要臓器（腹腔動脈、上腸間膜動脈、腎動脈など）を選択的に灌流する場合、各分枝あたりの至適灌流量の目安はどれか？","choices":["10〜30 mL/分","50〜100 mL/分","150〜250 mL/分","500〜800 mL/分","1000〜1500 mL/分"],"correct":2,"expl":["10〜30 mL/分では目安としては少なすぎる。","50〜100 mL/分も目安としてはやや少ない。","（正解）明確な指標はないが、一般的に各分枝あたり150〜250 mL/分を想定してポンプによる選択的灌流が行われる。","500〜800 mL/分は目安としては多すぎる。","1000〜1500 mL/分は明らかに過大である。"]},{"stem":"胸腹部大動脈手術中の「腎保護」として、カニューレから直接灌流して冷却するために用いられる液はどれか？","choices":["37℃の血液","4℃の乳酸リンゲル液","20℃の5%ブドウ糖液","37℃の生理食塩水","4℃の生理食塩水"],"correct":1,"expl":["37℃の血液は保温された血液であり、腎冷却を目的とした灌流液としては説明されない。","（正解）腎保護の目的で、4℃の乳酸リンゲル液などの低温晶質液を直接腎動脈に灌流する方法がとられる。","20℃の5%ブドウ糖液は腎保護のための冷却灌流液として一般的に説明されるものではない。","37℃の生理食塩水は保温された液であり、腎冷却を目的とした灌流液としては説明されない。","4℃の生理食塩水は低温だが、腎保護のための灌流液として一般的に説明されるのは乳酸リンゲル液である。"]},{"stem":"胸部大動脈手術に関する次のa〜eの記述のうち、正しいものの組み合わせはどれか？\na　弓部大動脈は中枢側から腕頭動脈、左総頸動脈、左鎖骨下動脈の順に分枝する。\nb　Adamkiewicz動脈は第8胸椎から第3腰椎にかけての肋間動脈または腰動脈から分枝する。\nc　選択的脳灌流法（SCP）の至適灌流量は30〜50 mL/分/kgとされる。\nd　逆行性脳灌流法（RCP）では内頸静脈圧を50 mmHg以下に保つよう管理する。\ne　左心バイパス法は一般に300単位/kgのヘパリンを投与し、ACT 480秒以上を維持して行う。","choices":["a, b","a, e","b, c","c, d","d, e"],"correct":0,"expl":["（正解）a・bはいずれも正しい。aの弓部大動脈の分枝順序、bのAdamkiewicz動脈の分枝高さはいずれも本文の記載と一致する。","eは誤り。左心バイパス法は一般に100単位/kgのヘパリン投与、ACT 180〜200秒の管理であり、300単位/kg・ACT 480秒以上は通常の完全体外循環の基準である。","cは誤り。SCPの至適灌流量は10〜15 mL/分/kgであり、30〜50 mL/分/kgではない。","cが誤りであるため、この組み合わせは正しくない。dも誤り。RCPでは脳浮腫を防ぐため内頸静脈圧（中心静脈圧）は20〜25 mmHg程度以下に保つ必要があり、50 mmHg以下では基準として緩すぎる。","eが誤りであるため、この組み合わせは正しくない。dも誤り。内頸静脈圧の管理目標は20〜25 mmHg程度以下であり、50 mmHg以下では不十分である。"]}]},{"title":"第14章：特殊な体外循環（MICSなど）","code":"spec","questions":[{"stem":"現在のMICS（低侵襲心臓手術）において、大腿静脈からの「1本脱血」で十分な脱血量を獲得するために、一般的に併用される補助手段はどれか？","choices":["遠心ポンプによるKAVD（ポンプ補助脱血）","VAVD（陰圧吸引補助脱血）","肺動脈ベントの追加","落差2m以上の確保","脱血カニューレの追加のみで対応する"],"correct":1,"expl":["「KAVD」という補助手段の名称は一般的に用いられるものではない。","（正解）カニューレの進歩に加え、VAVD（陰圧吸引補助脱血）などの脱血補助を用いることにより、大腿静脈1本脱血でも十分な脱血量を確保できるようになっている。","肺動脈ベントの追加は脱血量確保のための補助手段として一般的に説明されるものではない。","落差2m以上の確保は非現実的であり、一般的な手段として説明されるものではない。","脱血カニューレの追加のみという説明は、MICSにおいて広く用いられる補助手段（VAVD）を反映していない。"]},{"stem":"MICSやロボット手術において、末梢血管（大腿動脈など）から送血を行う際、下肢の血流低下（虚血）を監視するために用いられるモニターはどれか？","choices":["BISモニター","経食道エコー（TEE）","NIRS（近赤外線分光法）","肺動脈カテーテル","心拍出量モニター（サーモダイリューション法）"],"correct":2,"expl":["BISモニターは麻酔深度を評価するモニターであり、下肢虚血の監視を目的としたものではない。","経食道エコー（TEE）は心臓や大血管の評価に用いられ、下肢虚血の直接的な監視を目的としたモニターではない。","（正解）送脱血カニューレによる下肢阻血や鬱血を監視するため、NIRS（近赤外線分光法）を用いて酸素化ヘモグロビンと還元ヘモグロビンの濃度変化を計測する。","肺動脈カテーテルは肺動脈圧や心拍出量の評価に用いられ、下肢虚血の監視を目的としたものではない。","心拍出量モニター（サーモダイリューション法）は全身の循環動態評価に用いられ、下肢局所の虚血監視を目的としたものではない。"]},{"stem":"MICSの僧帽弁形成術において、弁の逆流を確認する「水試験」中に、誤って冠動脈へ空気が流入するなどの心筋障害を防ぐための対策として適切なものはどれか？","choices":["逆行性心筋保護を最大流量で注入し続ける","VAVDの陰圧を最大にする","順行性心筋保護液注入を行い、大動脈基部圧を左室圧より高く保ち大動脈弁を閉鎖位に保つ","肺への人工呼吸を再開する","送血流量を最大にして左室内圧を上昇させる"],"correct":2,"expl":["逆行性心筋保護を最大流量で注入し続ける対応は、水試験中の心筋障害防止策として一般的に説明されるものではない。","VAVDの陰圧を最大にする対応は水試験中の心筋障害防止策として一般的に説明されるものではない。","（正解）水試験中の心筋障害防止策として、順行性心筋保護液注入を行い、（大動脈基部圧）＞（左室圧）の関係を保ち大動脈弁を閉鎖位に保つ方法がある。","肺への人工呼吸を再開する対応は水試験中の心筋障害防止策として一般的に説明されるものではない。","送血流量を最大にして左室内圧を上昇させる対応は、大動脈弁を開放させ空気の冠動脈への流入を助長する恐れがあり不適切である。"]},{"stem":"体外循環を使用せず、心臓が拍動した状態のままで冠動脈バイパス術を行う術式の略称はどれか？","choices":["TAVR","OPCAB","MIDCAB","TEVAR","PCI"],"correct":1,"expl":["TAVRは経カテーテル的大動脈弁置換術の略称であり、心拍動下冠動脈バイパス術を指すものではない。","（正解）OPCAB（off-pump CABG）は、人工心肺（体外循環）を使用せずに心拍動下で行う冠動脈バイパス術である。","MIDCABは小切開による低侵襲冠動脈バイパス術を指す略称であり、体外循環を使用しない拍動下手術一般を指す略称ではない。","TEVARは胸部大動脈のステントグラフト内挿術の略称であり、冠動脈バイパス術を指すものではない。","PCIは経皮的冠動脈形成術（カテーテル治療）の略称であり、外科的バイパス術を指すものではない。"]},{"stem":"TAVR（経カテーテル的大動脈弁置換術）の手技中に血行動態が破綻し、PCPS（V-A ECMO）の緊急導入が必要となる代表的な合併症はどれか？","choices":["弁輪破裂や心タンポナーデ","軽度の弁周囲逆流","一過性の徐脈","穿刺部の軽度皮下血腫","軽度の造影剤アレルギー"],"correct":0,"expl":["（正解）弁輪破裂や、それに伴う心タンポナーデ・大動脈損傷などは急激な血行動態破綻を来しうるため、あらかじめPCPS（V-A ECMO）用のシースを留置しておくなど緊急導入への備えが重要である。","軽度の弁周囲逆流は経過観察や追加拡張で対応可能なことが多く、直ちにPCPSを要する血行動態破綻の代表例ではない。","一過性の徐脈はペーシングなどで対応可能なことが多く、PCPSの緊急導入を要する代表例として説明されるものではない。","穿刺部の軽度皮下血腫は局所の合併症であり、血行動態破綻をきたしPCPSを要するものではない。","軽度の造影剤アレルギーは対症療法で対応することが多く、PCPSの緊急導入を要する代表例として説明されるものではない。"]},{"stem":"カテーテルを用いて僧帽弁の前尖・後尖をクリップで把持し、僧帽弁接合不全（MR）を軽減する経皮的僧帽弁接合不全修復術に用いられるデバイス（術式）の名称はどれか？","choices":["MitraClip","TAVR","Watchman","TEVAR","Impella"],"correct":0,"expl":["（正解）MitraClipは、カテーテルを用いて僧帽弁の前尖・後尖をクリップで把持し、接合不全（MR）を軽減する経皮的僧帽弁接合不全修復術に用いられるデバイスである。なお、弁輪拡大が強く把持が困難な症例では、IABPを併用することで隙間（gap）が改善し把持の補助となることが報告されている。","TAVRは大動脈弁狭窄症に対する経カテーテル的大動脈弁置換術であり、僧帽弁の手技ではない。","Watchmanは心房細動患者の左心耳を閉鎖し脳梗塞を予防するデバイスであり、僧帽弁の手技ではない。","TEVARは胸部大動脈瘤に対するステントグラフト内挿術であり、僧帽弁の手技ではない。","Impellaは経皮的に左室から大動脈へ送血する補助循環用ポンプカテーテルであり、僧帽弁の手技ではない。"]},{"stem":"心大血管領域における「ハイブリッド治療」の組み合わせとして適切でないものはどれか？","choices":["弓部大動脈置換術（elephant trunk法）＋ 二期的ステントグラフト内挿術（TEVAR）","小切開冠動脈バイパス術（MIDCAB）＋ 経皮的冠動脈形成術（PCI）","V-A ECMO ＋ Impella（ECPELLA）","OPCAB（心拍動下冠動脈バイパス術）単独での施行","外科的大動脈弁置換術（SAVR）＋ 冠動脈バイパス術（CABG）の同時手術"],"correct":3,"expl":["弓部置換とelephant trunk法・二期的TEVARの組み合わせは、外科的手技とカテーテル治療を組み合わせたハイブリッド手術の代表例である。","MIDCABとPCIを組み合わせて完全血行再建を目指す治療もハイブリッド手術の代表例である。","V-A ECMOとImpellaを組み合わせるECPELLAも、循環補助における広義のハイブリッド治療として挙げられる。","（正解）OPCAB単独での施行は、体外循環を用いない拍動下冠動脈バイパス術という単一の外科手技であり、複数の治療法を組み合わせる「ハイブリッド治療」には該当しない。","SAVRとCABGの同時手術も、複数の外科的治療を組み合わせて行う点でハイブリッド手術の一種として説明される。"]},{"stem":"ロボット支援下心臓手術（ダビンチ手術）の脱血において、右大腿静脈脱血に追加して推奨される脱血部位はどこか？","choices":["肺動脈","右内頸静脈","冠静脈洞","鎖骨下静脈","左内頸静脈"],"correct":1,"expl":["肺動脈は脱血部位として一般的に説明されるものではない。","（正解）ダビンチ手術では、右大腿静脈からの脱血に加え、右内頸静脈からPCPS用送血管を代用して挿入する脱血法が推奨されている。","冠静脈洞は逆行性心筋保護液注入に用いられる部位であり、この追加脱血部位として一般的に説明されるものではない。","鎖骨下静脈は追加脱血部位として一般的に説明されるものではない。","左内頸静脈ではなく右内頸静脈が推奨される部位である。"]},{"stem":"ヘパリン起因性血小板減少症（HIT）は、ヘパリンと何という血小板内物質が複合体を形成し、それに対する自己抗体ができることで発症するか？","choices":["トロンボキサンA2","血小板第4因子（PF4）","セロトニン","トロンボポエチン","フィブリノゲン"],"correct":1,"expl":["トロンボキサンA2は血小板凝集や血管収縮に関与する物質であり、HITの複合体形成に関与する物質としては説明されない。","（正解）ヘパリンを投与すると血小板第4因子（PF4）とヘパリンの複合体が形成され、それを抗原とみなして自己抗体が産生されることでHITが発症する。","セロトニンは血小板顆粒に含まれる物質だが、HITの複合体形成に関与する物質としては説明されない。","トロンボポエチンは血小板産生を促進するホルモンであり、HITの複合体形成に関与する物質としては説明されない。","フィブリノゲンは凝固因子であり、HITの複合体形成に関与する物質としては説明されない。"]},{"stem":"HITの診断に用いられる臨床的な評価スコア「4Tsスコア」に含まれない項目はどれか？","choices":["血小板の減少（Thrombocytopenia）","血小板減少のタイミング（Timing）","血栓症（Thrombosis）","体温の上昇（Temperature）","他の血小板減少原因の除外（oTher causes）"],"correct":3,"expl":["血小板の減少（Thrombocytopenia）は4Tsスコアの項目の一つである。","血小板減少のタイミング（Timing）も4Tsスコアの項目の一つである。","血栓症（Thrombosis）も4Tsスコアの項目の一つである。","（正解）4Tsスコアは、Thrombocytopenia（血小板の減少）、Timing（タイミング）、Thrombosis（血栓症）、oTher causes（他に説明のつかない血小板減少の除外）の4項目からなり、体温の上昇（Temperature）は含まれない。","他の血小板減少原因の除外（oTher causes）は4Tsスコアの項目の一つである。"]},{"stem":"HIT抗体陽性患者で緊急に体外循環が必要な場合、血栓塞栓を防ぐために強力な血小板凝集抑制薬を大量に持続点滴しながら通常のヘパリンを使用する方法がある。この時用いられる薬剤はどれか？","choices":["アスピリン","エポプロステノール（PGI2）","ワルファリン","ウロキナーゼ","クロピドグレル"],"correct":1,"expl":["アスピリンは経口の抗血小板薬であり、この文脈で持続点滴により用いられる薬剤として説明されるものではない。","（正解）HIT抗体陽性例に対し、エポプロステノール（PGI2）を大量に持続点滴して血小板凝集を徹底的に抑えた状態でヘパリンを使用し、人工心肺を行う方法が報告されている。","ワルファリンは経口抗凝固薬であり、この文脈で持続点滴により用いられる薬剤として説明されるものではない。","ウロキナーゼは血栓溶解薬であり、この文脈で用いられる血小板凝集抑制薬として説明されるものではない。","クロピドグレルは経口の抗血小板薬であり、この文脈で持続点滴により用いられる薬剤として説明されるものではない。"]},{"stem":"活動期感染性心内膜炎で脳出血を合併している症例などにおいて、ヘパリンの使用量を減らしつつ体外循環を維持するために併用される薬剤はどれか？","choices":["アルガトロバン","硫酸プロタミン","メシル酸ナファモスタット（フサン）","カルペリチド（ハンプ）","ダビガトラン"],"correct":2,"expl":["アルガトロバンは主にHIT症例で用いられる抗凝固薬であり、この文脈で述べられている薬剤としては説明されない。","硫酸プロタミンはヘパリンを中和する薬剤であり、ヘパリン減量下での体外循環維持を目的とした併用薬剤ではない。","（正解）ヘパリンを通常の半量程度とし、メシル酸ナファモスタットを併用して総ACTを350〜400秒程度に管理することで、術中脳出血のリスクを軽減する「低ヘパリン人工心肺」が行われる。","カルペリチド（ハンプ）は心房性ナトリウム利尿ペプチド製剤であり、抗凝固管理を目的とした薬剤ではない。","ダビガトランは経口抗凝固薬であり、この文脈で体外循環中に併用される薬剤として説明されるものではない。"]},{"stem":"低ヘパリン体外循環管理などでACTを測定する際に用いられる、代表的な2種類の測定試薬（活性化剤）の組み合わせとして正しいものはどれか？","choices":["セライトとカオリン","トロンビンとヘパリナーゼ","プロタミンとアプロチニン","ADPとコラーゲン","フサンとエポプロステノール"],"correct":0,"expl":["（正解）ACTの測定には、セライトを活性化剤として用いる方法とカオリンを活性化剤として用いる方法の2種類が代表的であり、使用する薬剤（アプロチニンなど）によって適した測定法が異なる。","トロンビンやヘパリナーゼはACT測定の活性化剤として一般的に用いられる組み合わせではない。","プロタミンはヘパリン中和薬、アプロチニンは抗線溶薬であり、ACT測定の活性化剤の組み合わせではない。","ADPやコラーゲンは血小板凝集能検査で用いられる惹起物質であり、ACT測定の活性化剤ではない。","フサン（ナファモスタット）やエポプロステノールは抗凝固・抗血小板薬であり、ACT測定の活性化剤ではない。"]},{"stem":"成人先天性心疾患（ACHD）の単心室や修正大血管転位症などの手術において、体外循環開始時に特に留意して経食道エコーで確認すべき事項はどれか？","choices":["僧帽弁の逆流","左心系への空気の引き込み","肺動脈の石灰化","冠動脈の狭窄","下大静脈フィルターの位置"],"correct":1,"expl":["僧帽弁の逆流は一般的な術前評価事項ではあるが、体外循環開始時に特に留意すべき事項として説明されるものではない。","（正解）解剖学的・機能的異常やシャント血流が存在するため、体外循環開始時に左心系へ空気を引き込み、全身への空気塞栓を引き起こすリスクがあり、エコーでの確認が必須である。","肺動脈の石灰化は体外循環開始時に特に留意すべき事項として一般的に説明されるものではない。","冠動脈の狭窄は体外循環開始時に特に留意すべき事項として一般的に説明されるものではない。","下大静脈フィルターの位置は体外循環開始時に特に留意すべき事項として一般的に説明されるものではない。"]},{"stem":"PEA（肺動脈内膜摘除術）における体外循環離脱後、肺の再灌流障害の軽減や肺末梢循環の補助を目的として投与される薬剤はどれか？","choices":["ヘパリン","エポプロステノール（PGI2）","メシル酸ナファモスタット","デクスメデトミジン","ドブタミン"],"correct":1,"expl":["ヘパリンは抗凝固薬であり、肺再灌流障害の軽減を目的とした薬剤として説明されるものではない。","（正解）PEAの体外循環離脱後は、PGI2（エポプロステノール）の投与により肺末梢循環を補助し、PEEPをかけた呼吸管理で肺再灌流障害の軽減に努める。","メシル酸ナファモスタットは抗凝固管理に用いられる薬剤であり、肺再灌流障害の軽減を目的とした薬剤として説明されるものではない。","デクスメデトミジンは鎮静薬であり、肺再灌流障害の軽減を目的とした薬剤として説明されるものではない。","ドブタミンは強心薬であり、肺再灌流障害の軽減を目的とした薬剤として説明されるものではない。"]},{"stem":"PEA（肺動脈内膜摘除術）の復温時における送脱血温較差、および送血温と咽頭温の較差について、推奨される基準はどれか？","choices":["送脱血温較差10℃以内、送血温と咽頭温較差5℃以内","送脱血温較差5℃以内、送血温と咽頭温較差10℃以内","送脱血温較差15℃以内、送血温と咽頭温較差20℃以内","特に基準は設けられていない","送脱血温較差3℃以内、送血温と咽頭温較差3℃以内"],"correct":1,"expl":["送脱血温較差と送血温・咽頭温較差の基準が逆であり、推奨される基準とは一致しない。","（正解）PEAでは超低体温からの復温時、送脱血温較差は5℃以内、送血温と咽頭温の較差は10℃以内とする推奨に従い、約1〜1.5時間かけて復温する。","いずれの較差も基準として大きすぎ、急激な復温による合併症のリスクを高める恐れがある。","PEAの復温では、脳を含む臓器保護の観点から温度較差の基準が具体的に推奨されている。","いずれの較差も基準として厳しすぎ、実際の推奨基準とは一致しない。"]},{"stem":"特殊な体外循環に関する次のa〜eの記述のうち、正しいものの組み合わせはどれか？\na　OPCABは人工心肺を使用せず心拍動下で行う冠動脈バイパス術である。\nb　HITは血小板第4因子（PF4）とヘパリンの複合体に対する自己抗体によって発症する。\nc　TAVRの手技中に血行動態が破綻した場合、直ちに導入される補助循環はIABPである。\nd　活動期感染性心内膜炎で脳出血を合併している症例では、メシル酸ナファモスタットの併用を避け、通常量のヘパリンのみで抗凝固を管理する。\ne　体肺動脈シャントが造設されている症例では、体外循環開始後にシャント血流を増加させることで盗血を防止する。","choices":["a, b","a, e","b, c","c, d","d, e"],"correct":0,"expl":["（正解）a・bはいずれも正しい。aのOPCABの定義、bのHITの発症機序はいずれも本文の記載と一致する。","eは誤り。シャント血流は増加させるのではなく、遮断またはコントロールすることで盗血を防止する。","cは誤り。TAVRの血行動態破綻時に直ちに導入されるのはPCPS（V-A ECMO）であり、IABPではない。","cが誤りであるため、この組み合わせは正しくない。dも誤り。活動期感染性心内膜炎で脳出血を合併している症例では、むしろメシル酸ナファモスタットを併用してヘパリンを通常の半量程度に減らす「低ヘパリン人工心肺」が行われる。","eが誤りであるため、この組み合わせは正しくない。dも誤り。この病態ではナファモスタットを併用してヘパリン使用量を減らす管理が行われる。"]}]},{"title":"第15章：IABP","code":"iabp","questions":[{"stem":"IABPの原理において、心臓の拡張期にバルーンを膨張させ、大動脈拡張期圧を上昇させて冠動脈血流量を増加させる効果を何と呼ぶか？","choices":["Systolic unloading","Diastolic augmentation","Counter-pulsation","Auto regulation","Afterload augmentation"],"correct":1,"expl":["Systolic unloadingは収縮期にバルーンを収縮させて後負荷を軽減する効果であり、拡張期の冠血流増加効果を指すものではない。","（正解）拡張期にバルーンを膨張させて冠血流を増やすことをDiastolic augmentation（拡張期増強）と呼ぶ。","Counter-pulsationは心周期と逆位相でバルーンを拍動させるIABP全体の駆動原理を指す語であり、拡張期の効果そのものの名称ではない。","Auto regulation（自動調節能）は血管が血流を一定に保とうとする生体の機構を指す語であり、IABPの効果を指すものではない。","Afterload augmentationという語は後負荷を「増大させる」ことを意味し、IABPが目指す効果（後負荷の軽減）とは逆の内容である。"]},{"stem":"IABPの原理において、心臓の収縮期にバルーンを急速に収縮させ、左室の圧仕事量（後負荷）を減少させる効果を何と呼ぶか？","choices":["Systolic unloading","Diastolic augmentation","Veno-arterial bypass","Afterload augmentation","Counter-shock"],"correct":0,"expl":["（正解）収縮期に急速にバルーンを収縮させて後負荷を軽減させ、左室仕事量や心筋酸素消費量を減少させる効果をSystolic unloadingと呼ぶ。","Diastolic augmentationは拡張期にバルーンを膨張させて冠血流を増やす効果であり、収縮期の後負荷軽減効果を指すものではない。","Veno-arterial bypassは静脈から動脈へ血液を送る補助循環（V-A ECMOなど）の方式を指す語であり、IABPの効果の名称ではない。","Afterload augmentationは後負荷を「増大させる」ことを意味し、IABPが目指す効果とは逆である。","Counter-shockは除細動（電気ショック）を指す語であり、IABPの効果を指すものではない。"]},{"stem":"現在、IABPのバルーンを駆動させるためのガスとして一般的に使用されているものはどれか？","choices":["酸素","二酸化炭素","窒素","ヘリウム","空気"],"correct":3,"expl":["酸素はIABPの駆動ガスとして一般的に使用されるものではない。","二酸化炭素は開発当初に用いられていたガスだが、現在一般的に使用されているものではない。","窒素はIABPの駆動ガスとして一般的に使用されるものではない。","（正解）開発当初は二酸化炭素が用いられていたが、現在では分子量が小さく粘性抵抗が少ないヘリウムガスが使用されている。","空気（room air）はIABPの駆動ガスとして一般的に使用されるものではない。"]},{"stem":"IABPの駆動ガスとしてヘリウムガスが選択される最大の理由はどれか？","choices":["血液に溶けやすいため、万が一バルーンが破裂しても安全だから","分子量が小さく粘性抵抗が少ないため、高心拍にも追従できるから","バルーンのポリウレタン素材を劣化させないから","拡張・収縮時の作動音が最も静かだから","他の医療用ガスに比べて安価に入手できるから"],"correct":1,"expl":["血液への溶けやすさは血栓塞栓時の安全性に関連する特性ではあるが、ヘリウムが選択される「最大の」理由として説明されるものではない。","（正解）ヘリウムガスは分子量が小さく粘性抵抗が少ないため、狭小なカテーテル内で過剰な熱を発生することなく高心拍のガス交換に追従できる。","ポリウレタン素材の劣化防止はヘリウムガス選択の理由として一般的に説明されるものではない。","作動音の静かさはヘリウムガス選択の理由として一般的に説明されるものではない。","価格の安さはヘリウムガス選択の理由として一般的に説明されるものではない。"]},{"stem":"バルーンの拡張（インフレーション）を開始する至適なタイミング（指標）はどれか？","choices":["大動脈弁が閉鎖する時（大動脈圧波形のdicrotic notch）","大動脈弁が開く直前","心電図上のP波","心電図上のQ波","心電図上のR波の直後"],"correct":0,"expl":["（正解）インフレーションの開始は、大動脈弁閉鎖の時点、大動脈圧波形のdicrotic notch、心電図上のT波下行脚の終わり頃を指標とする。","大動脈弁が開く直前はデフレーション（収縮）を開始するタイミングの指標であり、インフレーションの指標ではない。","心電図上のP波は心房の興奮を表す波であり、インフレーション開始の指標として用いられるものではない。","心電図上のQ波はデフレーション開始の指標として用いられるものであり、インフレーションの指標ではない。","心電図上のR波の直後という指標は、インフレーション開始のタイミングとして一般的に説明されるものではない。"]},{"stem":"バルーンの収縮（デフレーション）を開始する至適なタイミング（指標）はどれか？","choices":["大動脈弁が閉鎖する時","心電図上のT波の終わり","大動脈弁が開く直前（大動脈圧波形の立ち上がり直前）","心電図上のR波","大動脈圧波形のdicrotic notch"],"correct":2,"expl":["大動脈弁が閉鎖する時はインフレーション開始のタイミングの指標であり、デフレーションの指標ではない。","心電図上のT波の終わり（下行脚の終わり）はインフレーション開始のタイミングの指標であり、デフレーションの指標ではない。","（正解）デフレーションの開始は、大動脈弁が開く直前、大動脈圧波形の立ち上がり直前、心電図上のQ波で行うのが効果的である。","心電図上のR波はバルーン駆動全体のトリガー信号として用いられるものであり、デフレーション開始そのものの指標ではない。","大動脈圧波形のdicrotic notchはインフレーション開始のタイミングの指標であり、デフレーションの指標ではない。"]},{"stem":"IABPのインフレーション（拡張）とデフレーション（収縮）の開始タイミングを心電図を指標として考える場合、それぞれに対応する心電図上のタイミングの組み合わせとして正しいものはどれか？","choices":["インフレーション：T波下行脚の終わり／デフレーション：Q波","インフレーション：R波／デフレーション：T波の終わり","インフレーション：P波／デフレーション：R波","インフレーション：Q波／デフレーション：T波","インフレーション：T波の頂点／デフレーション：P波"],"correct":0,"expl":["（正解）インフレーション（拡張）の開始は大動脈弁閉鎖の時点にあたる心電図上のT波下行脚の終わり頃を、デフレーション（収縮）の開始は大動脈弁が開く直前にあたる心電図上のQ波を、それぞれ心電図上の指標とする。","R波はバルーン駆動全体のトリガー信号として用いられるものであり、インフレーション開始そのものの心電図指標ではない。また、デフレーションの指標もT波の終わりではなくQ波である。","P波は心房の興奮を表す波であり、インフレーション開始の心電図指標として用いられるものではない。デフレーションの指標もR波ではない。","インフレーションとデフレーションの心電図指標が入れ替わっており、この組み合わせは誤りである。","T波の頂点、P波のいずれも、インフレーション・デフレーションの開始タイミングの心電図指標として用いられるものではない。"]},{"stem":"IABPを心電図（ECG）同期・トリガーで駆動する場合、インフレーション（拡張）はECG上のどのタイミングで開始することが適切か？","choices":["P波の直後","R波の直後（QRS波形成中）","T波の下行脚の終わり（T波の終わり）","大動脈圧波形のdicrotic notch","QRS波の直前"],"correct":2,"expl":["誤り。P波は心房興奮を表す波であり、インフレーション開始の心電図指標ではない。","誤り。R波はIABPのトリガー信号（バルーン駆動の基準点）として用いられるが、R波の直後は心室収縮の開始にあたり、インフレーションを開始すべきタイミングではない。","（正解）心電図をトリガーとして用いる場合、インフレーション（拡張）は大動脈弁閉鎖に相当するT波下行脚の終わり（T波の終わり）付近で開始するのが適切である。","誤り。dicrotic notchは動脈圧波形上の指標であり、心電図トリガーにおけるタイミングの指標ではない。","誤り。QRS波の直前（P波とQRS波の間）はインフレーション開始の心電図指標として用いられるものではない。"]},{"stem":"IABPを心電図（ECG）同期・トリガーで駆動する場合、デフレーション（収縮）はECG上のどのタイミングで開始することが適切か？","choices":["T波の頂点","QRS波の開始点（Q波）","P波","T波の下行脚の終わり","大動脈圧波形の立ち上がり（収縮期開始）"],"correct":1,"expl":["誤り。T波の頂点はデフレーション開始の心電図指標として用いられるものではない。","（正解）心電図をトリガーとして用いる場合、デフレーション（収縮）は大動脈弁が開く直前に相当するQRS波の開始点（Q波）付近で開始するのが適切である。","誤り。P波は心房興奮を表す波であり、デフレーション開始の心電図指標ではない。","誤り。T波の下行脚の終わりはインフレーション開始の心電図指標であり、デフレーションの指標ではない。","誤り。大動脈圧波形の立ち上がりは動脈圧トリガーにおける指標であり、心電図トリガーにおける心電図上の指標ではない。"]},{"stem":"IABPを動脈圧波形トリガーで駆動する場合、インフレーション（拡張）を開始する動脈圧波形上のタイミングとして適切なものはどれか？","choices":["収縮期圧の最高点","dicrotic notch（重複切痕）","拡張期圧の最低点","収縮期の立ち上がり点","心電図のT波の終わり"],"correct":1,"expl":["誤り。収縮期圧の最高点はインフレーション開始の動脈圧指標として用いられるものではない。","（正解）動脈圧波形をトリガーとして用いる場合、インフレーション（拡張）は大動脈弁閉鎖に相当するdicrotic notch（重複切痕）で開始するのが適切である。","誤り。拡張期圧の最低点はインフレーション開始の指標ではなく、この後に拡張期増強効果によって圧が上昇していく局面である。","誤り。収縮期の立ち上がり点はデフレーション（収縮）に関連するタイミングであり、インフレーションの指標ではない。","誤り。T波の終わりは心電図トリガーにおける指標であり、動脈圧波形上の指標ではない（生理学的には同時期にあたるが、動脈圧波形自体の指標としては用いない）。"]},{"stem":"IABPを動脈圧波形トリガーで駆動する場合、デフレーション（収縮）を開始する動脈圧波形上のタイミングとして適切なものはどれか？","choices":["dicrotic notch（重複切痕）","収縮期圧の最高点","拡張期圧が最も低下した、次の収縮期立ち上がり直前の時点","拡張期増強波の頂点","心電図のQ波"],"correct":2,"expl":["誤り。dicrotic notchはインフレーション開始の動脈圧指標であり、デフレーションの指標ではない。","誤り。収縮期圧の最高点はすでに心室収縮が生じた後であり、デフレーション開始としては遅すぎるタイミングである。","（正解）動脈圧波形をトリガーとして用いる場合、デフレーション（収縮）は拡張期圧が最も低下し、次の心収縮による立ち上がりが始まる直前の時点で開始するのが適切である。","誤り。拡張期増強波の頂点はインフレーション後の効果を示す波形であり、デフレーション開始の指標ではない。","誤り。Q波は心電図トリガーにおける指標であり、動脈圧波形上の指標ではない（生理学的には同時期にあたるが、動脈圧波形自体の指標としては用いない）。"]},{"stem":"IABPの駆動における心電図トリガーについて、通常は心電図のR波を信号として用いるが、心房細動などの不整脈合併時にIABPの追従が不良となる場合の対応として「適切でない」ものはどれか？","choices":["抗不整脈薬を投与するなどして調律を安定させる","ペースメーカーを使用している場合、ペーシングスパイクをトリガー信号として用いる","駆動装置に備わっている心房細動用トリガーモードを使用する","トリガーを行わず、心拍動と無関係に一定間隔でバルーンを駆動し続ける","動脈圧波形や本体内蔵のトリガーモードへの切り替えを検討する"],"correct":3,"expl":["不整脈を合併している場合、抗不整脈薬の投与により調律を安定させ、IABPが適切に追従できるようにすることは適切な対応である。","ペースメーカー使用時には、ペーシングスパイクをトリガー信号として使用することができ、適切な対応である。","駆動装置によっては心房細動用トリガーモードが備わっており、これを使用することは適切な対応である。","（正解）バルーンの拡張・収縮は心周期と同期（トリガー）させてこそ血行動態改善効果が得られるものであり、心拍動と無関係に一定間隔で駆動し続けると、かえって心機能に悪影響を及ぼす危険がある。トリガーを行わないという対応は適切でない。","R波トリガーでの追従が不良な場合、動脈圧波形トリガーや本体内蔵のトリガーモードへ切り替えることは、駆動装置に備わる代替手段として適切な対応である。"]},{"stem":"IABPの使用が「禁忌」となる病態はどれか？","choices":["急性心筋梗塞に伴う心原性ショック","虚血・低心拍出状態による重症不整脈","中等度以上の大動脈弁閉鎖不全症（AR）","不安定狭心症","内科的治療に抵抗する急性心不全"],"correct":2,"expl":["急性心筋梗塞に伴う心原性ショックはIABPの代表的な適応であり、禁忌ではない。","虚血・低心拍出状態による重症不整脈の改善もIABPの適応の一つである。","（正解）大動脈弁閉鎖不全症（AR）がある場合、バルーンの拡張によって血液が左室内に逆流し、左室の容量負荷をさらに増大させてしまうため、中等度以上のARは禁忌である。大動脈解離も禁忌となる。","不安定狭心症はIABPの適応（狭心痛の緩解）の一つである。","内科的治療に抵抗する急性心不全もIABPの適応の一つである。"]},{"stem":"IABPのバルーンカテーテルの先端は、解剖学的にどの位置に留置することが推奨されるか？","choices":["腕頭動脈の直下","左鎖骨下動脈分枝の直下","腎動脈分枝の直下","上行大動脈内","腹腔動脈分枝の直下"],"correct":1,"expl":["腕頭動脈の直下では留置位置として中枢側に寄りすぎ、分枝血管の閉塞リスクが高まる。","（正解）バルーン先端の位置が左鎖骨下動脈の直下にあることをポータブルX線写真により確認する。これより中枢側では左鎖骨下動脈などの分枝を閉塞する危険がある。","腎動脈分枝の直下では末梢側に寄りすぎており、バルーンによる補助効果や留置位置として推奨される部位ではない。","上行大動脈内はIABPカテーテルの留置部位ではなく、経大腿動脈的に下行大動脈へ挿入して用いる。","腹腔動脈分枝の直下も末梢側に寄りすぎており、推奨される留置位置ではない。"]},{"stem":"IABPカテーテルの経皮的挿入において、下肢虚血を予防する目的で近年登場した手法・構造はどれか？","choices":["カテーテル先端へのピッグテール付加","シースレス挿入（シースを使用しない挿入）","14Fr以上の太径シースの使用","大腿静脈からのアプローチ","バルーンを二重構造にする"],"correct":1,"expl":["カテーテル先端へのピッグテール付加は下肢虚血予防を目的とした手法として一般的に説明されるものではない。","（正解）下肢虚血防止の目的で、シースを介さずにカテーテルを直接挿入するシースレス挿入が登場し、カテーテル自体の細径化と併せて合併症対策が講じられている。","太径シースの使用はむしろ下肢虚血のリスクを高める方向であり、予防目的の手法ではない。","大腿静脈からのアプローチは静脈系へのアプローチであり、動脈系に留置するIABPの挿入経路として一般的なものではない。","バルーンを二重構造にするという手法は下肢虚血予防の手法として一般的に説明されるものではない。"]},{"stem":"IABPバルーンカテーテルのシャフト径の細径化に伴い、近年主流となっている経皮的挿入時の適応シースサイズはどれか？","choices":["5Fr","7〜8Fr","10Fr","12Fr","14Fr以上"],"correct":1,"expl":["5Frは現在のIABPカテーテルの適応シースサイズとしては細すぎ、一般的な製品規格に合致しない。","（正解）バルーンカテーテルのシャフトの細径化により、適応シースは従来の9Frから8Frへとサイズダウンされ、さらに7Frシース挿入タイプも登場しており、7〜8Frが近年の主流である。","10Frは細径化が進む前の、あるいはそれ以上の太いサイズであり、近年主流のサイズではない。","12Frは明らかに太すぎ、下肢虚血のリスクを高めるため近年の主流のサイズではない。","14Fr以上はさらに太く、現在のIABPカテーテルのシースサイズとしては用いられない。"]},{"stem":"IABPの合併症として最も頻度が高いものはどれか？","choices":["バルーンの破裂","下肢の血行障害（下肢虚血）","大動脈解離","感染","血小板減少"],"correct":1,"expl":["バルーンの破裂も合併症の一つとして知られるが、最も頻度が高いものではない。","（正解）カテーテル挿入による下肢の血行障害（下肢虚血）が最も頻度が高く、注意を払うべき合併症である。","大動脈解離は重篤だが、頻度としては下肢血行障害ほど高いものではない。","感染も注意すべき合併症だが、最も頻度が高いものとして説明されるものではない。","血小板減少はIABPの合併症として知られることがあるが、最も頻度が高いものではない。"]},{"stem":"IABPからの離脱（ウィーニング）方法として一般的な手順はどれか？","choices":["カウンターパルセーションの比率を1:1から2:1、3:1へと減少させていく","ヘリウムガスの代わりに酸素ガスを注入して徐々に慣れさせる","トリガーを心電図から動脈圧に切り替える","バルーンの留置位置を腹部大動脈まで引き下げる","バルーン容量を一定に保ったまま送血流量のみを減少させる"],"correct":0,"expl":["（正解）離脱は、カウンターパルセーションの比率を1:1から2:1、3:1と減少させてゆく場合と、インフレーションボリュームを20〜30%ずつ徐々に減少させてゆく場合の2通りがある。","駆動ガスを酸素に置き換えるという手法は離脱方法として一般的に説明されるものではない。","トリガー方式の切り替えは追従不良時の対応であり、離脱（ウィーニング）の一般的な手順ではない。","バルーンの留置位置を変更することは離脱の一般的な手順として説明されるものではない。","送血流量（人工心肺や補助循環の流量）の調整は、IABP単独の離脱手順として一般的に説明されるものではない。"]},{"stem":"IABPによる補助が不十分で、Impella、V-A ECMO、LVADなどのより強力な補助循環への移行を考慮すべき「心係数（CI）」と「尿量」の基準の組み合わせはどれか？","choices":["心係数 2.5以上、尿量 100mL/時以上","心係数 1.8以下、尿量 50mL/時以下","心係数 1.2〜1.4以下、尿量 20mL/時以下","心係数 0.5以下、尿量 0mL/時","心係数の値に関わらず、尿量が10mL/時以下の場合のみ"],"correct":2,"expl":["心係数2.5以上、尿量100mL/時以上は循環動態が良好な状態を示す数値であり、より強力な補助への移行を検討する基準ではない。","心係数1.8以下、尿量50mL/時以下は基準としてはやや緩やかであり、実際に示されている移行検討の目安とは異なる。","（正解）心係数1.2〜1.4L/分/m²以下の循環不全、あるいは乳酸値上昇、尿量20mL/時以下などが遷延する場合、より効果的な流量補助（Impella、V-A ECMO、LVADなど）への移行を考慮すべきである。","心係数0.5以下、尿量0mL/時はすでに極めて重篤な状態を示す数値であり、移行を検討し始める基準としては遅すぎる。","心係数の値を考慮せず尿量のみで判断するという基準は、実際に示されてい

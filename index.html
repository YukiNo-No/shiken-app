る移行検討の目安とは異なる。"]},{"stem":"IABPのバルーン材質として、強度と抗血栓性に優れているため広く用いられているものはどれか？","choices":["ラテックス","ポリウレタン","塩化ビニル","テフロン","シリコーン"],"correct":1,"expl":["ラテックスはアレルギーの問題もあり、IABPバルーンの材質として広く用いられているものではない。","（正解）バルーンの材質は、強度と抗血栓性を要するためポリウレタン、あるいはカルディオサンからなり、細径化に伴い薄膜化が進められている。","塩化ビニルはIABPバルーンの材質として一般的に用いられているものではない。","テフロンはグラフト素材などに用いられることがあるが、IABPバルーンの材質として広く用いられているものではない。","シリコーンはIABPバルーンの材質として広く用いられているものではない。"]},{"stem":"IABPの適応・禁忌・トリガー・合併症に関する次のa〜eの記述のうち、正しいものの組み合わせはどれか？\na　拡張期にバルーンを膨張させて冠血流を増加させる効果をDiastolic augmentationと呼ぶ。\nb　軽度の大動脈弁閉鎖不全症（AR）であっても、IABPの絶対的禁忌となる。\nc　IABPのバルーン駆動トリガー信号には、一般的に心電図のP波が用いられる。\nd　IABPの合併症として最も頻度が高いのは大動脈解離である。\ne　バルーンカテーテルの適応シースは、細径化により従来の9Frから7〜8Fr程度へとサイズダウンされてきている。","choices":["a, b","a, e","b, c","c, d","d, e"],"correct":1,"expl":["aとbの組み合わせ。bは誤り（IABPが禁忌となるのは中等度以上のARであり、軽度のARは絶対的禁忌ではない）であるため、この組み合わせは不適切。","（正解）aは正しい（Diastolic augmentationの定義は本文の記載と一致する）。eも正しい（シースサイズの細径化の経緯は本文の記載と一致する）。両者とも正しい記述であり、この組み合わせが正解となる。","bとcの組み合わせ。いずれも誤り（bは前述の通り誤り、cも誤り〈トリガー信号に一般的に用いられるのはP波ではなくR波である〉）であるため、この組み合わせは不適切。","cとdの組み合わせ。いずれも誤り（cは前述の通り誤り、dも誤り〈最も頻度が高い合併症は大動脈解離ではなく下肢の血行障害である〉）であるため、この組み合わせは不適切。","dとeの組み合わせ。dは誤りであるため、この組み合わせは不適切。"]}]},{"title":"第16章：ECMOとPCPS","code":"ecmo","questions":[{"stem":"心肺蘇生や心原性ショックなどに用いられる、静脈から脱血して人工肺で酸素化し、遠心ポンプを用いて動脈へ送血するECMOの方式はどれか？","choices":["V-V ECMO","V-A ECMO（PCPS）","A-V ECMO","ECPELLA","V-AV ECMO"],"correct":1,"expl":["V-V ECMOは静脈から脱血し、酸素化した血液を再び静脈へ返す方式であり、循環補助は行わない（呼吸補助のみ）。","（正解）循環補助と呼吸補助の両方を行うV-A ECMO（日本ではPCPSとほぼ同義）は、静脈（V）から脱血し、動脈（A）へ送血するシステムである。","A-V ECMOという方式は一般的に用いられる分類ではない。","ECPELLAはV-A ECMOとImpellaを組み合わせた補助循環の呼称であり、単独のECMO方式の名称ではない。","V-AV ECMOは重度の右心不全や差異的低酸素症（ハーレクイン症候群）などに用いられる特殊な構成であり、心肺蘇生や心原性ショックに対する標準的な方式として最初に挙げられるものではない。"]},{"stem":"V-A ECMO（PCPS）による循環補助が左心系に与える血行動態的な影響として正しいものはどれか？","choices":["左室の前負荷も後負荷も軽減する","左室の前負荷は増加するが、後負荷は軽減する","左室の前負荷は軽減するが、後負荷は増大する","左室の負荷には影響を与えない","左室の前負荷も後負荷もともに増大する"],"correct":2,"expl":["後負荷は軽減するのではなく増大するため、この記述は誤りである。","前負荷は増加するのではなく軽減するため、この記述は誤りである。","（正解）右心系から脱血するため左室の前負荷は軽減するが、上行大動脈などへ逆行性に送血するため左室の後負荷が増大し、心機能回復には不利に働く点に留意が必要である。","V-A ECMOは左室の前負荷・後負荷の両方に明確な影響を与えるため、「影響を与えない」という記述は誤りである。","前負荷は増大するのではなく軽減するため、この記述は誤りである。"]},{"stem":"経皮的にV-A ECMOを導入する際、解剖学的な走行から、脱血管の挿入部位として最も挿入しやすい（推奨される）のはどこか？","choices":["右大腿静脈","左大腿静脈","右内頸静脈","左内頸静脈","右鎖骨下静脈"],"correct":0,"expl":["（正解）左総腸骨静脈は椎体前を走行するため挿入に抵抗を感じることが多く、解剖学的に右大腿静脈から挿入した方が容易である。","左大腿静脈は左総腸骨静脈が椎体前を走行するため、右大腿静脈に比べて挿入時に抵抗を感じやすい。","右内頸静脈は送血管の挿入部位として用いられることはあるが、脱血管の第一選択として推奨される部位ではない。","左内頸静脈は脱血管の挿入部位として一般的に推奨されるものではない。","右鎖骨下静脈は脱血管の挿入部位として一般的に推奨されるものではない。"]},{"stem":"V-A ECMO回路をカニューレに接続して送血を開始する際、動静脈シャント（血液の逆流）を防ぐために行うべき正しい操作はどれか？","choices":["遠心ポンプを停止したままクランプを解除する","クランプを解除してから、遠心ポンプの回転数を徐々に上げる","遠心ポンプを1000 rpm以上で駆動させておいてから、ゆっくりとクランプを解除する","逆流防止弁が作動するのを確認してからクランプを解除する","送血側のクランプを先に解除し、その後脱血側のクランプを解除する"],"correct":2,"expl":["遠心ポンプを停止したままクランプを解除すると、動脈から静脈へ血液が逆流してしまう。","クランプを解除してからポンプ回転数を上げる順序では、解除の瞬間に血液が逆流する危険がある。","（正解）ECMO回路には逆流防止弁機構がないため、不用意にクランプを解除すると動脈から静脈へ血液が逆流する。必ず遠心ポンプを駆動（1000 rpm以上）させてからクランプを解除する。","ECMO回路には逆流防止弁機構がないため、「逆流防止弁の作動を確認する」という操作自体が成立しない。","クランプの解除順序を工夫するだけでは、ポンプが停止した状態である限り血液の逆流を防ぐことはできない。"]},{"stem":"大腿動静脈からV-A ECMOを導入した際に起こりうる致命的な合併症「下肢虚血」を予防・対策するための方法として推奨されるのはどれか？","choices":["IABPを併用する","浅大腿動脈へ順行性にシースを留置し、送血ラインの側枝から末梢灌流を行う","ヘパリンの投与量を通常の2倍にする","送血カニューレをより太いものに変更する","下肢を挙上したままの体位を維持する"],"correct":1,"expl":["IABPの併用は下肢虚血の直接的な予防・対策法として一般的に説明されるものではない。","（正解）送血管挿入部より末梢の血流が遮断されるのを防ぐため、浅大腿動脈へ順行性にシース（5Fr以上）を留置して末梢灌流を行うことが推奨される。","ヘパリンの増量は血栓予防には関与し得るが、送血カニューレによる物理的な血流遮断そのものへの対策ではない。","送血カニューレを太くすることはむしろ末梢血流の遮断を悪化させ、下肢虚血のリスクを高める。","下肢を挙上したままの体位は下肢虚血の予防・対策法として一般的に説明されるものではない。"]},{"stem":"V-A ECMO施行中、自己心拍出があり自己肺のガス交換能が障害されている症例において、脳へ低酸素血が送られていないか（mixing zoneの評価）をモニターするのに適した部位はどれか？","choices":["右上肢（右橈骨動脈など）の血液ガスやSpO2","左上肢の血液ガスやSpO2","下肢のSpO2","混合静脈血酸素飽和度（SvO2）","左心房圧（LAP）"],"correct":0,"expl":["（正解）自己心拍出（低酸素血）とECMO血流（酸素化血）がぶつかるmixing zoneの位置によっては、脳へ低酸素血が灌流する危険があるため、右上肢の酸素化を常にモニターする必要がある。","左上肢はmixing zoneの位置によっては右上肢と状態が異なることがあり、脳酸素化の評価に用いる代表部位としては右上肢が優先される。","下肢のSpO2は大腿動脈送血側の順行性・逆行性血流を反映するものであり、脳への酸素供給評価の指標としては用いられない。","混合静脈血酸素飽和度（SvO2）は全身の酸素需給バランスの指標であり、脳への低酸素血灌流というmixing zoneに特有の問題を直接モニターするものではない。","左心房圧（LAP）は左心系の前負荷評価に用いられる指標であり、mixing zoneの評価には用いられない。"]},{"stem":"V-A ECMOからの離脱を考慮する際の指標として、一般的に目標とされる「血中乳酸値」はどれか？","choices":["2 mmol/L 未満","5 mmol/L 未満","10 mmol/L 未満","15 mmol/L 未満","20 mmol/L 未満"],"correct":0,"expl":["（正解）ECMOの補助流量を減量した段階で、平均動脈圧＞60mmHg、SvO2＞60〜65%、血中乳酸値＜2 mmol/Lなどが確認できれば離脱を考慮する。","5 mmol/L未満は離脱を考慮する目標値としては緩やかすぎる。","10 mmol/L未満はさらに緩やかであり、離脱を検討する基準としては不適切に高い。","15 mmol/L未満は明らかに高すぎる値であり、むしろ組織灌流不全を示唆する数値である。","20 mmol/L未満はさらに高すぎ、離脱の目標値としては全く適切でない。"]},{"stem":"循環不全を伴わない成人の重症呼吸不全（ARDSなど）に対して、第一選択となるECMOの方式はどれか？","choices":["V-A ECMO","V-V ECMO","A-V ECMO","ECPELLA","V-AV ECMO"],"correct":1,"expl":["V-A ECMOは循環補助を伴う方式であり、循環不全を伴わない呼吸不全単独への第一選択ではない。","（正解）循環補助を必要としない重度呼吸不全には、静脈から脱血して人工肺で酸素化し、再び静脈系に返すV-V ECMOが用いられる。","A-V ECMOという方式は一般的に用いられる分類ではない。","ECPELLAはV-A ECMOとImpellaを組み合わせた方式であり、循環補助を伴わない単純な呼吸不全への第一選択ではない。","V-AV ECMOは特殊な病態（差異的低酸素症など）に用いられる構成であり、通常の重症呼吸不全に対する第一選択ではない。"]},{"stem":"成人の重症呼吸不全に対するV-V ECMOの適応を判断する指標として、よく用いられるスコアはどれか？","choices":["4Tsスコア","INTERMACS分類","Murray Lung Injury Score（MLIS）","NYHA分類","APACHE IIスコア"],"correct":2,"expl":["4Tsスコアはヘパリン起因性血小板減少症（HIT）の臨床評価スコアであり、呼吸不全の重症度評価には用いられない。","INTERMACS分類は補助人工心臓（VAD）導入時の重症度分類であり、呼吸不全の適応判断に用いられるスコアではない。","（正解）回復の見込みのある急性呼吸不全で、Murray Lung Injury Scoreが3.0以上、またはpH 7.2以下の高CO2血症などがV-V ECMO適応の目安とされている。","NYHA分類は心不全の重症度分類であり、呼吸不全の適応判断に用いられるスコアではない。","APACHE IIスコアは集中治療領域で用いられる包括的な重症度スコアであり、V-V ECMO適応判断に特化して用いられる代表的スコアとして説明されるものではない。"]},{"stem":"V-V ECMOにおいて、送血された酸素化血液が自己肺を回らずに再び脱血管に吸い込まれてしまい、有効な酸素供給量が低下する現象を何と呼ぶか？","choices":["キャビテーション","スウィープ現象","ウォーターハンマー","リサーキュレーション（再循環）","チャタリング"],"correct":3,"expl":["キャビテーションは送血カニューレなどで流速増加・圧力低下により気泡が生じる現象であり、この現象とは異なる。","「スウィープ現象」という名称は本問で問われている再循環現象の一般的な呼称ではない（スウィープガスは人工肺の換気ガス流量を指す語である）。","ウォーターハンマーは配管内の急激な流れの変化で生じる圧力衝撃現象であり、この現象とは異なる。","（正解）V-V ECMOでは静脈に送血し静脈から脱血するため、送血された血液がそのまま脱血されてしまうリサーキュレーション（再循環）が起こり得る。","チャタリングは脱血カニューレ先端が血管壁に断続的に吸着する現象であり、この現象とは異なる。"]},{"stem":"成人のV-V ECMOにおいて、リサーキュレーションを少なく効率よく酸素化できるため最も一般的に用いられる「脱血」と「送血」の組み合わせはどれか？","choices":["大腿静脈から脱血し、右内頸静脈へ送血する","右内頸静脈から脱血し、大腿静脈へ送血する","右内頸静脈から脱血し、左内頸静脈へ送血する","大腿動脈から脱血し、大腿静脈へ送血する","左大腿静脈から脱血し、右大腿静脈へ送血する"],"correct":0,"expl":["（正解）大腿静脈（先端は下大静脈/右房連結部）から脱血し、右内頸静脈（先端は上大静脈/右房）へ送血する方法が、リサーキュレーション率が低く一般的である。","脱血と送血の部位が逆であり、この組み合わせではリサーキュレーション率がより高くなりやすい。","右内頸静脈と左内頸静脈の組み合わせはV-V ECMOの標準的な脱血・送血構成として一般的に用いられるものではない。","大腿動脈は動脈系であり、V-V ECMO（静脈-静脈）の脱血部位として用いられるものではない。","左右の大腿静脈同士の組み合わせは、脱血管と送血管の先端が近接しやすくリサーキュレーションが増加しやすいため、一般的に推奨される組み合わせではない。"]},{"stem":"V-V ECMO導入後、肺にさらなる障害を与えないために行う人工呼吸器の設定（lung rest設定）として正しいのはどれか？","choices":["1回換気量を最大にする","PEEP（呼気終末陽圧）をゼロにする","FiO2 0.4以下、PEEP 10cmH2O以下などの弱い設定にする","呼吸回数を毎分30回以上にする","上限圧を35cmH2O以上に設定する"],"correct":2,"expl":["1回換気量を最大にする設定はむしろ肺傷害（人工呼吸器関連肺傷害）を助長するため、lung rest設定とは正反対である。","PEEPをゼロにすると肺胞虚脱を招く恐れがあり、lung rest設定として適切ではない。","（正解）V-V ECMO導入後は、肺を休ませるためにPCV、FiO2 0.4以下、PEEP 10cmH2O以下、上限圧20cmH2O以下、呼吸回数10回/分以下などの「lung rest設定」とする。","呼吸回数を毎分30回以上にする設定は肺への負荷を増大させ、lung rest設定とは正反対である。","上限圧を35cmH2O以上に設定することは気圧外傷のリスクを高め、lung rest設定として適切ではない。"]},{"stem":"V-V ECMOからの離脱（Weaning）を試みる際、第一段階として行う操作はどれか？","choices":["脱血カニューレを半分引き抜く","遠心ポンプを完全に停止する","ECMOの吹送ガス酸素濃度（FiO2）を21%に減らす","ヘパリンを中和する","送血カニューレを抜去する"],"correct":2,"expl":["脱血カニューレを半分引き抜くという操作は、V-V ECMO離脱の一般的な手順として説明されるものではない。","遠心ポンプを完全に停止するのは離脱が確認された最終段階の操作であり、第一段階の操作ではない。","（正解）V-V ECMOの離脱では、まずECMOのFiO2を21%（空気）に減らし、SpO2＞90%が維持できるかを確認する。維持できればスウィープガス流量を減らしていく。","ヘパリンの中和は回路抜去後に行う操作であり、離脱を試みる第一段階の操作ではない。","送血カニューレの抜去は離脱が完全に確認された後の操作であり、第一段階の操作ではない。"]},{"stem":"COVID-19肺炎に対するV-V ECMOの一般的な特徴として「誤っている」ものはどれか？","choices":["気管挿管からECMO導入に至るまでの重症化速度が速い","ECMO補助期間は、他疾患による重症呼吸不全と比べて短期間で終えることが多い","回路内血栓形成の頻度が高く、出血合併症も多い","肺コンプライアンスの保たれ方の割に、酸素化の悪化が急激であることが特徴とされる","適切な管理を行えば、他疾患による重症呼吸不全と同等の成績が得られるとされる"],"correct":1,"expl":["気管挿管からECMO導入に至るまでの重症化速度が速い点はCOVID-19肺炎の特徴として正しい。","（正解＝誤っている）COVID-19肺炎ではECMO補助が長期になりがちであることが特徴として知られており、「短期間で終えることが多い」という記述は誤りである。","回路内血栓形成頻度が高く出血合併症も多い点はCOVID-19肺炎に対するECMOの特徴として正しい。","肺コンプライアンスが保たれる割に酸素化の悪化が急激である点はCOVID-19肺炎の特徴として正しい。","適切な管理により他疾患による重症呼吸不全と同等の成績が得られるとされる点も正しい記述である。"]},{"stem":"ECMO・PCPSの操作と病態に関する次のa〜eの記述のうち、正しいものの組み合わせはどれか？\na　V-A ECMOは右心系から脱血するため左室の前負荷は増大するが、後負荷は軽減する。\nb　ECMO回路には逆流防止弁機構が備わっているため、クランプ解除の順序に注意する必要はない。\nc　V-V ECMOからの離脱の第一段階は、遠心ポンプを完全に停止することである。\nd　V-V ECMOにおいて、大腿静脈から脱血し右内頸静脈へ送血する組み合わせは、リサーキュレーション率が低く一般的である。\ne　COVID-19肺炎に対するECMOは、補助期間が長期になりがちで、回路内血栓形成や出血合併症も多い。","choices":["a, b","a, e","b, c","c, d","d, e"],"correct":4,"expl":["aとbの組み合わせ。いずれも誤り（aはV-A ECMOが右心系から脱血するため左室の前負荷は「軽減」し、上行大動脈などへ逆行性に送血するため後負荷はむしろ「増大」するという記述が正しく、本肢はこれと逆であるため誤り。bも誤り〈ECMO回路には逆流防止弁機構がなく、クランプ解除の順序に細心の注意を要する〉）であるため、この組み合わせは不適切。","aとeの組み合わせ。eは正しいが、aは誤り（前述の通り前負荷・後負荷の記述が逆である）であるため、この組み合わせは不適切。","bとcの組み合わせ。いずれも誤り（bは前述の通り誤り、cも誤り〈離脱の第一段階はFiO2を21%に減らすことであり、ポンプ停止は最終段階である〉）であるため、この組み合わせは不適切。","cとdの組み合わせ。dは正しいが、cは誤り（前述の通り離脱の第一段階はポンプ停止ではない）であるため、この組み合わせは不適切。","（正解）dは正しい（大腿静脈脱血・右内頸静脈送血の組み合わせはリサーキュレーション率が低く一般的である）。eも正しい（COVID-19肺炎に対するECMOの特徴は本文の記載と一致する）。両者とも正しい記述であり、この組み合わせが正解となる。"]}]},{"title":"第17章：Impella","code":"impella","questions":[{"stem":"カテーテル型経皮的左室補助装置「Impella」に内蔵されているポンプの形式はどれか？","choices":["ローラーポンプ","遠心ポンプ","軸流ポンプ","ダイアフラムポンプ","拍動流ポンプ（サック型）"],"correct":2,"expl":["ローラーポンプは体外循環の血液ポンプとして用いられる方式であり、Impellaには使用されない。","遠心ポンプはECMO（PCPS）などの血液ポンプに用いられる方式であり、Impellaのポンプ形式ではない。","（正解）Impellaはカテーテル先端に内蔵された小型の軸流ポンプにより、左室内から血液を吸い込み上行大動脈へ送血する。","ダイアフラムポンプは拍動流を作る方式の一つであり、Impellaのポンプ形式ではない。","拍動流ポンプ（サック型）は一部の植込型VADで用いられる方式であり、Impellaの軸流ポンプとは異なる。"]},{"stem":"Impellaの血行動態的な効果として「誤っている」ものはどれか？","choices":["心周期に関わらず定常流で流量補助を行う","左室拡張末期圧を上昇させて心拍出量を増やす","左室内の減圧（unloading）を行う","左室心筋の酸素消費量を低下させる","大動脈圧を維持しながら左室から直接脱血を行う"],"correct":1,"expl":["誤りではない（正しい記述）。Impellaは軸流ポンプにより心周期にかかわらずほぼ定常的な流量で補助を行う。","（正解＝誤っている）Impellaは左室から直接脱血することで左室拡張末期容量・拡張末期圧を「低下」させ、心負荷を軽減する。「上昇させる」という記述は誤りである。","誤りではない（正しい記述）。Impellaは左室内の血液を吸い出すことで左室内圧を下げ、減圧（unloading）効果をもたらす。","誤りではない（正しい記述）。左室の減圧により心筋壁張力が低下し、心筋酸素消費量も低下する。","誤りではない（正しい記述）。Impellaは左室から直接脱血し上行大動脈へ送血することで、大動脈圧を維持しつつ左室を減圧する。"]},{"stem":"Impella CP SmartAssist および 5.5 SmartAssist において、より正確なポンプ位置モニタリングをアシストするために新たに採用されたセンサーはどれか？","choices":["光学センサー","超音波センサー","磁気センサー","温度センサー","圧電（ピエゾ）センサー"],"correct":0,"expl":["（正解）SmartAssistモデルには光学センサーが新たに採用され、より正確なポンプ位置モニタリングが可能になっている。","超音波センサーはImpellaのポンプ位置モニタリングには採用されていない。","磁気センサーはImpellaのポンプ位置モニタリングには採用されていない。","温度センサーは体外循環回路の血液温度測定などに用いられるが、Impellaのポンプ位置モニタリングのセンサーではない。","圧電センサーはImpellaのポンプ位置モニタリングには採用されていない。"]},{"stem":"Impellaの使用が「禁忌」となる病態はどれか？","choices":["急性心筋梗塞に伴う心原性ショック","大動脈弁に機械弁が植え込まれている症例","経皮的冠動脈インターベンション（PCI）施行時","軽度の僧帽弁閉鎖不全症","右心機能が正常に保たれている症例"],"correct":1,"expl":["急性心筋梗塞に伴う心原性ショックはImpellaの適応となる病態であり、禁忌ではない。","（正解）ポンプカテーテルが大動脈弁を貫通して留置されるため、大動脈弁に機械弁が植え込まれている症例では使用できず禁忌となる。","PCI施行時の補助としてImpellaが用いられることがあり、禁忌ではない。","禁忌となるのは中等度以上の大動脈弁「閉鎖不全」であり、本選択肢は僧帽弁の閉鎖不全であって禁忌の対象ではない。","右心機能が保たれていること自体はImpella使用の禁忌理由にはならない。"]},{"stem":"Impella CP SmartAssistを経皮的に挿入する際、最も一般的なアクセス部位はどこか？","choices":["右内頸静脈","大腿動脈","大腿静脈","橈骨動脈","鎖骨下静脈"],"correct":1,"expl":["右内頸静脈は中心静脈カテーテル挿入等に用いられる部位であり、Impella CP SmartAssistの一般的なアクセス部位ではない。","（正解）Impella CP SmartAssistは一般的に大腿動脈にアクセスし、14Frピールアウェイ式イントロデューサーを挿入して経皮的に留置する。","大腿静脈は静脈系のアクセス部位であり、動脈系デバイスであるImpellaのアクセス部位ではない。","橈骨動脈は動脈血ガス採取や観血的動脈圧モニタリングに用いられる部位であり、Impella留置には用いられない。","鎖骨下静脈は静脈系のアクセス部位であり、Impellaのアクセス部位ではない。"]},{"stem":"Impella 5.5 SmartAssistを外科的アプローチ（カットダウン法）で挿入する際、人工血管を端側吻合してアクセス部位として推奨される血管はどれか？","choices":["上行大動脈","大腿静脈","鎖骨下動脈（または腋窩動脈）","肺動脈","大腿動脈"],"correct":2,"expl":["上行大動脈は送血管の直接挿入部位となることはあるが、Impella 5.5 SmartAssistの外科的アクセスとして推奨される部位ではない。","大腿静脈は静脈系の部位であり、動脈系デバイスであるImpellaのアクセスには用いない。","（正解）鎖骨下動脈（または腋窩動脈）を露出し、人工血管（直径10mm×長さ20cm）を端側吻合してアクセス部位とすることが推奨される。","肺動脈は右心系・肺循環の血管であり、左室補助を行うImpellaのアクセス部位ではない。","大腿動脈は経皮的アプローチで用いられる部位であり、外科的アプローチ（カットダウン法）で推奨される血管ではない。"]},{"stem":"Impellaを左室内に適正に留置するため、経食道エコーで確認すべき事項として「不適切な」ものはどれか？","choices":["吐出部が大動脈弁を通過し、大動脈弁上方（上行大動脈側）に位置していること","吸入部が大動脈弁から約5cm下方に位置すること","吸入部が僧帽弁前尖や乳頭筋に絡まっていないこと","カテーテル本体が心室中隔や心室壁に強く接触していないこと","吸入部が僧帽弁を通過し、左房内に位置していること"],"correct":4,"expl":["不適切ではない（正しい確認事項）。吐出部が大動脈弁を通過し上行大動脈側に位置していることは、適正留置の確認に必要である。","不適切ではない（正しい確認事項）。吸入部が大動脈弁から約5cm下方に位置することは適正留置の目安として確認すべき事項である。","不適切ではない（正しい確認事項）。吸入部が僧帽弁前尖や乳頭筋に絡まっていないことは合併症予防のために確認すべき事項である。","不適切ではない（正しい確認事項）。カテーテル本体が心室中隔や心室壁に強く接触していないことは、心筋損傷や不整脈の予防のために確認すべき事項である。","（正解＝不適切）Impellaの吸入部は左室内に留置されるべきものであり、僧帽弁を通過して左房内に位置することはあってはならない誤留置（malposition）である。これは確認すべき「正常所見」ではなく、発見された場合は直ちに対応すべき異常所見である。"]},{"stem":"制御装置でImpellaの適正な留置位置を確認するための「位置波形」と「モータ波形」の正しい組み合わせはどれか？","choices":["位置波形：右室圧波形、モータ波形：フラット","位置波形：大動脈圧波形、モータ波形：パルス状","位置波形：肺動脈圧波形、モータ波形：パルス状","位置波形：左室圧波形、モータ波形：フラット","位置波形：大動脈圧波形、モータ波形：フラット"],"correct":1,"expl":["位置波形が右室圧波形を示すことは適正留置ではあり得ない所見である。","（正解）適正な留置位置では、位置波形（吐出部）が大動脈圧波形を示し、モータ波形（吸入部からモータへの負荷）が心周期に合わせたパルス状の波形を示す。","位置波形が肺動脈圧波形を示すことは適正留置ではあり得ない所見である。","位置波形が左室圧波形を示す場合、ポンプが十分に大動脈側へ進んでいない可能性があり、適正留置とはいえない。","モータ波形は心周期に応じたパルス状を示すのが正常であり、フラットな波形は左室フィリング不良やポンプの位置異常を示唆する異常所見である。"]},{"stem":"Impellaのモータ内への血液侵入を防ぐ「パージシステム」において、パージ液として推奨されている組成はどれか？","choices":["生理食塩水のみ","ヘパリンを添加した5%ブドウ糖液","乳酸リンゲル液","25%アルブミン液","ヘパリンを添加した生理食塩水"],"correct":1,"expl":["生理食塩水のみでは推奨組成ではない。","（正解）パージ液として、5%ブドウ糖液500mLにヘパリン50単位/mLを添加した組成が推奨されている。","乳酸リンゲル液はImpellaのパージ液として推奨されていない。","25%アルブミン液はパージ液として推奨されていない。","ヘパリンを添加する点は正しいが、溶解液は生理食塩水ではなく5%ブドウ糖液が推奨されている。"]},{"stem":"Impella作動中、サクションアラームが頻発する場合やフローが不安定な場合、最初に評価・調整すべき「左室フィリング（充満）」に影響を与えない因子はどれか？","choices":["全身循環血液量（出血や脱水）","右心機能","肺血管抵抗","血液のpH","心房細動などの不整脈"],"correct":3,"expl":["影響を与える因子である。出血や脱水による循環血液量低下は左室フィリング不良の原因となる。","影響を与える因子である。右心機能の低下は左室への血流供給を減少させ、左室フィリング不良の原因となる。","影響を与える因子である。肺血管抵抗の上昇は右心から左心への血流を妨げ、左室フィリングに影響する。","（正解）血液のpHは左室フィリングそのものに直接影響を与える因子ではなく、サクションアラームの評価・調整で最初に確認すべき項目には含まれない。","影響を与える因子である。心房細動などの不整脈は心房収縮の消失により左室への充満が減少し、左室フィリング不良の原因となりうる。"]},{"stem":"Impella補助中の目標とするACT（活性化凝固時間）はどれか？","choices":["100〜120秒","160〜180秒","250〜300秒","400秒以上","120〜140秒"],"correct":1,"expl":["100〜120秒はImpella補助中の目標ACTとしては低すぎる。","（正解）Impella補助中のACT目標値は160〜180秒である。","250〜300秒は人工心肺中のACT目標値であり、Impella補助中の目標値としては高すぎる。","400秒以上は過剰な抗凝固であり、出血リスクが高くなる。","120〜140秒はImpella補助中の目標ACTとしては低すぎる。"]},{"stem":"大腿動脈からImpellaを挿入した際、足背・後脛骨動脈の拍動を観察して早期発見に努めるべき合併症はどれか？","choices":["脳梗塞","腸管虚血","下肢虚血","肺塞栓症","消化管出血"],"correct":2,"expl":["脳梗塞の早期発見には神経学的所見の観察が重要であり、足背・後脛骨動脈の拍動観察とは直接関連しない。","腸管虚血の評価には腹部所見や乳酸値などが用いられ、足背・後脛骨動脈の拍動観察とは直接関連しない。","（正解）大腿動脈アクセスではカテーテルによる下肢への血流阻害（下肢虚血）が生じうるため、足背・後脛骨動脈の拍動を定期的に観察し早期発見に努める。","肺塞栓症の評価には呼吸状態や血液ガス、造影CT等が用いられ、足背・後脛骨動脈の拍動観察とは直接関連しない。","消化管出血の評価には便性状やヘモグロビン値などが用いられ、足背・後脛骨動脈の拍動観察とは直接関連しない。"]},{"stem":"Impella使用中に暗赤色や赤褐色の尿が出現した。Impellaに起因する「溶血」を疑う場合、その主な原因として考えられるものはどれか？","choices":["パージ液の濃度不足","ヘパリンの過剰投与","カテーテルの不適切な位置や左室フィリング不良","デバイスの感染","パージ圧の過剰上昇"],"correct":2,"expl":["パージ液の濃度不足はモータ内への血液侵入やモータ焼損のリスクを高める要因であり、溶血の主因としては挙げられない。","ヘパリンの過剰投与は出血リスクを高めるが、溶血の直接原因ではない。","（正解）Impellaに起因する溶血が疑われる場合、多くはカテーテルの不適切な位置や、左室への血液充満不足（左室フィリング不良）による機械的応力が原因である。","デバイス感染は発熱や炎症所見を呈するが、暗赤色尿・溶血の直接原因ではない。","パージ圧の過剰上昇は溶血の主因としては挙げられない。"]},{"stem":"右心不全がありImpellaによる左室補助だけでは不十分な場合などに、V-A ECMO（PCPS）を組み合わせて両心室補助および呼吸補助を行う治療法を何と呼ぶか？","choices":["MUF","VAVD","ECPELLA","BTR","ECPCO2R"],"correct":2,"expl":["MUF（modified ultrafiltration）は体外循環後の血液濃縮法であり、Impella・ECMOの併用療法ではない。","VAVD（vacuum assisted venous drainage）は体外循環における脱血補助法であり、Impella・ECMOの併用療法ではない。","（正解）ImpellaとV-A ECMO（PCPS）を併用する治療法をECPELLA（エクペラ）と呼ぶ。右心不全や十分な前負荷が得られない場合にシステム変更が考慮される。","BTR（Bridge to recovery）は補助人工心臓等の導入目的を表す用語であり、Impella・ECMOの併用療法の名称ではない。","ECPCO2Rは体外式二酸化炭素除去法に関連する用語であり、Impella・ECMOの併用療法の名称ではない。"]},{"stem":"Impellaを留置したまま心臓手術（開心術）を行う際、心停止中にモータを保護しつつアラームをオフにするために設定しなければならないモードはどれか？","choices":["サージカルモード","オートパイロットモード","スタンバイモード","ウィーニングモード","メンテナンスモード"],"correct":0,"expl":["（正解）心停止中はImpellaをサージカルモードに設定する必要があり、これによりポンプ作動を止めてもアラームをオフにし、パージシステムを作動させたままモータを保護できる。","オートパイロットモードは通常運転時に流量を自動調整するモードであり、心停止中の使用には適さない。","スタンバイモードという名称の設定はImpellaの標準的な運転モードとしては用いられない。","ウィーニングモードという名称の設定はImpellaの標準的な運転モードとしては用いられない。","メンテナンスモードという名称の設定はImpellaの標準的な運転モードとしては用いられない。"]},{"stem":"Impellaのカテーテル・ポンプ径に関する記述として正しいものはどれか？","choices":["Impella CP SmartAssistのポンプ最大拍出量は5.5L/分である","Impella CP SmartAssistのポンプ最大径は14Fr（約5.05mm）である","Impella 5.5 SmartAssistのポンプ最大径は14Frである","Impella CP SmartAssistを経皮的に挿入する際に用いるピールアウェイ式イントロデューサーは21Frである","Impella 5.5 SmartAssistのポンプ最大拍出量は3.7L/分である"],"correct":1,"expl":["誤り。Impella CP SmartAssistのポンプ最大拍出量は3.7L/分であり、5.5L/分ではない（5.5L/分はImpella 5.5 SmartAssistの値である）。","（正解）Impella CP SmartAssistのポンプ最大径は14Fr（約5.05mm）である。","誤り。Impella 5.5 SmartAssistのポンプ最大径は21Fr（約6.4mm）であり、14Frではない（14FrはImpella CP SmartAssistの値である）。","誤り。Impella CP SmartAssistを経皮的に挿入する際に用いるピールアウェイ式イントロデューサーは14Frであり、21Frではない。","誤り。Impella 5.5 SmartAssistのポンプ最大拍出量は5.5L/分であり、3.7L/分ではない（3.7L/分はImpella CP SmartAssistの値である）。"]},{"stem":"Impella CP SmartAssistおよび5.5 SmartAssistに搭載されている光学センサーの位置と役割に関する記述として最も適切なものはどれか？","choices":["光学センサーはカテーテル先端の吸入部（左室側）に内蔵されており、左室圧を検出することでポンプ位置を確認する","光学センサーは吐出部付近（大動脈側）に内蔵されており、留置位置が適正であれば大動脈圧波形を検出する","光学センサーはモータ部内部に内蔵されており、モータ回転数を直接測定するために使用される","光学センサーはパージシステムのチューブ内に組み込まれており、パージ液の温度を測定する","光学センサーはカニューレの中間部に内蔵されており、左室内の血液温度をモニタリングする"],"correct":1,"expl":["誤り。光学センサーは吸入部ではなく吐出部付近に位置しており、左室圧そのものを検出する目的のものではない。","（正解）光学センサーは吐出部付近（大動脈側）に内蔵されており、留置位置が適正であれば制御装置の位置波形として大動脈圧波形を検出する。これにより、より正確なポンプ位置モニタリングが可能となっている。","誤り。光学センサーはモータ回転数を直接測定するためのものではなく、位置モニタリング用の圧センサーである。","誤り。光学センサーはパージ液の温度を測定するものではない。","誤り。光学センサーは血液温度をモニタリングするものではなく、位置確認用の圧センサーである。"]}]},{"title":"第18章：補助人工心臓","code":"vad","questions":[{"stem":"補助人工心臓の導入目的のうち、「心臓移植への橋渡し」を意味する用語はどれか？","choices":["BTR (Bridge to recovery)","BTC (Bridge to candidacy)","BTT (Bridge to transplantation)","DT (Destination therapy)","BTD (Bridge to decision)"],"correct":2,"expl":["BTR（Bridge to recovery）は不全心の回復を待つための補助を意味し、心臓移植への橋渡しではない。","BTC（Bridge to candidacy）は他臓器障害等により移植適応を判定できない患者に対し、適応判定が可能となるまで全身状態を維持するための補助を意味し、心臓移植への橋渡しそのものを指す用語ではない。","（正解）BTT（Bridge to transplantation）は、心臓移植までの待機期間を乗り切るための補助を意味する。","DT（Destination therapy）は移植適応とならない患者に対する最終治療としての補助を意味し、移植への橋渡しではない。","BTD（Bridge to decision）は治療方針が未確定な急性重症例に対し、方針決定までの一時的な補助を意味し、心臓移植への橋渡しそのものを指す用語ではない。"]},{"stem":"近年、本邦でも適応が拡大している補助人工心臓の目的「DT（Destination therapy）」が意味するものはどれか？","choices":["不全心の回復を図るための短期的な補助","心臓移植までの待機期間の補助","末期重症心不全患者に対する最終治療","次の補助人工心臓への橋渡し","他臓器障害等により移植適応判定ができない患者の状態維持"],"correct":2,"expl":["これはBTR（Bridge to recovery）の説明である。","これはBTT（Bridge to transplantation）の説明である。","（正解）DT（Destination therapy）は末期重症心不全患者に対する最終治療を意味し、近年は65歳の年齢制限が原則なくなり適応が拡大している。","次の補助人工心臓への橋渡しはbridge to bridgeの説明であり、DTの説明ではない。","これはBTC（Bridge to candidacy）の説明である。"]},{"stem":"現在、植込型補助人工心臓の主流となっている血液ポンプの駆動方式はどれか？","choices":["空気駆動式拍動流ポンプ","体外設置型遠心ポンプ","連続流型ポンプ（遠心式・軸流式）","サック型拍動流ポンプ","ローラーポンプ"],"correct":2,"expl":["空気駆動式拍動流ポンプは体外設置型VADの初期の方式であり、現在の植込型VADの主流ではない。","体外設置型遠心ポンプはECMO等に用いられる方式であり、植込型VADの主流を表す記述ではない。","（正解）連続流型ポンプ（遠心式・軸流式）は構造が簡明で小型化が可能であり、体内への植込みが容易なため、現在の植込型VADの主流となっている。","サック型拍動流ポンプは初期の植込型VADで用いられた方式であり、現在の主流ではない。","ローラーポンプは体外循環の血液ポンプとして用いられる方式であり、植込型VADには使用されない。"]},{"stem":"HeartMate 3などの新しい遠心式植込型VADにおいて、回転軸周囲の血栓形成を克服するために採用されているポンプの支持方式はどれか？","choices":["メカニカルベアリング","磁気浮上方式","空気圧駆動方式","セグメント化ポリウレタン","動圧軸受方式（ハイドロダイナミックベアリング）"],"correct":1,"expl":["メカニカルベアリング（機械軸受）は羽根車が軸受と接触するため血栓形成のリスクが残る旧来の方式であり、HeartMate 3などの克服策ではない。","（正解）HeartMate 3やDuraHeartなどは、磁気浮上方式により羽根車が非接触で回転することで、回転軸周囲の血栓形成リスクを大幅に低下させている。","空気圧駆動方式は体外設置型拍動流ポンプの駆動方式であり、遠心式植込型VADの軸支持方式ではない。","セグメント化ポリウレタンは拍動流ポンプの血液接触面などに用いられる素材であり、軸支持方式ではない。","動圧軸受方式（ハイドロダイナミックベアリング）は血液の流れを利用して非接触に近い状態を作る方式で一部のポンプに用いられるが、HeartMate 3で採用されているのは磁気浮上方式である。"]},{"stem":"重症心不全の病態分類「INTERMACS分類」において、ECMOやImpellaなどの緊急的な補助循環が必要となる「プロファイル1」が意味する状態はどれか？","choices":["安静時にも症状があるが、血行動態は安定している","頻回に心不全増悪による入退院を繰り返す","重度の心原性ショック（Crash and burn）","軽い労作で症状が出る","血行動態は比較的安定しているが、強心薬から離脱できない"],"correct":2,"expl":["これはINTERMACSプロファイル3〜4付近に相当する状態の説明であり、プロファイル1の説明ではない。","これはINTERMACSプロファイル3（repeated hospitalizations）に相当する状態の説明であり、プロファイル1の説明ではない。","（正解）INTERMACSプロファイル1は重度の心原性ショック（Crash and burn）であり、ECMOやImpellaなどの緊急的な補助循環が必要となる極めて重篤な状態を指す。","これはより軽症のプロファイル（プロファイル6〜7付近）に相当する状態の説明であり、プロファイル1の説明ではない。","これはINTERMACSプロファイル2（progressive decline、強心薬依存）に近い状態の説明であり、プロファイル1ほど緊急性の高い状態ではない。"]},{"stem":"植込型左心補助人工心臓（LVAD）において、最も効果的な左室の減負荷（unloading）を得るために一般的に採用される脱血・送血部位はどれか？","choices":["右房脱血－肺動脈送血","左房脱血－大腿動脈送血","左室心尖部脱血－上行大動脈送血","大腿静脈脱血－鎖骨下動脈送血","左房脱血－上行大動脈送血"],"correct":2,"expl":["右房脱血－肺動脈送血はRVAD（右心補助）の構成であり、LVADの脱送血部位ではない。","左房脱血は左室心尖部脱血に比べて左室減負荷効果が劣るため、最も効果的なunloadingを得る目的では一般的に採用されない。","（正解）左房脱血に比べて左室心尖部脱血の方が、より効果的な左室減負荷（unloading）が可能となるため、植込型LVADで一般的に採用されている。","大腿静脈脱血－鎖骨下動脈送血は経皮的な補助循環（V-A ECMO等）に近い構成であり、植込型LVADの一般的な脱送血部位ではない。","左房脱血は左室心尖部脱血に比べて左室減負荷効果が劣るため、最も効果的なunloadingを得る目的では一般的に採用されない。"]},{"stem":"体外設置型VADを管理する際、血液ポンプが理想的に作動している状態を表す用語はどれか？","choices":["Full fill - full empty（完全充満完全駆出）","Systolic unloading","Diastolic augmentation","Auto regulation","Partial fill - partial empty（部分充満部分駆出）"],"correct":0,"expl":["（正解）体外設置型VADでは、血液ポンプが常に完全充満完全駆出状態（full fill - full empty）となるように管理することが、理想的な作動状態とされる。","Systolic unloadingという用語は体外設置型VADの理想的作動状態を表す標準的な用語ではない。","Diastolic augmentationはIABPの拡張期増大効果を表す用語であり、VADの作動状態を表す用語ではない。","Auto regulation（自己調節能）は生体の血流調節機構を表す一般的な生理学用語であり、体外設置型VADの理想的作動状態を表す用語ではない。","部分充満部分駆出（Partial fill - partial empty）は血液の停滞・血栓形成のリスクがあり、理想的な作動状態とはいえない。"]},{"stem":"LVAD（左心補助人工心臓）装着後に、潜在していた「右心不全」が顕在化する主な原因として正しいものはどれか？","choices":["肺血管抵抗の異常な低下","左室の減圧に伴う心室中隔の偏移と、心拍出量増加による右心系前負荷の増大","ヘパリン起因性血小板減少症（HIT）の併発","三尖弁の器質的な癒着","右室心筋虚血の進行"],"correct":1,"expl":["肺血管抵抗の低下はむしろ右心系への負荷を軽減する方向に働き、右心不全の顕在化の主因とはならない。","（正解）LVAD導入により心拍出量が増して右心系の前負荷が増大し、同時に左室の減圧による心室中隔の右室側への偏移が生じることで、右心機能低下を招来する。","HIT（ヘパリン起因性血小板減少症）は血栓症を主体とする合併症であり、右心不全顕在化の主な機序ではない。","三尖弁の器質的な癒着は右心不全の一因となりうるが、LVAD装着後に右心不全が顕在化する主な機序として一般的に説明されるものではない。","右室心筋虚血の進行は右心不全の原因となりうるが、LVAD装着後に右心不全が顕在化する主な機序として一般的に説明されるものではない。"]},{"stem":"VAD装着患者に神経学的異常所見（頭痛など）が認められた際、抗凝固療法の継続・中止を判断するために迅速に行うべき検査はどれか？","choices":["心電図（ECG）","経食道エコー（TEE）","頭部CT検査","脳波（EEG）","頭部MRI検査"],"correct":2,"expl":["心電図は不整脈の評価に用いるが、神経学的異常所見の原因鑑別には直接寄与しない。","経食道エコーはVAD血栓や心内血栓の評価に有用だが、神経学的異常所見出現時に最も迅速に行うべき検査ではない。","（正解）神経学的異常所見を認めた場合は、迅速に頭部CTを施行し、抗凝固療法を中止すべき出血性病変か、虚血性病変（塞栓症）かを鑑別する必要がある。","脳波はてんかん等の評価に有用だが、出血性病変か虚血性病変かの鑑別を迅速に行う検査としては頭部CTが優先される。","頭部MRI検査はより詳細な評価に有用だが、撮像時間が長く緊急時の初期評価としては頭部CTが優先される。"]},{"stem":"本邦において、体格の小さな小児に対するBTT（心臓移植への橋渡し）として唯一適応となる体外設置型補助人工心臓はどれか？","choices":["HeartMate 3","Jarvik 2000","Berlin Heart EXCOR Pediatric","EVAHEART 2","Impella 5.5 SmartAssist"],"correct":2,"expl":["HeartMate 3は成人向けの植込型LVADであり、体格の小さな小児には適応できない。","Jarvik 2000は成人向けの植込型VADであり、体格の小さな小児のBTTとして本邦で唯一適応となるものではない。","（正解）小児は体格が小さく植込型VADの装着に制限があるため、体外設置型であるBerlin Heart社のEXCOR Pediatricが、体格の小さな小児に対するBTTとして本邦で唯一の適応となる。","EVAHEART 2は成人向けの植込型LVADであり、体格の小さな小児には適応できない。","Impella 5.5 SmartAssistは経皮的または外科的に短期間使用する補助循環デバイスであり、小児のBTTとして用いられる体外設置型補助人工心臓ではない。"]},{"stem":"EXCOR Pediatricの血液ポンプにおいて、万一の膜損傷による血液漏出を回避するため、血液チャンバーと空気チャンバーを区画するメンブレンは何層構造になっているか？","choices":["1層","2層","3層","4層","5層"],"correct":2,"expl":["1層構造では損傷時に血液が空気チャンバーへ漏出するリスクが高く、EXCOR Pediatricの設計とは異なる。","EXCOR Pediatricのメンブレンは2層ではなく3層構造である。","（正解）EXCOR Pediatricのメンブレンは3層構造になっており、万一の膜損傷による血液漏出をできる限り回避するよう設計されている。","EXCOR Pediatricのメンブレンは4層ではなく3層構造である。","EXCOR Pediatricのメンブレンは5層ではなく3層構造である。"]},{"stem":"国産の植込型VAD「EVAHEART 2」に採用されている、左室内に突出せずカニューレ周辺の血液鬱滞を起こさない構造のものはどれか？","choices":["ピッグテールカテーテル","ダブルチップレスカニューレ（DCTカニューレ）","two-stageカニューレ","アバロンカテーテル","ベントカニューレ"],"correct":1,"expl":["ピッグテールカテーテルはIABPなどの先端形状を表す用語であり、EVAHEART 2の脱血カニューレの構造ではない。","（正解）EVAHEART 2はダブルチップレスカニューレ（DCTカニューレ）を採用しており、左室内に突出せず、カニューレ周辺の血液鬱滞を起こさない構造となっている。","two-stageカニューレは体外循環の静脈脱血に用いられるカニューレの種類であり、EVAHEART 2の構造ではない。","アバロンカテーテルはV-V ECMOなどに用いられる二段脱血・送血兼用カニューレであり、EVAHEART 2の構造ではない。","ベントカニューレは心内血液を排出するためのカニューレであり、EVAHEART 2の脱血カニューレの構造ではない。"]},{"stem":"植込型VADの安定期における抗凝固療法として、一般的に推奨されている薬剤の組み合わせはどれか？","choices":["ヘパリン単独","メシル酸ナファモスタット単独","アスピリン＋ワルファリン","クロピドグレル＋アルガトロバン","アスピリン単独"],"correct":2,"expl":["ヘパリン単独は主に周術期や急性期に用いられる抗凝固法であり、植込型VAD安定期の一般的な維持療法ではない。","メシル酸ナファモスタット単独は体外循環中の抗凝固に用いられることがあるが、植込型VAD安定期の一般的な維持療法ではない。","（正解）植込型VADの安定期には、抗血小板薬のアスピリンと抗凝固薬のワルファリンを併用した管理が一般的に推奨されており、機種ごとに目標とするPT-INRが設定されている。","クロピドグレル＋アルガトロバンという組み合わせは植込型VAD安定期の一般的な推奨療法ではない。","アスピリン単独では抗凝固作用が不十分であり、ワルファリンとの併用が一般的に推奨される。"]},{"stem":"大規模臨床試験（MOMENTUM 3）において、遠心ポンプ（HeartMate 3）が軸流ポンプ（HeartMate II）よりも有意に発生率が低く、成績が優れていた合併症はどれか？","choices":["肝障害","主要な感染","ポンプ内血栓、脳卒中、胃腸管出血","呼吸障害","創部感染"],"correct":2,"expl":["MOMENTUM 3試験で有意差が示された主要な合併症として肝障害は挙げられていない。","主要な感染についてはMOMENTUM 3試験で有意な発生率の低下が示された項目としては挙げられていない。","（正解）MOMENTUM 3試験において、HeartMate 3はHeartMate IIに比べ、ポンプ内血栓、脳卒中、胃腸管出血の発生率が有意に低いことが示された。","呼吸障害はMOMENTUM 3試験で有意差が示された主要な合併症としては挙げられていない。","創部感染はMOMENTUM 3試験で有意差が示された主要な合併症としては挙げられていない。"]},{"stem":"右心補助人工心臓（RVAD）が必要となった場合、一般的な脱血部位と送血部位の組み合わせはどれか？","choices":["左房脱血－大腿動脈送血","右房脱血－上行大動脈送血","右房脱血－肺動脈送血","右室脱血－鎖骨下動脈送血","右房脱血－大腿動脈送血"],"correct":2,"expl":["左房脱血－大腿動脈送血はLVADや一部のECMO構成に近く、RVADの一般的な脱送血部位ではない。","上行大動脈送血はLVADの送血部位であり、RVADでは肺循環へ送血するため上行大動脈送血は用いられない。","（正解）RVADの場合は、右房から脱血し、肺動脈へ送血する経路が一般的である。","鎖骨下動脈送血は体循環系への送血であり、RVAD（肺循環への補助）の送血部位ではない。","大腿動脈送血は体循環系への送血であり、RVAD（肺循環への補助）の送血部位ではない。"]},{"stem":"補助人工心臓（VAD）の導入目的に関する用語とその説明の組み合わせとして「誤っている」ものはどれか？","choices":["BTR（Bridge to recovery）－循環を代行し心臓の負荷を軽減しつつ、不全心の回復を図る","BTC（Bridge to candidacy）－全身循環を正常に維持し臓器・組織血流を改善し、心移植登録を目指す","BTT（Bridge to transplantation）－心臓移植までの橋渡しをする","Bridge to bridge－末期重症心不全患者に対する最終治療を行う","DT（Destination therapy）－末期重症心不全の最終治療を行う"],"correct":3,"expl":["誤りではない（正しい記述）。BTR（Bridge to recovery）は、循環を代行し心臓の負荷を軽減しつつ不全心の回復を図る目的を意味する。","誤りではない（正しい記述）。BTC（Bridge to candidacy）は、全身循環を正常に維持し臓器・組織血流を改善して心移植登録を目指す目的を意味する。","誤りではない（正しい記述）。BTT（Bridge to transplantation）は、心臓移植までの橋渡しをする目的を意味する。","（正解＝誤っている）Bridge to bridgeは、次の補助人工心臓までの橋渡しをする目的を意味し、末期重症心不全患者に対する最終治療を行うことを意味するものではない。末期重症心不全の最終治療はDT（Destination therapy）の説明である。","誤りではない（正しい記述）。DT（Destination therapy）は、末期重症心不全の最終治療を行う目的を意味する。"]}]},{"title":"第19章：諸問題とその対策","code":"issues","questions":[{"stem":"輸血に伴う合併症のうち、供血者の抗白血球抗体が補体活性化などを引き起こし、肺毛細血管の透過性亢進をもたらす「輸血関連急性肺障害」の略称はどれか？","choices":["TRIM","TRALI","GVHD","SIRS","DIC"],"correct":1,"expl":["TRIM（輸血関連免疫調節）は輸血による免疫機能の変化（低下）を指す概念であり、急性肺障害を表す略称ではない。","（正解）TRALI（輸血関連急性肺障害）は供血者の抗白血球抗体などが原因で起こる肺障害であり、肺毛細血管の透過性亢進をもたらす。","GVHD（移植片対宿主病）は輸血に伴うリンパ球の生着によって生じる合併症であり、急性肺障害を表す略称ではない。","SIRS（全身性炎症反応症候群）は人工心肺などによって引き起こされる全身性の炎症反応を指す概念であり、輸血関連急性肺障害の略称ではない。","DIC（播種性血管内凝固症候群）は凝固異常を主体とする病態であり、輸血関連急性肺障害の略称ではない。"]},{"stem":"術前自己血貯血において、自己MAP血（赤血球保存用添加液を混和した血液）の保存可能期間はどれくらいか？","choices":["1週間","3週間","6週間","3ヵ月","6ヵ月"],"correct":2,"expl":["1週間は自己MAP血の保存可能期間としては短すぎる。","3週間は自己CPD血（添加液を用いない自己血）の保存可能期間であり、自己MAP血の保存可能期間ではない。","（正解）自己血の保存期間は、自己CPD血で3週間、自己MAP血（赤血球保存用添加液を混和した血液）で6週間とされている。","3ヵ月は自己MAP血の保存可能期間としては長すぎる。","6ヵ月は自己MAP血の保存可能期間としては長すぎる。"]},{"stem":"術前自己血貯血の「非適応（禁忌）」となる患者の状態はどれか？","choices":["菌血症の恐れのある細菌感染患者","心房中隔欠損症（ASD）の患者","僧帽弁閉鎖不全症（MR）の患者","軽度の貧血（Hb 11g/dL程度）の患者","安定狭心症でコントロール良好な患者"],"correct":0,"expl":["（正解）菌血症の恐れのある細菌感染患者、重度大動脈弁狭窄症、不安定狭心症、NYHA IV度の心不全症例などは自己血貯血の非適応（禁忌）とされる。","心房中隔欠損症（ASD）の患者であること自体は、自己血貯血の禁忌理由とはならない。","僧帽弁閉鎖不全症（MR）の患者であること自体は、自己血貯血の禁忌理由とはならない。","軽度の貧血（Hb 11g/dL程度）は自己血貯血が可能な範囲であり、禁忌理由とはならない。","コントロール良好な安定狭心症は、不安定狭心症とは異なり自己血貯血の禁忌理由とはならない。"]},{"stem":"人工心肺の充填液量を削減し、自己血で回路を満たす「自己血充填法」のうち、動脈送血カニューレから逆行性に血液と置換する方法の略称はどれか？","choices":["AAP","RAP","MUF","VAVD","DUF"],"correct":1,"expl":["AAP（antegrade autologous priming）は静脈側から順行性に充填液を患者血液と置換する方法であり、動脈側からの逆行性の方法ではない。","（正解）RAP（retrograde autologous priming）は、動脈送血カニューレ（送血回路）から逆行性に充填液を患者血液と置換する方法である。","MUF（modified ultrafiltration）は体外循環後の血液濃縮法であり、自己血充填法ではない。","VAVD（vacuum assisted venous drainage）は体外循環における脱血補助法であり、自己血充填法ではない。","DUF（dilutional ultrafiltration）は体外循環中の血液濃縮法であり、自己血充填法ではない。"]},{"stem":"制限的な輸血戦略（先進的な取り組み）において、臨床症状が許容される場合、赤血球輸血のトリガー（基準）となるヘモグロビン（Hb）値はどれか？","choices":["Hb \u003c 10 g/dL","Hb \u003c 9 g/dL","Hb \u003c 7 g/dL","Hb \u003c 5 g/dL","Hb \u003c 8 g/dL"],"correct":2,"expl":["Hb\u003c10 g/dLは出血が持続している場合などに用いられる基準であり、制限的輸血戦略における臨床症状許容時の基準としては高めである。","Hb\u003c9 g/dLは制限的輸血戦略として紹介されている基準値ではない。","（正解）臨床症状が許容される場合、Hb\u003c7 g/dLを基準に赤血球1単位を輸血するアルゴリズムが、制限的な輸血戦略として紹介されている。","Hb\u003c5 g/dLは低すぎる基準であり、一般的な制限的輸血戦略の基準としては用いられない。","Hb\u003c8 g/dLは制限的輸血戦略として紹介されている基準値ではない。"]},{"stem":"近年、抗凝固療法の中心となっている「Xa阻害薬」の中和薬として使用されるが、強力なヘパリン抵抗性をもたらすため人工心肺前に用いると血栓症などの重篤な合併症を引き起こす恐れがある薬剤はどれか？","choices":["硫酸プロタミン","アンデキサネットアルファ","メシル酸ナファモスタット","アルガトロバン","イダルシズマブ"],"correct":1,"expl":["硫酸プロタミンはヘパリンの中和薬であり、Xa阻害薬の中和薬ではない。","（正解）アンデキサネットアルファ（オンデキサ静注用）はXa阻害薬の中和薬であるが、強力なヘパリン抵抗性があるため、人工心肺前に用いると重篤な血栓症の懸念があり慎重な対応が推奨されている。","メシル酸ナファモスタットは体外循環中の抗凝固に用いられる薬剤であり、Xa阻害薬の中和薬ではない。","アルガトロバンは抗トロンビン薬であり、Xa阻害薬の中和薬ではない。","イダルシズマブはダビガトラン（トロンビン阻害薬）の中和薬であり、Xa阻害薬の中和薬ではない。"]},{"stem":"人工心肺に伴う全身性炎症反応（SIRS）を引き起こす主要なメカニズムに「含まれない」ものはどれか？","choices":["血液の非内皮組織との接触活性","虚血再灌流障害","エンドトキシン血症（グラム陰性桿菌由来のリポ多糖による内因性炎症惹起）","赤血球の膨化","補体系の活性化を伴う血液の異物表面との接触"],"correct":3,"expl":["含まれる（正しい）。血液が人工心肺回路の非内皮組織表面（異物表面）に接触することで凝固・炎症系が活性化されることは、SIRSを引き起こす主要メカニズムの一つである。","含まれる（正しい）。大動脈遮断解除後などに生じる虚血再灌流障害は、SIRSを引き起こす主要メカニズムの一つである。","含まれる（正しい）。腸管虚血などに伴うエンドトキシン血症は、SIRSを引き起こす主要メカニズムの一つである。","（正解＝含まれない）人工心肺に伴うSIRSの主要メカニズムは、①血液の非内皮組織との接触活性、②虚血再灌流障害、③エンドトキシン血症の3つであり、赤血球の膨化（溶血に伴う現象）はこれらの主要メカニズムには含まれない。","含まれる（正しい）。血液が異物表面に接触することによる補体系の活性化は、①の接触活性化と同じ機序に含まれる現象であり、SIRSを引き起こす主要メカニズムに含まれる。"]},{"stem":"血液凝固接触相の活性化によって生成される「カリクレイン」が、高分子キニノーゲンに作用して遊離させる、強い血管拡張・透過性亢進作用を持つ物質はどれか？","choices":["ブラディキニン","セロトニン","トロンボキサンA2","プラスミン","ヒスタミン"],"correct":0,"expl":["（正解）接触相の活性化により、高分子キニノーゲンからブラディキニンが遊離し、血管拡張や浮腫などの炎症反応の初期段階を形成する。","セロトニンは血小板から放出される血管作動性物質であり、カリクレインが高分子キニノーゲンに作用して生成される物質ではない。","トロンボキサンA2は血小板から産生される血管収縮・血小板凝集促進物質であり、カリクレインの作用による生成物ではない。","プラスミンは線溶系の主要な酵素であり、カリクレインが高分子キニノーゲンに作用して生成される物質ではない。","ヒスタミンは肥満細胞から放出される血管作動性物質であり、カリクレインが高分子キニノーゲンに作用して生成される物質ではない。"]},{"stem":"ヘパリンコーティング回路のうち、「共有結合法」の特徴として正しいものはどれか？","choices":["血液滞留部の抗血栓性が非常に高い","ヘパリン活性の安定性が高く、血中への溶出が少ない","製造工程が単純で安価である","イオン結合法よりも効果の持続性が短い","ヘパリンが遊離しやすく抗血栓効果が短時間で消失する"],"correct":1,"expl":["共有結合法はヘパリンが強固に結合しているため血液滞留部の抗血栓性はイオン結合法に比べて低いとされる。","（正解）共有結合法はヘパリンが強固に結合しているため活性が安定し、血中への溶出が少ないという長所がある。","共有結合法は製造工程が複雑で高価という短所がある。","共有結合法はイオン結合法よりも効果の持続性が長いとされる。","共有結合法はヘパリンが強固に結合しているため、遊離しにくく抗血栓効果の持続性が長い。"]},{"stem":"高分子ポリマーコーティング（非生物由来）のうち、テルモ社の人工肺（X Coating）に用いられている親水性ポリマーはどれか？","choices":["MPC（ホスホリルコリン）","PMEA（ポリ2-メトキシエチルアクリレート）","GPR","PEO","ポリウレタン"],"correct":1,"expl":["MPC（ホスホリルコリン）はPHISIOやLegacoatなどに使用される脂質性モノマーであり、テルモ社のX Coatingに用いられているポリマーではない。","（正解）テルモ社の人工肺（X Coating）にはPMEA（ポリ2-メトキシエチルアクリレート）が使用されている。","GPRはテルモ社のX Coatingに用いられているポリマーではない。","PEO（ポリエチレンオキサイド）はテルモ社のX Coatingに用いられているポリマーではない。","ポリウレタンは回路チューブ等の基材として用いられる素材であり、X Coatingの親水性ポリマーではない。"]},{"stem":"虚血再灌流障害の原因となる「活性酸素（ROS）」による酸化ストレスを軽減し、抗炎症作用を有すると考えられ、使用が試みられている静脈麻酔薬はどれか？","choices":["プロポフォール","イソゾール","ミダゾラム","ロクロニウム","フェンタニル"],"correct":0,"expl":["（正解）プロポフォールやセボフルレン、L-アルギニンなどは抗酸化作用を示し、酸化ストレスを抑制することで術後合併症を回避する試みがなされている静脈麻酔薬である。","イソゾール（チオペンタール系）は抗酸化作用による使用が試みられている薬剤としては挙げられていない。","ミダゾラムはベンゾジアゼピン系の鎮静薬であり、抗酸化作用による使用が試みられている薬剤としては挙げられていない。","ロクロニウムは筋弛緩薬であり、抗酸化作用を目的とした静脈麻酔薬ではない。","フェンタニルはオピオイド系鎮痛薬であり、抗酸化作用を目的とした静脈麻酔薬ではない。"]},{"stem":"心臓大血管手術で遭遇する大量出血患者に対し、フィブリノゲン製剤（乾燥ヒトフィブリノゲン）の投与を考慮するトリガーとなる血漿フィブリノゲン値の基準はどれか？","choices":["300 mg/dL 未満","200 mg/dL 未満","150 mg/dL 未満","50 mg/dL 未満","100 mg/dL 未満"],"correct":2,"expl":["300 mg/dL未満はフィブリノゲン製剤投与のトリガーとしては高すぎる基準である。","200 mg/dL未満はガイドラインで示されているフィブリノゲン製剤投与のトリガー基準ではない。","（正解）大量出血症例に対するガイドラインでは、血漿フィブリノゲン値\u003c150 mg/dLをトリガーとしてフィブリノゲン製剤を用いることが弱く推奨されている。","50 mg/dL未満はフィブリノゲン製剤投与のトリガーとしては低すぎる（対応が遅れる）基準である。","100 mg/dL未満はガイドラインで示されているフィブリノゲン製剤投与のトリガー基準ではない。"]},{"stem":"大動脈全域にわたる潰瘍を伴う脆弱な粥状硬化を示し、脳塞栓症など各臓器の塞栓症リスクが極めて高い大動脈の病態を何と呼ぶか？","choices":["Shaggy aorta（シャギーアオルタ）","Porcelain aorta（ポーセリンアオルタ）","エンドリーク","偽腔開存型解離","大動脈縮窄症"],"correct":0,"expl":["（正解）Shaggy aorta（シャギーアオルタ）は脆弱な粥状硬化（潰瘍）が大動脈全域にわたって多発している病態であり、塞栓症リスクが非常に高いため、送血部位の工夫や大動脈ノンタッチテクニックなどの対策が必要となる。","Porcelain aorta（ポーセリンアオルタ）は大動脈壁が広範に石灰化した病態であり、遮断鉗子の使用が困難になることが問題となるが、Shaggy aortaとは異なる病態である。","エンドリークはステントグラフト内挿術後に瘤内へ血流が残存する合併症であり、大動脈壁の粥状硬化を表す用語ではない。","偽腔開存型解離は大動脈解離における偽腔の状態を表す用語であり、粥状硬化による塞栓症リスクを表す用語ではない。","大動脈縮窄症は大動脈の先天的な狭窄病変であり、粥状硬化による塞栓症リスクを表す用語ではない。"]},{"stem":"NO（一酸化窒素）吸入療法の作用機序として正しいものはどれか？","choices":["血管平滑筋の細胞内でcAMPを減少させ血管を収縮する","血管平滑筋の細胞内でcGMPを増加させ血管を拡張する","交感神経のα受容体を直接遮断する","エンドセリンの分泌を促進する","血管内皮細胞のNO受容体を遮断する"],"correct":1,"expl":["NOはcAMPではなくcGMPを増加させることで作用する。また血管を収縮ではなく拡張させる。","（正解）吸入されたNOは血管平滑筋細胞内のグアニル酸シクラーゼを活性化してcGMPを増加させ、血管平滑筋を弛緩（拡張）させる。","NOは交感神経のα受容体を直接遮断する薬剤ではない。","エンドセリンは血管収縮物質であり、NOはエンドセリンの分泌を促進するのではなく、血管拡張作用を示す。","NOは受容体を介するのではなく、グアニル酸シクラーゼを活性化することで作用する。「NO受容体を遮断する」という記述はNOの作用機序として誤りである。"]},{"stem":"NO吸入療法が、体血管拡張には作用せず「肺血管のみを選択的」に拡張させる理由はどれか？","choices":["NOの分子が大きすぎて肺の毛細血管を通過できないため","血液中の白血球に直ちに貪食されるため","血管内でヘモグロビンと結合して数秒で不活化されるため","肺以外の血管にはNO受容体が存在しないため","NOは経気道的にしか吸収されないため"],"correct":2,"expl":["NOは分子量が非常に小さい気体分子であり、肺毛細血管を通過できないという記述は誤りである。","NOが白血球に直ちに貪食されるという機序は、NOが肺血管のみを選択的に拡張させる理由として説明されるものではない。","（正解）NOは血管内でヘモグロビンと結合して数秒で不活化されるため、体循環に回る前に作用を失い、結果として肺血管のみを選択的に拡張させる。","NOはグアニル酸シクラーゼの活性化を介して作用するのであり、肺以外の血管にNO受容体が存在しないという記述は誤りである。","NOは吸入経路から肺胞・肺血管に作用するが、「経気道的にしか吸収されない」という記述自体が選択的肺血管拡張の理由の説明として適切ではない。"]},{"stem":"NO吸入療法の開始時の一般的な吸入濃度（成人）はどれか？","choices":["1 ppm","5 ppm","20 ppm","100 ppm","40 ppm"],"correct":2,"expl":["1 ppmは開始時の吸入濃度としては低すぎる。","5 ppmはNO吸入療法の一般的な開始濃度としては用いられない。","（正解）成人の場合の用量は、吸入濃度20 ppmで開始し、効果不十分の場合は40 ppmまで増量することが一般的である。","100 ppmは過剰な濃度であり、メトヘモグロビン血症などの副作用リスクが高くなる。","40 ppmは効果不十分な場合の増量後の濃度であり、開始時の濃度ではない。"]},{"stem":"人工心肺の安全装置の考え方で、「エラーが発生しても安全な状態に導く」仕組みのことを何と呼ぶか？","choices":["フールプルーフ","フェイルセーフ","タイムアウト","ダブルチェック","インシデントレポート"],"correct":1,"expl":["フールプルーフは操作ミスを未然に防ぐ仕組み（誤接続できないコネクタ形状など）を指し、エラー発生後に安全な状態に導く仕組みとは異なる。","（正解）フェイルセーフは、エラーが発生した場合でも被害を最小限に抑え、安全な状態に導く仕組みを指す。","タイムアウトは手術開始前に患者・術式等を確認する安全確認手順であり、エラー発生時の安全確保の仕組みではない。","ダブルチェックは複数人での確認によりエラーの発生自体を防ぐ仕組みであり、エラー発生後に安全な状態に導く仕組みとは異なる。","インシデントレポートはエラーやヒヤリハット事例を報告・共有する仕組みであり、エラー発生時に直接安全な状態へ導く仕組みではない。"]},{"stem":"緊急事態における情報伝達の手段として推奨される「SBAR」に含まれないものはどれか？","choices":["Situation（状況）","Background（背景）","Assessment（評価）","Reason（原因）","Recommendation（提案）"],"correct":3,"expl":["含まれる（正しい）。Situation（状況）はSBARの構成要素の一つである。","含まれる（正しい）。Background（背景）はSBARの構成要素の一つである。","含まれる（正しい）。Assessment（評価）はSBARの構成要素の一つである。","（正解＝含まれない）SBARはSituation（状況）、Background（背景）、Assessment（評価）、Recommendation（提案）の4項目の頭文字であり、Reason（原因）はSBARの構成要素に含まれない。","含まれる（正しい）。Recommendation（提案）はSBARの構成要素の一つである。"]},{"stem":"手術室やICUなどの生命維持管理装置使用室において、非接地配線方式（絶縁トランスを介した非接地配線）を採用する主な目的はどれか？","choices":["電源電圧を安定化させ、機器への電力供給を一定に保つため","一線地絡が発生した場合でも、直ちに感電や電源遮断（全停電）を生じさせないため","消費電力を削減し、省エネルギーを図るため","電磁波ノイズの発生を抑制し、医用機器の誤作動を防ぐため","三相交流を単相交流に変換し、機器の互換性を高めるため"],"correct":1,"expl":["誤り。電源電圧の安定化は非接地配線方式の主目的ではない。電圧の安定化には別途、自動電圧調整器（AVR）などが用いられる。","（正解）非接地配線方式では、絶縁トランスにより二次側を大地から絶縁（非接地化）するため、電路の一線が地絡（漏電）しても対地間に閉回路が形成されず、直ちに感電（マクロショック）や漏電遮断器の動作による全停電が生じない。生命維持管理装置の運転を継続したまま、絶縁監視装置の警報により地絡箇所の点検・修理を行うことができる。","誤り。省エネルギーは非接地配線方式の目的ではない。","誤り。電磁波ノイズ抑制は非接地配線方式の主目的ではない。","誤り。三相交流から単相交流への変換は非接地配線方式の目的ではなく、絶縁トランスの機能とは別の問題である。"]},{"stem":"非接地配線方式が採用されている回路において、絶縁状態を常時監視し、地絡（漏電）の発生を警報で知らせる装置を何と呼ぶか？","choices":["漏電遮断器（ELB）","絶縁監視装置（LIM：Line Isolation Monitor）","無停電電源装置（UPS）","サージ防護デバイス（SPD）","自動電圧調整器（AVR）"],"correct":1,"expl":["誤り。漏電遮断器（ELB）は地絡発生時に電路を遮断する装置であり、非接地配線方式の回路には設置しない（遮断されると生命維持管理装置が停止してしまうため）。","（正解）絶縁監視装置（LIM：Line Isolation Monitor）は、非接地配線方式の回路の絶縁状態（対地インピーダンス）を常時監視し、地絡が発生して絶縁抵抗が一定値以下に低下すると警報を発する装置である。警報が出ても電源は遮断されず、生命維持管理装置の運転を継続しながら点検できる。","誤り。無停電電源装置（UPS）は停電時に電力を供給し続けるための装置であり、絶縁状態の監視を行う装置ではない。","誤り。サージ防護デバイス（SPD）は落雷等による過電圧（サージ）から機器を保護する装置であり、絶縁状態の監視を行う装置ではない。","誤り。自動電圧調整器（AVR）は電源電圧を一定に保つための装置であり、絶縁状態の監視を行う装置ではない。"]},{"stem":"医療施設における非常用電源の分類のうち、停電から電圧確立までの時間が最も短く（無停電に近く）、人工心肺装置や人工呼吸器などの生命維持管理装置に接続することが求められる電源はどれか？","choices":["一般非常電源（40秒以内に電圧確立）","特別非常電源（10秒以内に電圧確立）","瞬時特別非常電源（0.5秒以内、無停電電源装置を含む）","商用電源のみ（非常用電源に接続しない）","自家用発電機の始動を待つ通常電源"],"correct":2,"expl":["誤り。一般非常電源（40秒以内）は自家発電設備の起動を待つため停電時間が生じ、生命維持管理装置への電源としては停止時間が長すぎる。","誤り。特別非常電源（10秒以内）でも数秒間の停電が生じるため、生命維持管理装置に接続する電源としては瞬時特別非常電源に劣る。","（正解）瞬時特別非常電源は無停電電源装置（UPS）などにより0.5秒以内（実質的にほぼ無停電）で電圧が確立されるため、人工心肺装置や人工呼吸器などの生命維持管理装置のコンセントに接続することが求められる。","誤り。生命維持管理装置を商用電源のみに接続すると、停電時に装置が停止し重大な事故につながる恐れがある。","誤り。自家用発電機の始動を待つのみの電源は、起動までに時間を要するため生命維持管理装置に適さない。"]}]}]</script>
<script>
(function(){
  "use strict";
  var MARKS = ["①","②","③","④","⑤"];
  var DATA = JSON.parse(document.getElementById('quiz-data').textContent);
  var TOTAL_Q = DATA.reduce(function(s,c){ return s + c.questions.length; }, 0);
  document.getElementById('brand-sub').textContent = '分野別練習・模擬試験（全'+DATA.length+'章 '+TOTAL_Q+'問）';

  // ---------- persisted light prefs (per-viewer convenience only) ----------
  function loadPrefs(){
    try{
      var raw = localStorage.getItem('ecc-quiz-prefs');
      return raw ? JSON.parse(raw) : {};
    }catch(e){ return {}; }
  }
  function savePrefs(p){
    try{ localStorage.setItem('ecc-quiz-prefs', JSON.stringify(p)); }catch(e){}
  }
  var prefs = loadPrefs();

  // ---------- state ----------
  var state = {
    mode: 'practice',      // 'practice' | 'exam' -- set when a session starts
    examCount: prefs.examCount || 50,
    examScope: prefs.examScope || 'all',
    pool: [],        // array of {chapterTitle, stem, choices, correct, expl, tag}
    order: [],       // indices into pool, in play order
    idx: 0,
    answers: [],     // selected choice index per pool item, null if unanswered
  };

  function $(id){ return document.getElementById(id); }

  function shuffle(arr){
    for(var i=arr.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=arr[i]; arr[i]=arr[j]; arr[j]=t;
    }
    return arr;
  }

  function splitTitle(title){
    var i = title.indexOf('：');
    if(i === -1) return {badge:'', name:title};
    return {badge:title.slice(0,i), name:title.slice(i+1)};
  }

  // ---------- HOME: 分野別練習 chapter accordion ----------
  function renderChapterList(){
    var list = $('chapter-list');
    list.innerHTML = '';
    DATA.forEach(function(ch, i){
      var parts = splitTitle(ch.title);
      var card = document.createElement('div');
      card.className = 'chapter-card';
      card.setAttribute('data-open', 'false');
      card.setAttribute('data-idx', String(i));

      var head = document.createElement('button');
      head.type = 'button';
      head.className = 'chapter-head';
      head.innerHTML =
        '<span class="chapter-badge">'+(i+1)+'</span>' +
        '<span class="chapter-info">' +
          '<span class="chapter-name">'+escapeHtml(parts.name)+'</span>' +
          '<span class="chapter-count">全'+ch.questions.length+'問</span>' +
        '</span>' +
        '<span class="chapter-chevron">▾</span>';
      head.addEventListener('click', function(){
        var willOpen = card.getAttribute('data-open') !== 'true';
        document.querySelectorAll('.chapter-card').forEach(function(c){ c.setAttribute('data-open','false'); });
        card.setAttribute('data-open', willOpen ? 'true' : 'false');
      });

      var body = document.createElement('div');
      body.className = 'chapter-body';

      var allBtn = document.createElement('button');
      allBtn.type = 'button';
      allBtn.className = 'qnum-all-btn';
      allBtn.textContent = '問1から通して解く';
      allBtn.addEventListener('click', function(){ startPractice(i, 0); });
      body.appendChild(allBtn);

      var label = document.createElement('div');
      label.className = 'qnum-label';
      label.textContent = 'この問題番号から解く：';
      body.appendChild(label);

      var grid = document.createElement('div');
      grid.className = 'qnum-grid';
      ch.questions.forEach(function(q, qi){
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'qnum-btn';
        b.textContent = String(qi+1);
        b.addEventListener('click', function(){ startPractice(i, qi); });
        grid.appendChild(b);
      });
      body.appendChild(grid);

      card.appendChild(head);
      card.appendChild(body);
      list.appendChild(card);
    });
  }

  // ---------- HOME: ランダム/模擬試験 selects ----------
  var EXAM_COUNT_OPTIONS = [20, 50, 100, 'all'];
  function renderExamCountSelect(){
    var sel = $('exam-count');
    sel.innerHTML = '';
    EXAM_COUNT_OPTIONS.forEach(function(n){
      var opt = document.createElement('option');
      opt.value = String(n);
      opt.textContent = (n === 'all') ? '全問（'+TOTAL_Q+'問）' : n+'問';
      sel.appendChild(opt);
    });
    sel.value = String(state.examCount);
    sel.addEventListener('change', function(){
      state.examCount = (sel.value === 'all') ? 'all' : parseInt(sel.value, 10);
      updatePoolNote();
    });
  }
  function renderExamScopeSelect(){
    var sel = $('exam-scope');
    sel.innerHTML = '';
    var optAll = document.createElement('option');
    optAll.value = 'all';
    optAll.textContent = '全'+DATA.length+'章（'+TOTAL_Q+'問）';
    sel.appendChild(optAll);
    DATA.forEach(function(ch, i){
      var opt = document.createElement('option');
      opt.value = String(i);
      opt.textContent = ch.title+'（'+ch.questions.length+'問）';
      sel.appendChild(opt);
    });
    sel.value = state.examScope;
    sel.addEventListener('change', function(){
      state.examScope = sel.value;
      updatePoolNote();
    });
  }

  function examScopePoolSize(){
    if(state.examScope === 'all') return TOTAL_Q;
    var ch = DATA[parseInt(state.examScope,10)];
    return ch ? ch.questions.length : 0;
  }
  function currentExamCount(){
    if(state.examCount === 'all') return examScopePoolSize();
    return state.examCount;
  }
  function updatePoolNote(){
    var n = examScopePoolSize();
    var want = Math.min(currentExamCount(), n);
    $('pool-note').innerHTML = '選択範囲：<strong>'+n+'</strong>問中から<strong>'+want+'</strong>問を出題（順番はシャッフルされます）';
    $('btn-start-exam').disabled = (want < 1);
  }

  $('btn-start-exam').addEventListener('click', function(){
    savePrefs({examCount: state.examCount, examScope: state.examScope});
    startExam(state.examScope, state.examCount);
  });

  // ---------- build pools & start sessions ----------
  function chapterPool(chIdx){
    var ch = DATA[chIdx];
    return ch.questions.map(function(q){
      return { chapterTitle: ch.title, stem:q.stem, choices:q.choices, correct:q.correct, expl:q.expl, tag:q.tag };
    });
  }
  function allPool(){
    var pool = [];
    DATA.forEach(function(ch){
      ch.questions.forEach(function(q){
        pool.push({ chapterTitle: ch.title, stem:q.stem, choices:q.choices, correct:q.correct, expl:q.expl, tag:q.tag });
      });
    });
    return pool;
  }

  function startPractice(chIdx, startIndex){
    state.mode = 'practice';
    var pool = chapterPool(chIdx);
    var order = [];
    for(var i=startIndex; i<pool.length; i++){ order.push(i); }
    state.pool = pool;
    state.order = order;
    state.idx = 0;
    state.answers = order.map(function(){ return null; });
    showView('view-quiz');
    renderQuestion();
  }

  function startExam(scope, count){
    state.mode = 'exam';
    var pool = (scope === 'all') ? allPool() : chapterPool(parseInt(scope,10));
    var order = shuffle(pool.map(function(_,i){ return i; }));
    var n = (count === 'all') ? pool.length : Math.min(count, pool.length);
    order = order.slice(0, n);
    state.pool = pool;
    state.order = order;
    state.idx = 0;
    state.answers = order.map(function(){ return null; });
    showView('view-quiz');
    renderQuestion();
  }

  // ---------- quiz runner ----------
  function currentQ(){
    return state.pool[state.order[state.idx]];
  }

  function renderQuestion(){
    var q = currentQ();
    var total = state.order.length;
    $('progress-label').textContent = '問 '+(state.idx+1)+' / '+total;
    $('progress-fill').style.width = Math.round(((state.idx)/total)*100)+'%';
    $('q-chapter-tag').textContent = q.chapterTitle;
    $('q-stem').textContent = q.stem;

    var answered = state.answers[state.idx];
    var showFeedback = (state.mode === 'practice') && (answered !== null);

    var listEl = $('q-choices');
    listEl.innerHTML = '';
    q.choices.forEach(function(choiceText, i){
      var b = document.createElement('button');
      b.type = 'button';
      var cls = '';
      if(answered !== null){
        if(showFeedback){
          if(i === q.correct) cls = ' correct-answer';
          else if(i === answered) cls = ' wrong-answer';
        } else if(i === answered){
          cls = ' selected';
        }
      }
      b.className = 'choice-btn'+cls;
      b.innerHTML = '<span class="cmark">'+MARKS[i]+'</span><span>'+escapeHtml(choiceText)+'</span>';
      if(answered !== null && state.mode==='practice'){ b.disabled = true; }
      b.addEventListener('click', function(){ selectAnswer(i); });
      listEl.appendChild(b);
    });

    var fbArea = $('feedback-area');
    fbArea.innerHTML = '';
    if(showFeedback){
      var isCorrect = answered === q.correct;
      var banner = document.createElement('div');
      banner.className = 'feedback-banner '+(isCorrect?'ok':'ng');
      banner.textContent = isCorrect ? '正解です' : '不正解（正解は '+MARKS[q.correct]+'）';
      fbArea.appendChild(banner);

      var explWrap = document.createElement('div');
      explWrap.className = 'expl-list';
      q.expl.forEach(function(text, i){
        var row = document.createElement('div');
        var extra = '';
        if(i === q.correct) extra = ' is-correct';
        else if(i === answered) extra = ' is-picked-wrong';
        row.className = 'expl-item'+extra;
        row.innerHTML = '<span class="emark">'+MARKS[i]+'</span><span>'+escapeHtml(text)+'</span>';
        explWrap.appendChild(row);
      });
      fbArea.appendChild(explWrap);
    }

    $('btn-prev').hidden = (state.idx === 0);
    var isLast = (state.idx === total-1);
    var nextBtn = $('btn-next');
    nextBtn.textContent = isLast ? (state.mode==='exam' ? '採点する' : '結果を見る') : '次の問題';
    nextBtn.disabled = (answered === null);
  }

  function selectAnswer(i){
    if(state.answers[state.idx] !== null && state.mode === 'practice') return; // locked after answering in practice
    state.answers[state.idx] = i;
    renderQuestion();
  }

  $('btn-prev').addEventListener('click', function(){
    if(state.idx>0){ state.idx--; renderQuestion(); }
  });
  $('btn-next').addEventListener('click', function(){
    var total = state.order.length;
    if(state.idx < total-1){
      state.idx++;
      renderQuestion();
    } else {
      showResults();
    }
  });
  $('btn-quit').addEventListener('click', function(){
    if(confirm('中断してホームに戻りますか？現在の進行状況は破棄されます。')){
      showView('view-home');
    }
  });

  // ---------- results ----------
  function showResults(){
    var total = state.order.length;
    var correctCount = 0;
    var byChapter = {}; // title -> {correct, total, order:index}
    var chapterOrder = [];

    state.order.forEach(function(poolIdx, i){
      var q = state.pool[poolIdx];
      var ok = state.answers[i] === q.correct;
      if(ok) correctCount++;
      if(!byChapter[q.chapterTitle]){
        byChapter[q.chapterTitle] = {correct:0, total:0};
        chapterOrder.push(q.chapterTitle);
      }
      byChapter[q.chapterTitle].total++;
      if(ok) byChapter[q.chapterTitle].correct++;
    });

    var pct = total ? Math.round((correctCount/total)*100) : 0;
    $('score-ring').style.setProperty('--pct', pct);
    $('score-num').textContent = pct+'%';
    $('score-caption').innerHTML = '正解 <strong>'+correctCount+'</strong> / <strong>'+total+'</strong> 問';

    var bd = $('chapter-breakdown');
    bd.innerHTML = '';
    chapterOrder.forEach(function(title){
      var c = byChapter[title];
      var rate = c.total ? Math.round((c.correct/c.total)*100) : 0;
      var row = document.createElement('div');
      row.className = 'cb-row';
      row.innerHTML =
        '<div class="cb-top"><span class="cb-name">'+escapeHtml(title)+'</span>' +
        '<span class="cb-stat">'+c.correct+' / '+c.total+'問（'+rate+'%）</span></div>' +
        '<div class="cb-track"><div class="cb-fill" style="width:'+rate+'%"></div></div>';
      bd.appendChild(row);
    });

    var list = $('review-list');
    list.innerHTML = '';
    if(total === 0){
      list.innerHTML = '<div class="empty-note">出題がありませんでした。</div>';
    }
    state.order.forEach(function(poolIdx, i){
      var q = state.pool[poolIdx];
      var picked = state.answers[i];
      var isCorrect = picked === q.correct;

      var item = document.createElement('div');
      item.className = 'review-item';
      item.setAttribute('data-open','false');

      var head = document.createElement('div');
      head.className = 'review-head';
      head.innerHTML =
        '<span class="review-badge '+(isCorrect?'ok':'ng')+'">'+(isCorrect?'○':'✕')+'</span>' +
        '<span class="review-stem">問'+(i+1)+'　'+escapeHtml(q.stem)+'</span>' +
        '<span class="review-chev">▶</span>';
      head.addEventListener('click', function(){
        var open = item.getAttribute('data-open') === 'true';
        item.setAttribute('data-open', open ? 'false' : 'true');
      });

      var body = document.createElement('div');
      body.className = 'review-body';
      var choiceWrap = document.createElement('div');
      choiceWrap.className = 'choice-list';
      q.choices.forEach(function(choiceText, ci){
        var b = document.createElement('div');
        var cls = '';
        if(ci === q.correct) cls = ' correct-answer';
        else if(ci === picked) cls = ' wrong-answer';
        b.className = 'choice-btn'+cls;
        b.innerHTML = '<span class="cmark">'+MARKS[ci]+'</span><span>'+escapeHtml(choiceText)+'</span>';
        choiceWrap.appendChild(b);
      });
      body.appendChild(choiceWrap);

      var explWrap = document.createElement('div');
      explWrap.className = 'expl-list';
      q.expl.forEach(function(text, ei){
        var row = document.createElement('div');
        var extra = '';
        if(ei === q.correct) extra = ' is-correct';
        else if(ei === picked) extra = ' is-picked-wrong';
        row.className = 'expl-item'+extra;
        row.innerHTML = '<span class="emark">'+MARKS[ei]+'</span><span>'+escapeHtml(text)+'</span>';
        explWrap.appendChild(row);
      });
      body.appendChild(explWrap);

      item.appendChild(head);
      item.appendChild(body);
      list.appendChild(item);
    });

    showView('view-results');
  }

  var expandAll = false;
  $('btn-expand-all').addEventListener('click', function(){
    expandAll = !expandAll;
    document.querySelectorAll('.review-item').forEach(function(el){
      el.setAttribute('data-open', expandAll ? 'true' : 'false');
    });
    $('btn-expand-all').textContent = expandAll ? 'すべて閉じる' : 'すべて開く';
  });

  $('btn-home-from-results').addEventListener('click', function(){ showView('view-home'); });
  $('btn-retry').addEventListener('click', function(){ startSameConditions(); });
  function startSameConditions(){
    if(state.mode === 'exam'){
      var order = shuffle(state.pool.map(function(_,i){return i;}));
      order = order.slice(0, state.order.length);
      state.order = order;
    } else {
      // practice: replay same chapter from its first question
      state.order = state.pool.map(function(_,i){ return i; });
    }
    state.idx = 0;
    state.answers = state.order.map(function(){return null;});
    showView('view-quiz');
    renderQuestion();
  }

  // ---------- view switching ----------
  function showView(id){
    ['view-home','view-quiz','view-results'].forEach(function(v){
      $(v).hidden = (v !== id);
    });
    window.scrollTo(0,0);
  }

  function escapeHtml(s){
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ---------- init ----------
  renderChapterList();
  renderExamCountSelect();
  renderExamScopeSelect();
  updatePoolNote();
})();
</script>

<script>
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
